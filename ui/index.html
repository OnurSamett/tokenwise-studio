<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tokenwise studio</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    --bg: #0a0a0c; --s1: #111114; --s2: #17171b; --s3: #1e1e23;
    --line: #232329; --line2: #303038;
    --text: #ededf0; --muted: #9a9aa3; --dim: #63636d;
    --accent: #8b8fff; --accent-soft: rgba(139,143,255,.14);
    --ok: #5cc98a; --bad: #f07178; --warn: #e8b86a;
    --codex: #5ccfa8; --claude: #e8a07a; --gemini: #84a9ff;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --radius: 12px;
    --add-fg: #a6e9c0; --del-fg: #f5b0b4; --shadow: rgba(0,0,0,.4);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #fafafa; --s1: #ffffff; --s2: #f4f4f5; --s3: #ebebee; --line: #e5e5ea; --line2: #d6d6dd;
    --text: #18181b; --muted: #55555f; --dim: #8b8b95; --accent: #5b5fe0; --accent-soft: rgba(91,95,224,.10);
    --ok: #2f9e62; --bad: #d64550; --warn: #b7791f; --codex: #13906a; --claude: #c2633a; --gemini: #3a6fd8;
    --add-fg: #1f7a46; --del-fg: #b4232f; --shadow: rgba(20,20,40,.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      --bg: #fafafa; --s1: #ffffff; --s2: #f4f4f5; --s3: #ebebee; --line: #e5e5ea; --line2: #d6d6dd;
      --text: #18181b; --muted: #55555f; --dim: #8b8b95; --accent: #5b5fe0; --accent-soft: rgba(91,95,224,.10);
      --ok: #2f9e62; --bad: #d64550; --warn: #b7791f; --codex: #13906a; --claude: #c2633a; --gemini: #3a6fd8;
      --add-fg: #1f7a46; --del-fg: #b4232f; --shadow: rgba(20,20,40,.12);
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; display: flex; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  code { font: 13px var(--mono); background: var(--s3); padding: 1px 6px; border-radius: 5px; }
  pre { font: 13px/1.55 var(--mono); background: var(--s1); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow: auto; margin: 8px 0; }

  /* ---------- sidebar ---------- */
  .side { width: 248px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 14px; font-weight: 600; letter-spacing: -.2px; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; }
  .brand span { color: var(--muted); font-weight: 500; }
  .newtask { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--s2); font-weight: 550; margin-bottom: 14px; }
  .newtask:hover { background: var(--s3); }
  .label { font-size: 12px; color: var(--dim); padding: 6px 10px 4px; }
  .chats { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 1px; }
  .chatitem { text-align: left; background: none; border: 0; border-radius: 9px; padding: 8px 10px; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .chatitem:hover { background: var(--s1); color: var(--text); }
  .chatitem.on { background: var(--s2); color: var(--text); }
  .chatitem .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .sidefoot { border-top: 1px solid var(--line); padding-top: 10px; }
  .usage { padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 12px; }
  .usage .plan { display: flex; flex-direction: column; gap: 7px; }
  .usage .pname { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .usage .pname .badge { width: 18px; height: 18px; border-radius: 5px; font-size: 10.5px; }
  .meter { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; font-size: 12px; color: var(--dim); }
  .meter b { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .meter .track { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: var(--s3); overflow: hidden; }
  .meter .track i { display: block; height: 100%; border-radius: 4px; background: var(--muted); transition: width .4s; }
  .meter.hot .track i { background: var(--warn); } .meter.full .track i { background: var(--bad); }
  .usage .none { font-size: 12px; color: var(--dim); }
  .ghost { background: none; border: 0; color: var(--dim); font-size: 13px; padding: 6px 10px; border-radius: 8px; width: 100%; text-align: left; }
  .ghost:hover { color: var(--text); background: var(--s1); }

  /* ---------- main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); }
  .top h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.2px; }
  .top .sub { color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .menu-btn { display: none; background: none; border: 0; font-size: 20px; color: var(--muted); padding: 4px; }

  .scroll { flex: 1; overflow: auto; }
  .col { max-width: 760px; margin: 0 auto; padding: 28px 24px 40px; }

  .welcome { padding-top: 10vh; text-align: center; }
  .welcome img { width: 44px; height: 44px; border-radius: 12px; }
  .welcome h2 { font-size: 24px; letter-spacing: -.4px; margin: 18px 0 8px; font-weight: 650; }
  .welcome p { color: var(--muted); margin: 0 auto; max-width: 480px; }
  .examples { display: grid; gap: 10px; margin-top: 30px; text-align: left; }
  .examples button { background: var(--s1); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; color: var(--text); text-align: left; transition: border-color .15s, background .15s; }
  .examples button:hover { border-color: var(--line2); background: var(--s2); }
  .examples small { display: block; color: var(--dim); font-size: 12.5px; margin-top: 2px; }

  .turn { margin-bottom: 28px; }
  .you { display: flex; justify-content: flex-end; margin-bottom: 18px; }
  .you div { background: var(--s2); border: 1px solid var(--line2); border-radius: 16px 16px 4px 16px; padding: 10px 15px; max-width: 80%; white-space: pre-wrap; }
  .orch { display: flex; gap: 12px; align-items: flex-start; }
  .avatar { width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 15px; flex: none; margin-top: 1px; }
  .orch-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .say p { margin: 0 0 8px; } .say p:last-child { margin-bottom: 0; } .say ul, .say ol { margin: 0 0 8px; padding-left: 22px; } .say li { margin: 2px 0; }

  .activity { font-size: 13.5px; color: var(--dim); }
  .activity summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 8px; padding: 2px 0; user-select: none; }
  .activity summary::-webkit-details-marker { display: none; }
  .activity summary:hover { color: var(--muted); }
  .activity .chev { transition: transform .15s; display: inline-block; }
  .activity[open] .chev { transform: rotate(90deg); }
  .steps { margin: 8px 0 0 4px; border-left: 1px solid var(--line); padding-left: 14px; display: flex; flex-direction: column; gap: 3px; }
  .step { font: 12.5px/1.5 var(--mono); color: var(--dim); overflow-wrap: anywhere; }
  .step.err { color: var(--bad); }
  .spin { width: 12px; height: 12px; border: 1.5px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .team { background: var(--s1); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; }
  .team-h { display: flex; align-items: center; gap: 8px; padding: 8px 10px 6px; font-size: 13px; color: var(--muted); font-weight: 550; }
  .worker { display: grid; grid-template-columns: 32px minmax(0, 1fr) 120px 48px; gap: 12px; align-items: center; padding: 10px; border-radius: 9px; background: none; border: 0; text-align: left; width: 100%; }
  .worker:hover { background: var(--s2); }
  .badge { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .badge.codex { background: rgba(92,207,168,.12); color: var(--codex); }
  .badge.claude { background: rgba(232,160,122,.12); color: var(--claude); }
  .badge.gemini { background: rgba(132,169,255,.12); color: var(--gemini); }
  .badge.local { background: rgba(200,200,210,.12); color: var(--muted); }
  .badge.free { background: rgba(232,184,106,.12); color: var(--warn); }
  .moved { font-size: 11.5px; color: var(--dim); margin-top: 1px; }
  .w-state.moved { color: var(--dim); }
  .w-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .w-task { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .effort { display: inline-flex; gap: 2px; } .effort i { width: 4px; height: 10px; border-radius: 2px; background: var(--line2); } .effort i.on { background: var(--muted); }
  .bar { height: 4px; border-radius: 4px; background: var(--s3); overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0; border-radius: 4px; }
  .bar.running i { width: 40%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .bar.done i, .bar.merged i { background: var(--ok); } .bar.failed i { background: var(--bad); } .bar.discarded i { background: var(--dim); }
  .w-time { font: 12.5px var(--mono); color: var(--dim); text-align: right; }
  .w-state { font-size: 12px; color: var(--dim); font-weight: 500; }
  .w-state.done { color: var(--ok); } .w-state.failed { color: var(--bad); } .w-state.merged { color: var(--accent); }

  /* review banner + composer */
  .dock { flex: none; padding: 0 24px 20px; }
  .dock-in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .banner { display: flex; align-items: center; gap: 12px; background: var(--s1); border: 1px solid var(--line2); border-radius: var(--radius); padding: 10px 10px 10px 16px; }
  .banner .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .banner .txt { flex: 1; font-size: 14px; } .banner .txt small { color: var(--dim); margin-left: 6px; }
  .btn { border-radius: 9px; padding: 8px 14px; font-weight: 550; font-size: 14px; border: 1px solid var(--line2); background: var(--s2); white-space: nowrap; flex: none; }
  .btn:hover { background: var(--s3); }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.primary:hover { opacity: .88; }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .4; cursor: default; }
  .composer { background: var(--s1); border: 1px solid var(--line2); border-radius: 16px; padding: 12px 12px 10px 16px; transition: border-color .15s; }
  .composer:focus-within { border-color: #44444f; }
  .composer textarea { width: 100%; background: none; border: 0; outline: 0; color: var(--text); font: inherit; resize: none; min-height: 26px; max-height: 220px; }
  .composer textarea::placeholder { color: var(--dim); }
  .crow { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .pill { appearance: none; background: var(--s2); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 26px 4px 11px; font-size: 12.5px; background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position: right 12px center, right 8px center; background-size: 4px 4px; background-repeat: no-repeat; }
  .crow .grow { flex: 1; }
  .pillwrap { position: relative; display: inline-flex; align-items: center; }
  .pillwrap .pilllogo { position: absolute; left: 9px; width: 13px; height: 13px; pointer-events: none; }
  .pill.with-logo { padding-left: 27px; }
  .err { color: var(--bad); font-size: 13px; }
  .send { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); display: grid; place-items: center; font-size: 16px; font-weight: 700; }
  .send:disabled { opacity: .3; cursor: default; }
  .stop { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line2); background: var(--s2); display: grid; place-items: center; }
  .stop i { width: 10px; height: 10px; background: var(--text); border-radius: 2px; }

  /* ---------- drawer ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--s1); border-left: 1px solid var(--line2); transform: translateX(100%); transition: transform .22s ease; z-index: 21; display: flex; flex-direction: column; visibility: hidden; transition: transform .22s ease, visibility 0s .22s; }
  body.drawer-open .scrim { opacity: 1; pointer-events: auto; }
  body.drawer-open .drawer { transform: none; visibility: visible; transition: transform .22s ease; box-shadow: -20px 0 50px var(--shadow); }
  .d-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
  .d-head h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.2px; }
  .d-head .meta { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .x { margin-left: auto; background: none; border: 0; color: var(--dim); font-size: 22px; line-height: 1; padding: 0 2px; }
  .x:hover { color: var(--text); }
  .d-body { flex: 1; overflow: auto; padding: 18px 22px; }
  .d-foot { border-top: 1px solid var(--line); padding: 14px 22px; display: flex; gap: 10px; align-items: center; }
  .d-foot .note { color: var(--dim); font-size: 12.5px; margin-right: auto; }
  .section { margin-bottom: 22px; }
  .section h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 8px; font-weight: 600; }
  .answer { background: var(--s2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .muted { color: var(--muted); }
  .file { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; background: var(--bg); }
  .file > summary { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--s2); cursor: pointer; list-style: none; font-size: 13.5px; }
  .file > summary::-webkit-details-marker { display: none; }
  .file input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .file .fp { flex: 1; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .tag { font-size: 11.5px; color: var(--muted); background: var(--s3); border-radius: 6px; padding: 1px 7px; }
  .plus { color: var(--ok); font: 12.5px var(--mono); } .minus { color: var(--bad); font: 12.5px var(--mono); }
  .diff { font: 12.5px/1.6 var(--mono); overflow: auto; }
  .diff span { display: block; padding: 0 14px; white-space: pre; }
  .diff .a { background: rgba(92,201,138,.12); color: var(--add-fg); } .diff .d { background: rgba(240,113,120,.12); color: var(--del-fg); } .diff .h { color: var(--dim); padding-top: 6px; }
  .tech { margin-top: 6px; } .tech summary { cursor: pointer; color: var(--dim); font-size: 13px; }
  .modal-form { display: grid; gap: 10px; }
  .modal-form select, .modal-form input, .modal-form textarea { background: var(--bg); border: 1px solid var(--line2); color: var(--text); border-radius: 9px; padding: 9px 11px; font: inherit; width: 100%; }
  .modal-form .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .check { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
  .empty { color: var(--dim); text-align: center; padding: 40px 0; }

  .stepi { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--dim); }
  .stepi .gi { width: 14px; text-align: center; flex: none; font-size: 11px; }
  .stepi code { font-size: 12px; background: none; padding: 0; color: var(--muted); }
  .stepi.err { color: var(--bad); }
  .orch-meta { font-size: 12.5px; color: var(--dim); margin: 3px 0 -4px; }
  .orch-meta b { color: var(--muted); font-weight: 600; }
  .orch-meta .plogo { width: 13px; height: 13px; vertical-align: -2px; margin-right: 5px; }
  .moved.handoff { font-size: 12px; margin: 0 0 2px; }
  .say h4 { font-size: 14.5px; margin: 10px 0 6px; font-weight: 650; }
  .chatitem .when { font-size: 11.5px; color: var(--dim); flex: none; }
  .chatitem .rv { font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 0 7px; flex: none; }
  .jump { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(100% + 10px); background: var(--s3); border: 1px solid var(--line2); color: var(--text); border-radius: 999px; padding: 5px 12px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .dock-in { position: relative; }
  .toasts { position: fixed; top: 66px; right: 24px; display: flex; align-items: flex-end; flex-direction: column; gap: 8px; z-index: 40; pointer-events: none; }
  .toast { background: var(--s3); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 14px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: tin .2s ease; display: flex; gap: 8px; align-items: center; }
  .toast.bad { border-color: rgba(240,113,120,.5); } .toast .ti { color: var(--ok); } .toast.bad .ti { color: var(--bad); }
  @keyframes tin { from { opacity: 0; transform: translateY(6px); } }
  .hint { font-size: 12px; color: var(--dim); }
  .chatitem { position: relative; }
  .chatitem .more { display: none; background: none; border: 0; color: var(--dim); padding: 0 4px; font-size: 15px; line-height: 1; flex: none; }
  .chatitem:hover .more, .chatitem.on .more { display: inline; }
  .chatitem:hover .when, .chatitem:hover .rv { display: none; }
  .more:hover { color: var(--text); }
  .pop { position: fixed; z-index: 30; background: var(--s1); border: 1px solid var(--line2); border-radius: 10px; padding: 5px; min-width: 190px; box-shadow: 0 12px 34px var(--shadow); display: flex; flex-direction: column; }
  .pop button, .pop a { background: none; border: 0; text-align: left; padding: 7px 10px; border-radius: 7px; font-size: 13.5px; color: var(--text); }
  .pop button:hover { background: var(--s2); }
  .pop .sep { height: 1px; background: var(--line); margin: 4px 2px; }
  .pop .ph { font-size: 11.5px; color: var(--dim); padding: 6px 10px 2px; }
  .pop .path { font-size: 11.5px; color: var(--dim); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 300px; }
  .pop input { margin: 4px 6px 6px; background: var(--bg); border: 1px solid var(--line2); color: var(--text); border-radius: 7px; padding: 6px 9px; font: 13px inherit; }
  .projbtn { background: none; border: 0; font-size: 15px; font-weight: 600; letter-spacing: -.2px; padding: 4px 8px; margin-left: -8px; border-radius: 8px; display: inline-flex; gap: 6px; align-items: center; }
  .projbtn:hover { background: var(--s1); }
  .projbtn .car { color: var(--dim); font-size: 11px; }
  .cost { font-size: 12.5px; color: var(--dim); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .cost b { color: var(--muted); font-weight: 550; }
  .doctor { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
  .doc { font-size: 12.5px; border: 1px solid var(--line); background: var(--s1); border-radius: 999px; padding: 3px 11px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .doc i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .doc.off i { background: var(--dim); } .doc.warn i { background: var(--warn); }
  .doc code { font-size: 11.5px; }
  .doc .plogo { width: 14px; height: 14px; }
  .worker .badge.has-logo .plogo { width: 20px; height: 20px; }
  .usage .pname .plogo { width: 16px; height: 16px; }
  .footrow { display: flex; gap: 2px; }
  .footrow .ghost { width: auto; flex: 1; }
  .icon-btn { background: none; border: 0; color: var(--dim); border-radius: 8px; padding: 6px 9px; font-size: 14px; }
  .icon-btn:hover { color: var(--text); background: var(--s1); }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 10px 18px; font-size: 14px; align-items: center; }
  kbd { font: 12px var(--mono); background: var(--s2); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 6px; padding: 2px 7px; color: var(--text); white-space: nowrap; }
  .field { display: grid; gap: 6px; } .field label { font-size: 13px; color: var(--muted); }
  .field input, .field textarea { background: var(--bg); border: 1px solid var(--line2); color: var(--text); border-radius: 9px; padding: 9px 11px; font: inherit; width: 100%; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button { text-align: left; background: var(--s1); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .seg button b { display: block; font-size: 14px; margin-bottom: 2px; }
  .seg button span { font-size: 12.5px; color: var(--muted); }
  .seg button.on { border-color: var(--accent); background: var(--accent-soft); }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .presets button { border: 1px solid var(--line2); background: var(--s2); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .presets button.on { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
  /* Role rows: title on its own line, then three aligned controls that never wrap. */
  .rolerow { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .rolerow:last-child { border-bottom: 0; }
  .rolerow .rl { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .rolerow .rl b { font-size: 14px; font-weight: 550; }

  .rolerow .ctl { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1.25fr) minmax(0, 1fr); gap: 8px; }
  .rolerow select, .rolerow .fixed { box-sizing: border-box; height: 34px; background: var(--bg); border: 1px solid var(--line2); color: var(--text); border-radius: 8px; padding: 0 8px; font: 13px/32px inherit; width: 100%; min-width: 0; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
  .rolerow .fixed { color: var(--dim); border-style: dashed; display: flex; align-items: center; }
  .toggle { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-size: 14px; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin-top: 2px; }
  .toggle small { display: block; color: var(--dim); font-size: 12.5px; }
  @media (max-width: 560px) { .rolerow .rl { flex-direction: column; gap: 2px; } .rolerow .rl small { text-align: left; } }
  .rolerow .ctl.with-badge { grid-template-columns: 34px minmax(0, 1.25fr) minmax(0, 1.25fr) minmax(0, 1fr); align-items: center; }
  .rolerow .ctl .badge { width: 34px; height: 34px; border-radius: 9px; font-size: 13px; }
  .plogo { width: 18px; height: 18px; object-fit: contain; flex: none; vertical-align: -4px; }
  .plogo.big { width: 20px; height: 20px; }
  .badge.has-logo { background: var(--s2) !important; border: 1px solid var(--line); }
  .badge.has-logo .plogo { width: 18px; height: 18px; }
  .brandnote { font-size: 11.5px; color: var(--dim); }
  .dtabs { display: flex; gap: 4px; padding: 0 22px; border-bottom: 1px solid var(--line); }
  .dtabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 10px 8px; color: var(--muted); font-size: 13.5px; }
  .dtabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .btable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .btable th { text-align: right; font-weight: 550; color: var(--dim); font-size: 11.5px; padding: 6px 6px; border-bottom: 1px solid var(--line2); white-space: nowrap; }
  .btable th:first-child, .btable td:first-child { text-align: left; }
  .btable td { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; vertical-align: top; }
  .btable td.na { color: var(--dim); }
  .btable td.best { color: var(--ok); font-weight: 650; }
  .btable .mname { display: flex; gap: 7px; align-items: center; font-weight: 550; }
  .btable .served { display: block; color: var(--dim); font-size: 11.5px; font-weight: 400; margin-top: 2px; }
  .btable .vr { font-size: 10.5px; color: var(--warn); }
  .bsrc { font-size: 12px; color: var(--dim); margin-top: 4px; }
  .bsrc a { color: var(--muted); }
  .tablewrap { overflow-x: auto; }
  body.drawer-open .drawer.wide { width: min(980px, 100vw); }
  .bnotes { margin-top: 4px; } .bnotes summary { cursor: pointer; color: var(--dim); font-size: 11.5px; list-style: none; }
  .bnotes summary::-webkit-details-marker { display: none; }
  .bnotes p { margin: 4px 0 0; color: var(--dim); font-size: 12px; font-weight: 400; max-width: 520px; }
  .maker { display: inline-grid; place-items: center; min-width: 22px; height: 18px; padding: 0 5px; border-radius: 5px; font: 700 10.5px/1 -apple-system, sans-serif; letter-spacing: .02em; }
  .goodat { font-size: 12.5px; color: var(--muted); margin-top: 6px; display: flex; gap: 6px; align-items: baseline; }
  .goodat i { font-style: normal; color: var(--dim); }
  .tier { font-size: 11px; border-radius: 999px; padding: 0 7px; line-height: 18px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
  .tier.fast { color: var(--ok); } .tier.balanced { color: var(--accent); } .tier.frontier { color: var(--warn); }
  .mgroup { margin-bottom: 22px; }
  .mgroup h4 { display: flex; align-items: center; gap: 8px; }
  .mgroup h4 .badge { width: 20px; height: 20px; border-radius: 6px; font-size: 11px; }
  .mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .mrow:last-child { border-bottom: 0; }
  .mrow b { font-size: 14px; font-weight: 550; }
  .mrow .good { grid-column: 1 / -1; font-size: 13.5px; color: var(--text); }
  .mrow .note { grid-column: 1 / -1; font-size: 12.5px; color: var(--dim); }
  .mrow.off { opacity: .55; }
  .linkbtn { background: none; border: 0; color: var(--accent); font-size: 13px; padding: 0; }
  .filelist { font: 12.5px var(--mono); color: var(--muted); display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }

  @media (max-width: 760px) {
    .side { position: fixed; inset: 0 auto 0 0; z-index: 22; background: var(--bg); transform: translateX(-100%); transition: transform .2s; }
    body.side-open .side { transform: none; }
    .menu-btn { display: block; }
    .worker { grid-template-columns: 32px minmax(0, 1fr) 44px; } .worker .bar { display: none; }
    .col { padding: 20px 16px 30px; } .dock { padding: 0 16px 14px; } .top { padding: 0 16px; }
    #khint { display: none; } .toasts { left: 16px; right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<body>

<script>
// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
};
const set = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false));
const api = async (p, body) => {
  const r = await fetch("/api/" + p, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json", "x-tokenwise": "1" }, body: JSON.stringify(body) });
  const j = await r.json(); if (j.error) throw new Error(j.error); return j;
};
const clock = (a, b) => { const s = Math.max(0, Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const AGENT = { codex: "Codex", claude: "Claude", gemini: "Gemini", local: "Local", free: "Free API" };
const BADGE = { codex: "C", claude: "A", gemini: "G", local: "L", free: "F" };
const modelName = (m = "") => { const f = String(m).match(/(luna|terra|sol|astra|haiku|sonnet|opus|flash|argon|hydrogen|pro)/i); return f ? f[1][0].toUpperCase() + f[1].slice(1).toLowerCase() : m; };
const effortBars = (e) => { const n = { low: 1, medium: 2, high: 3, xhigh: 4 }[e] || 2; return h("span", { class: "effort", title: `effort: ${e}` }, ...[1, 2, 3].map((i) => h("i", { class: i <= Math.min(n, 3) ? "on" : "" }))); };
const STATE = { running: "working", done: "ready", failed: "failed", merged: "applied", discarded: "discarded", moved: "moved on" };

// Tiny safe markdown: escape first, then inline code / bold, lists and fenced code.
function md(text) {
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const out = []; let list = null, code = null;
  const flush = () => { if (list) { out.push(`<${list.t}>` + list.items.join("") + `</${list.t}>`); list = null; } };
  for (const line of String(text).split("\n")) {
    if (/^\s*```/.test(line)) { if (code) { out.push("<pre>" + esc(code.join("\n")) + "</pre>"); code = null; } else { flush(); code = []; } continue; }
    if (code) { code.push(line); continue; }
    const ol = line.match(/^\s*\d+[.)] (.*)/), ul = line.match(/^\s*[-*] (.*)/);
    if (ol || ul) { const t = ol ? "ol" : "ul"; if (!list || list.t !== t) { flush(); list = { t, items: [] }; } list.items.push("<li>" + inline((ol || ul)[1]) + "</li>"); continue; }
    flush();
    const hd = line.match(/^#{1,4}\s+(.*)/);
    if (hd) { out.push("<h4>" + inline(hd[1]) + "</h4>"); continue; }
    if (line.trim()) out.push("<p>" + inline(line) + "</p>");
  }
  if (code) out.push("<pre>" + esc(code.join("\n")) + "</pre>");
  flush();
  const d = document.createElement("div"); d.className = "say"; d.innerHTML = out.join(""); return d;
}

// ---------- popovers ----------
let popEl = null;
function closePop() { popEl?.remove(); popEl = null; }
function popover(anchor, ...items) {
  closePop();
  const r = anchor.getBoundingClientRect();
  popEl = h("div", { class: "pop" }, ...items);
  document.body.append(popEl);
  const w = popEl.offsetWidth;
  popEl.style.top = Math.min(r.bottom + 6, innerHeight - popEl.offsetHeight - 8) + "px";
  popEl.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
  setTimeout(() => document.addEventListener("click", (e) => { if (popEl && !popEl.contains(e.target)) closePop(); }, { once: true }), 0);
  return popEl;
}

// ---------- theme ----------
const THEMES = ["auto", "light", "dark"];
let theme = "auto"; try { theme = localStorage.getItem("tw-theme") || "auto"; } catch {}
function applyTheme() {
  if (theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  $("#themebtn").textContent = { auto: "◐", light: "☀", dark: "☾" }[theme];
  $("#themebtn").title = `Theme: ${theme} (click to change)`;
}
function cycleTheme() { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; try { localStorage.setItem("tw-theme", theme); } catch {} applyTheme(); toast(`Theme: ${theme}`); }

// Model makers (our own neutral badges, not company logos): initials + a recognisable colour.
const MAKERS = [
  [/mistral/i, "Mi", "#ff7000"], [/deepseek/i, "DS", "#4d6bfe"], [/kimi|moonshot/i, "K", "#9aa0ff"], [/glm|z-ai|zhipu/i, "Z", "#3b82f6"],
  [/nemotron|nvidia/i, "N", "#76b900"], [/step|stepfun/i, "S", "#00b4d8"], [/minimax/i, "MM", "#e8467c"], [/laguna|poolside/i, "P", "#a78bfa"],
  [/gpt-oss|openai/i, "O", "#10a37f"], [/qwen/i, "Q", "#7c3aed"], [/llama|meta/i, "L", "#0866ff"],
];
// Provider / maker logos (assets/providers, unmodified lobe-icons SVGs). mono = single-colour mark.
const LOGO = { codex: "codex", claude: "claude", gemini: "gemini", nvidia: "nvidia" };
const MAKER_LOGO = [[/mistral/i, "mistral"], [/deepseek/i, "deepseek"], [/kimi|moonshot/i, "kimi", true], [/glm|z-ai|zhipu/i, "zhipu"], [/nemotron|nvidia/i, "nvidia"],
  [/step/i, "stepfun"], [/minimax/i, "minimax"], [/llama|meta/i, "meta"], [/qwen/i, "qwen"], [/gpt-oss|openai/i, "openai", true]];
// mono = the mark uses currentColor: ask the server to fill it with the current theme's text colour.
const textHex = () => (getComputedStyle(document.documentElement).getPropertyValue("--text").trim().replace("#", "") || "ededf0");
const logoImg = (name, mono, cls = "plogo") => h("img", { class: cls, src: `/providers/${name}.svg${mono ? "?fg=" + textHex() : ""}`, alt: "", loading: "lazy" });
function makerLogo(model) { const m = MAKER_LOGO.find(([re]) => re.test(String(model || ""))); return m ? logoImg(m[1], m[2]) : null; }
function agentLogo(agent, model) {
  if (agent === "free") { const prov = String(model || "").split(":")[0]; return prov === "nvidia" ? logoImg("nvidia") : null; }
  return LOGO[agent] ? logoImg(LOGO[agent]) : null;
}
function makerBadge(model) {
  const logo = makerLogo(model); if (logo) return logo;
  const id = String(model || "");
  const m = MAKERS.find(([re]) => re.test(id));
  if (!m) return null;
  return h("span", { class: "maker", style: `background:${m[2]}22;color:${m[2]};border:1px solid ${m[2]}55`, title: "model maker" }, m[1]);
}

// ---------- model catalog ----------
let CATALOG = null;
async function loadCatalog() { if (!CATALOG) { try { CATALOG = await api("models"); } catch { CATALOG = { catalog: [], available: {}, ready: {} }; } } return CATALOG; }
function describeModel(agent, model) {
  const list = (CATALOG?.catalog || []).filter((c) => c.agent === agent);
  if (!model || model === "auto") return null;
  const id = String(model).includes(":") ? String(model).split(":").slice(1).join(":") : String(model);
  return list.find((c) => c.family && c.family === id) || list.find((c) => c.match && new RegExp(c.match, "i").test(id)) || null;
}
const TIER = { fast: "Fast", balanced: "Balanced", frontier: "Frontier" };

// Mirrors the server presets so the panel can preview them before saving (the server validates on save).
const PRESET_ROLES = {
  quality: { code: { agent: "codex", model: "sol", effort: "high" }, quick: { agent: "gemini", model: "hydrogen", effort: "medium" }, review: { agent: "claude", model: "opus", effort: "high" }, images: { agent: "codex" } },
  balanced: { code: { agent: "codex", model: "sol", effort: "medium" }, quick: { agent: "free", model: "auto", effort: "medium" }, review: { agent: "claude", model: "sonnet", effort: "medium" }, images: { agent: "codex" } },
  cheap: { code: { agent: "free", model: "auto", effort: "medium" }, quick: { agent: "free", model: "auto", effort: "low" }, review: { agent: "gemini", model: "hydrogen", effort: "low" }, images: { agent: "codex" } },
};

// ---------- state ----------
let S = { repo: "", chats: [], jobs: [] };
let chatId = null, chatFrom = 0, turns = [], drawer = null;

const curChat = () => S.chats.find((c) => c.id === chatId);
const chatJobs = () => S.jobs.filter((j) => j.parent === chatId);
const pending = () => chatJobs().filter((j) => j.write && j.status === "done" && (j.files || []).length);

// ---------- sidebar ----------
const drawn = {};
const changed = (k, v) => { const j = JSON.stringify(v); if (drawn[k] === j) return false; drawn[k] = j; return true; };
function renderSide() {
  const rev = (c) => S.jobs.filter((j) => j.parent === c.id && j.write && j.status === "done" && (j.files || []).length).length;
  const ago = (t) => { const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 1 ? "now" : m < 60 ? m + "m" : m < 1440 ? Math.round(m / 60) + "h" : Math.round(m / 1440) + "d"; };
  if (!changed("side", [chatId, Math.floor(Date.now() / 60000), S.chats.map((c) => [c.id, c.title, c.status, rev(c)])])) return;
  set($("#chats"), S.chats.length ? S.chats.map((c) => h("button", { class: "chatitem" + (c.id === chatId ? " on" : ""), onclick: () => { openChat(c.id); document.body.classList.remove("side-open"); } },
    h("span", { class: "t" }, c.title), c.status === "running" ? h("span", { class: "live", title: "working" }) : rev(c) ? h("span", { class: "rv" }, `${rev(c)} to review`) : h("span", { class: "when" }, ago(c.turns?.at(-1)?.started || c.created)),
    h("span", { class: "more", role: "button", title: "More", onclick: (e) => { e.stopPropagation(); chatMenu(e.currentTarget, c); } }, "⋯"))) : h("div", { class: "label" }, "No tasks yet"));
}

function chatMenu(anchor, c) {
  popover(anchor,
    h("button", { onclick: () => { closePop(); openDrawer("rename", c.id); } }, "Rename"),
    h("div", { class: "sep" }),
    h("button", { class: "danger", style: "color:var(--bad)", onclick: () => { closePop(); openDrawer("delete", c.id); } }, "Delete…"));
}

// ---------- conversation ----------
function welcome() {
  const ex = [
    ["Fix the failing tests", "Each independent fix goes to a Codex worker; you review before anything lands."],
    ["Explain how this project is structured", "Cheap Claude Haiku workers do the reading, the orchestrator writes the summary."],
    ["Add tests for the least-tested module", "A Codex worker writes them in its own branch, then the tests are run."],
  ];
  return h("div", { class: "welcome" }, h("img", { src: "/logo.png", alt: "" }),
    h("h2", {}, "What should the team work on?"),
    h("p", {}, "Describe a task. The orchestrator plans it and hands pieces to Codex, Claude or Gemini workers. Every change waits for your review."),
    h("div", { class: "examples" }, ex.map(([t, s]) => h("button", { onclick: () => { $("#input").value = t; autosize(); $("#send").disabled = false; $("#input").focus(); } }, t, h("small", {}, s)))),
    doctorRow());
}

function doctorRow() {
  const row = h("div", { class: "doctor" });
  const fix = { claude: "claude auth login", codex: "codex login", gemini: "export GEMINI_API_KEY=…" };
  api("doctor").then((d) => {
    set(row, ["claude", "codex", "gemini", "local", "free"].map((k) => {
      const v = d[k] || {};
      const cls = v.installed && v.signedIn ? "" : v.installed ? " warn" : " off";
      const label = v.installed && v.signedIn ? (v.via === "antigravity" ? "ready · Antigravity" : k === "local" ? `ready · ${v.model}` : k === "free" ? `ready · ${v.via}` : "ready")
        : v.fix ? h("code", {}, v.fix)
        : v.installed ? (v.via === "antigravity" ? ["sign in: ", h("code", {}, "agy")] : [k === "gemini" ? "API key: " : "sign in: ", h("code", {}, fix[k])]) : "not installed";
      return h("span", { class: "doc" + cls, title: v.installed ? "" : `npm i -g ${k === "claude" ? "@anthropic-ai/claude-code" : k === "codex" ? "@openai/codex" : "@google/gemini-cli"}` }, (k === "free" ? logoImg("nvidia") : agentLogo(k)) || h("i"), AGENT[k], " · ", label);
    }));
  }).catch(() => {});
  return row;
}

// One DOM block per turn: user bubble, then orchestrator body (activity, team, replies).
function turnBlock(i) {
  if (turns[i]) return turns[i];

}
