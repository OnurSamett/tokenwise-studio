<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tokenwise studio</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    --bg: #0a0a0c; --s1: #111114; --s2: #17171b; --s3: #1e1e23;
    --line: #232329; --line2: #303038;
    --text: #ededf0; --muted: #9a9aa3; --dim: #63636d;
    --accent: #8b8fff; --accent-soft: rgba(139,143,255,.14);
    --ok: #5cc98a; --bad: #f07178; --warn: #e8b86a;
    --codex: #5ccfa8; --claude: #e8a07a; --gemini: #84a9ff;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --radius: 12px;
    --add-fg: #a6e9c0; --del-fg: #f5b0b4; --shadow: rgba(0,0,0,.4);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #fafafa; --s1: #ffffff; --s2: #f4f4f5; --s3: #ebebee; --line: #e5e5ea; --line2: #d6d6dd;
    --text: #18181b; --muted: #55555f; --dim: #8b8b95; --accent: #5b5fe0; --accent-soft: rgba(91,95,224,.10);
    --ok: #2f9e62; --bad: #d64550; --warn: #b7791f; --codex: #13906a; --claude: #c2633a; --gemini: #3a6fd8;
    --add-fg: #1f7a46; --del-fg: #b4232f; --shadow: rgba(20,20,40,.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      --bg: #fafafa; --s1: #ffffff; --s2: #f4f4f5; --s3: #ebebee; --line: #e5e5ea; --line2: #d6d6dd;
      --text: #18181b; --muted: #55555f; --dim: #8b8b95; --accent: #5b5fe0; --accent-soft: rgba(91,95,224,.10);
      --ok: #2f9e62; --bad: #d64550; --warn: #b7791f; --codex: #13906a; --claude: #c2633a; --gemini: #3a6fd8;
      --add-fg: #1f7a46; --del-fg: #b4232f; --shadow: rgba(20,20,40,.12);
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; display: flex; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  code { font: 13px var(--mono); background: var(--s3); padding: 1px 6px; border-radius: 5px; }
  pre { font: 13px/1.55 var(--mono); background: var(--s1); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow: auto; margin: 8px 0; }

  /* ---------- sidebar ---------- */
  .side { width: 248px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 14px; font-weight: 600; letter-spacing: -.2px; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; }
  .brand span { color: var(--muted); font-weight: 500; }
  .newtask { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--s2); font-weight: 550; margin-bottom: 14px; }
  .newtask:hover { background: var(--s3); }
  .label { font-size: 12px; color: var(--dim); padding: 6px 10px 4px; }
  .chats { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 1px; }
  .chatitem { text-align: left; background: none; border: 0; border-radius: 9px; padding: 8px 10px; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .chatitem:hover { background: var(--s1); color: var(--text); }
  .chatitem.on { background: var(--s2); color: var(--text); }
  .chatitem .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .sidefoot { border-top: 1px solid var(--line); padding-top: 10px; }
  .usage { padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 12px; }
  .usage .plan { display: flex; flex-direction: column; gap: 7px; }
  .usage .pname { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .usage .pname .badge { width: 18px; height: 18px; border-radius: 5px; font-size: 10.5px; }
  .meter { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; font-size: 12px; color: var(--dim); }
  .meter b { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .meter .track { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: var(--s3); overflow: hidden; }
  .meter .track i { display: block; height: 100%; border-radius: 4px; background: var(--muted); transition: width .4s; }
  .meter.hot .track i { background: var(--warn); } .meter.full .track i { background: var(--bad); }
  .usage .none { font-size: 12px; color: var(--dim); }
  .orchnow { display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; border-radius: 9px; background: var(--s1); border: 1px solid var(--line); }
  .orchnow .on { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--text); }
  .orchnow .on .plogo { width: 16px; height: 16px; }
  .orchnow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok, #3fb950); margin-left: auto; flex: none; }
  .orchnow.moved .dot { background: var(--warn); }
  .orchnow.pacing { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .orchnow.pacing .dot { background: var(--accent); }
  .orchnow.cooling .dot { background: var(--bad); }
  .orch-tag { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 999px; letter-spacing: .01em; }
  .orch-tag.pacing { background: var(--accent-soft); color: var(--accent); }
  .orchnow .why { font-size: 11.5px; color: var(--dim); line-height: 1.35; }
  .cooldown-line { font-size: 11.5px; color: var(--bad); line-height: 1.35; }
  .approx-tag { margin-left: auto; font-size: 10.5px; font-weight: 500; color: var(--dim); background: var(--s2); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; }
  .pacing-note { font-size: 12.5px; color: var(--accent); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 9px; padding: 8px 11px; margin-bottom: 12px; }
  .ghost { background: none; border: 0; color: var(--dim); font-size: 13px; padding: 6px 10px; border-radius: 8px; width: 100%; text-align: left; }
  .ghost:hover { color: var(--text); background: var(--s1); }

  /* ---------- main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); }
  .top h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.2px; }
  .top .sub { color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .menu-btn { display: none; background: none; border: 0; font-size: 20px; color: var(--muted); padding: 4px; }

  .scroll { flex: 1; overflow: auto; }
  .col { max-width: 760px; margin: 0 auto; padding: 28px 24px 40px; }

  .welcome { padding-top: 10vh; text-align: center; }
  .welcome img { width: 44px; height: 44px; border-radius: 12px; }
  .welcome h2 { font-size: 24px; letter-spacing: -.4px; margin: 18px 0 8px; font-weight: 650; }
  .welcome p { color: var(--muted); margin: 0 auto; max-width: 480px; }
  .examples { display: grid; gap: 10px; margin-top: 30px; text-align: left; }
  .examples button { background: var(--s1); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; color: var(--text); text-align: left; transition: border-color .15s, background .15s; }
  .examples button:hover { border-color: var(--line2); background: var(--s2); }
  .examples small { display: block; color: var(--dim); font-size: 12.5px; margin-top: 2px; }

  .turn { margin-bottom: 28px; }
  .you { display: flex; justify-content: flex-end; margin-bottom: 18px; }
  .you > div { background: var(--s2); border: 1px solid var(--line2); border-radius: 16px 16px 4px 16px; padding: 10px 15px; max-width: 80%; white-space: pre-wrap; }
  .orch { display: flex; gap: 12px; align-items: flex-start; }
  .avatar { width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 15px; flex: none; margin-top: 1px; }
  .orch-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .say p { margin: 0 0 8px; } .say p:last-child { margin-bottom: 0; } .say ul, .say ol { margin: 0 0 8px; padding-left: 22px; } .say li { margin: 2px 0; }
  .say a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .say a:hover { opacity: .88; }
  .say a.cite { display: inline-block; text-decoration: none; background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 0 5px; font: 600 12px/1.45 var(--mono); margin: 0 1px; }
  .say a.cite:hover { background: var(--accent); color: var(--bg); opacity: 1; }
  .sources { margin-top: 8px; padding: 8px 11px; border: 1px solid var(--line); background: var(--s1); border-radius: 10px; font-size: 12.5px; }
  .answer .sources { background: var(--bg); }
  .sources-h { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin-bottom: 5px; }
  .sources-list { display: flex; flex-direction: column; gap: 4px; }
  .source-item { display: flex; align-items: baseline; gap: 7px; min-width: 0; line-height: 1.4; }
  .source-num { font: 600 11.5px var(--mono); color: var(--accent); flex: none; }
  .source-link { color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .source-link:hover { color: var(--accent); text-decoration: underline; }
  .source-text { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .source-host { color: var(--dim); font: 11px var(--mono); flex: none; margin-left: auto; padding-left: 8px; }

  .activity { font-size: 13.5px; color: var(--dim); }
  .activity summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 8px; padding: 2px 0; user-select: none; }
  .activity summary::-webkit-details-marker { display: none; }
  .activity summary:hover { color: var(--muted); }
  .activity .chev { transition: transform .15s; display: inline-block; }
  .activity[open] .chev { transform: rotate(90deg); }
  .steps { margin: 8px 0 0 4px; border-left: 1px solid var(--line); padding-left: 14px; display: flex; flex-direction: column; gap: 3px; }
  .step { font: 12.5px/1.5 var(--mono); color: var(--dim); overflow-wrap: anywhere; }
  .step.err { color: var(--bad); }
  .spin { width: 12px; height: 12px; border: 1.5px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .team { background: var(--s1); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; }
  .team-h { display: flex; align-items: center; gap: 8px; padding: 8px 10px 6px; font-size: 13px; color: var(--muted); font-weight: 550; }
  .worker { display: grid; grid-template-columns: 32px minmax(0, 1fr) 120px 48px; gap: 12px; align-items: center; padding: 10px; border-radius: 9px; background: none; border: 0; text-align: left; width: 100%; }
  .worker:hover { background: var(--s2); }
  .badge { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .badge.codex { background: rgba(92,207,168,.12); color: var(--codex); }
  .badge.claude { background: rgba(232,160,122,.12); color: var(--claude); }
  .badge.gemini { background: rgba(132,169,255,.12); color: var(--gemini); }
  .badge.local { background: rgba(200,200,210,.12); color: var(--muted); }
  .badge.free { background: rgba(232,184,106,.12); color: var(--warn); }
  .moved { font-size: 11.5px; color: var(--dim); margin-top: 1px; }
  .w-state.moved { color: var(--dim); }
  .w-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .w-task { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .effort { display: inline-flex; gap: 2px; } .effort i { width: 4px; height: 10px; border-radius: 2px; background: var(--line2); } .effort i.on { background: var(--muted); }
  .bar { height: 4px; border-radius: 4px; background: var(--s3); overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0; border-radius: 4px; }
  .bar.running i { width: 40%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .bar.done i, .bar.merged i { background: var(--ok); } .bar.failed i { background: var(--bad); } .bar.discarded i, .bar.undone i { background: var(--dim); }
  .w-time { font: 12.5px var(--mono); color: var(--dim); text-align: right; }
  .w-state { font-size: 12px; color: var(--dim); font-weight: 500; }
  .w-state.done { color: var(--ok); } .w-state.failed { color: var(--bad); } .w-state.merged { color: var(--accent); } .w-state.undone { color: var(--muted); }

  /* review banner + composer */
  .dock { flex: none; padding: 0 24px 20px; }
  .dock-in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .banner { display: flex; flex-direction: column; gap: 8px; background: var(--s1); border: 1px solid var(--line2); border-radius: var(--radius); padding: 10px 10px 10px 16px; }
  .banner-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .banner .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .banner .txt { flex: 1; min-width: 160px; font-size: 14px; } .banner .txt small { color: var(--dim); margin-left: 6px; }
  .banner-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .banner-check { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .banner-check .crow2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .banner-check pre { margin: 0; max-height: 170px; overflow: auto; font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .nongit { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--s1); border: 1px solid var(--line2); border-radius: var(--radius); padding: 10px 10px 10px 14px; }
  .nongit .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .nongit .txt { flex: 1; min-width: 180px; font-size: 13.5px; color: var(--muted); }
  .btn { border-radius: 9px; padding: 8px 14px; font-weight: 550; font-size: 14px; border: 1px solid var(--line2); background: var(--s2); white-space: nowrap; flex: none; }
  .btn:hover { background: var(--s3); }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.primary:hover { opacity: .88; }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .4; cursor: default; }
  .composer { background: var(--s1); border: 1px solid var(--line2); border-radius: 16px; padding: 12px 12px 10px 16px; transition: border-color .15s; }
  .attachments { display: flex; gap: 8px; flex-wrap: wrap; }
  .attachments:not(:empty) { margin-bottom: 10px; }
  .attachment { position: relative; }
  .attachment img, .chat-images img { width: 88px; height: 72px; object-fit: cover; border: 1px solid var(--line2); border-radius: 9px; }
  .attachment button { position: absolute; right: -4px; top: -4px; border: 1px solid var(--line2); border-radius: 50%; background: var(--s2); color: var(--text); width: 22px; height: 22px; padding: 0; display: grid; place-items: center; font-size: 13px; line-height: 1; }
  .chat-images { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chat-images:first-child { margin-top: 0; }
  .composer.dragging { border-color: #818cf8; background: var(--s2); }
  .composer.dictating { border-color: var(--accent); }
  .composer .attach:hover, .composer .mic:hover { color: #818cf8; background: var(--s2); }
  .composer .mic { display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .15s, color .15s, border-color .15s; }
  .composer .mic .mic-live { display: none; align-items: center; gap: 6px; }
  .composer .mic.recording { background: var(--accent-soft); color: var(--text); border: 1px solid var(--accent); padding: 5px 9px; }
  .composer .mic.recording:hover { background: var(--accent-soft); color: var(--text); }
  .composer .mic.recording .mic-ico { display: none; }
  .composer .mic.recording .mic-live { display: inline-flex; }
  .composer .mic .mic-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; flex: none; }
  .composer .mic .mic-stop { width: 9px; height: 9px; border-radius: 2px; background: currentColor; flex: none; }
  .thinking { color: var(--muted); font-size: 13px; margin: 8px 0 12px; }
  .thinking summary { cursor: pointer; }
  .thinking-text { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow-y: auto; margin-top: 8px; line-height: 1.6; }
  .composer:focus-within { border-color: #44444f; }
  .composer textarea { width: 100%; background: none; border: 0; outline: 0; color: var(--text); font: inherit; resize: none; min-height: 26px; max-height: 220px; }
  .composer textarea::placeholder { color: var(--dim); }
  .crow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .pill { appearance: none; background: var(--s2); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 26px 4px 11px; font-size: 12.5px; background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position: right 12px center, right 8px center; background-size: 4px 4px; background-repeat: no-repeat; }
  .crow .grow { flex: 1; }
  .pillwrap { position: relative; display: inline-flex; align-items: center; }
  .pillwrap .pilllogo { position: absolute; left: 9px; width: 13px; height: 13px; pointer-events: none; }
  .pill.with-logo { padding-left: 27px; }
  .err { color: var(--bad); font-size: 13px; }
  .err:not(:empty) { margin-right: 10px; }
  .send { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); display: grid; place-items: center; font-size: 16px; font-weight: 700; }
  .send:disabled { opacity: .3; cursor: default; }
  .stop { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line2); background: var(--s2); display: grid; place-items: center; }
  .stop i { width: 10px; height: 10px; background: var(--text); border-radius: 2px; }

  /* ---------- drawer ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--s1); border-left: 1px solid var(--line2); transform: translateX(100%); transition: transform .22s ease; z-index: 21; display: flex; flex-direction: column; visibility: hidden; transition: transform .22s ease, visibility 0s .22s; }
  body.drawer-open .scrim { opacity: 1; pointer-events: auto; }
  body.drawer-open .drawer { transform: none; visibility: visible; transition: transform .22s ease; box-shadow: -20px 0 50px var(--shadow); }
  .d-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
  .d-head h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.2px; }
  .d-head .meta { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .x { margin-left: auto; background: none; border: 0; color: var(--dim); font-size: 22px; line-height: 1; padding: 0 2px; }
  .x:hover { color: var(--text); }
  .d-body { flex: 1; overflow: auto; padding: 18px 22px; }
  .d-foot { border-top: 1px solid var(--line); padding: 14px 22px; display: flex; gap: 10px; align-items: center; }
  .d-foot .note { color: var(--dim); font-size: 12.5px; margin-right: auto; }
  .section { margin-bottom: 22px; }
  .section h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 8px; font-weight: 600; }
  .answer { background: var(--s2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .muted { color: var(--muted); }
  .file { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; background: var(--bg); }
  .file > summary { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--s2); cursor: pointer; list-style: none; font-size: 13.5px; }
  .file > summary::-webkit-details-marker { display: none; }
  .file input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .file .fp { flex: 1; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }

  /* ---------- side workspace panel ---------- */
  .ws-toggle { margin-left: auto; background: var(--s2); border: 1px solid var(--line); color: var(--muted); border-radius: 9px; padding: 5px 11px; font-size: 13px; font-weight: 550; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; }
  .ws-toggle:hover { color: var(--text); border-color: var(--line2); background: var(--s3); }
  .ws-toggle.on { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
  .ws-resizer { width: 5px; flex: none; cursor: col-resize; background: transparent; border-left: 1px solid var(--line); transition: background .15s, border-color .15s; }
  .ws-resizer:hover, body.ws-resizing .ws-resizer { background: var(--accent-soft); border-left-color: var(--accent); }
  body.ws-resizing { user-select: none; cursor: col-resize; }
  .ws-panel { flex: none; width: 460px; min-width: 320px; background: var(--s1); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .ws-head { height: 56px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-bottom: 1px solid var(--line); }
  .ws-tabs { display: flex; gap: 2px; height: 100%; align-items: stretch; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .ws-tabs::-webkit-scrollbar { display: none; }
  .ws-tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 8px; font-size: 12.5px; font-weight: 550; color: var(--muted); white-space: nowrap; flex: none; }
  .ws-tabs button:hover { color: var(--text); }
  .ws-tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .ws-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .ws-tree-wrap { flex: none; max-height: 40%; min-height: 110px; overflow: auto; border-bottom: 1px solid var(--line); padding: 6px; background: var(--bg); display: flex; flex-direction: column; gap: 1px; }
  .ws-tree-wrap.full { flex: 1; max-height: none; border-bottom: 0; }
  .ws-tree-item { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; background: none; border: 0; border-radius: 7px; padding: 4px 8px; padding-left: calc(8px + var(--depth, 0) * 14px); font-size: 13px; color: var(--muted); }

  .ws-tree-item.open .chev { transform: rotate(90deg); }

  .ws-tree-more { margin: 4px 0 2px; margin-left: calc(8px + var(--depth, 0) * 14px); align-self: flex-start; background: var(--s2); border: 1px solid var(--line2); border-radius: 7px; padding: 3px 9px; font-size: 12px; color: var(--muted); }
  .ws-tree-more:hover { color: var(--text); background: var(--s3); }
  .ws-file-bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); background: var(--s2); font-size: 12.5px; min-width: 0; }
  .ws-file-bar .fp { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); color: var(--text); }
  .ws-mini-btn { background: var(--s1); border: 1px solid var(--line2); color: var(--muted); border-radius: 7px; padding: 2px 8px; font-size: 11.5px; white-space: nowrap; flex: none; }
  .ws-mini-btn:hover { color: var(--text); background: var(--s3); }

  .tok-kw { color: var(--accent); font-weight: 550; }

  .tok-key { color: var(--accent); }
  .tok-hd { color: var(--accent); font-weight: 650; }
  .ws-scroll { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
  .ws-diff-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 8px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .ws-diff-summary { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12.5px; color: var(--muted); }

  .ws-md-preview { padding: 4px 2px; font-size: 14.5px; line-height: 1.6; }

  .ws-md-preview hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .ws-empty { color: var(--dim); text-align: center; padding: 36px 18px; font-size: 13.5px; line-height: 1.5; }
  .ws-chat-summary { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
  .ws-chat-group { margin-bottom: 14px; }
  .ws-chat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .ws-chat-list { display: flex; flex-direction: column; gap: 4px; }
  .ws-chat-item { display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; background: var(--s2); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; transition: background .12s, border-color .12s; }
  .ws-chat-item:hover { background: var(--s3); border-color: var(--line2); }
  .ws-chat-item.on { background: var(--accent-soft); border-color: var(--accent); }
  .ws-chat-row { display: flex; align-items: center; gap: 7px; min-width: 0; width: 100%; }
  .ws-chat-name { font-family: var(--mono); font-size: 12.5px; font-weight: 550; color: var(--text); white-space: nowrap; flex-shrink: 0; max-width: 65%; overflow: hidden; text-overflow: ellipsis; }
  .ws-chat-dir { font-family: var(--mono); font-size: 11.5px; color: var(--dim); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-chat-stat { font: 11.5px var(--mono); display: inline-flex; gap: 4px; flex: none; }
  .ws-chat-meta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--dim); min-width: 0; }
  .ws-chat-meta .jt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-chat-badge { font-size: 11px; font-weight: 550; border-radius: 6px; padding: 1px 6px; white-space: nowrap; flex: none; }
  .ws-chat-badge.read { background: var(--s3); color: var(--muted); }
  .ws-chat-badge.edited { background: var(--accent-soft); color: var(--accent); }
  .ws-chat-badge.new { background: rgba(92,201,138,.14); color: var(--ok); }
  .ws-chat-badge.applied { background: rgba(92,201,138,.12); color: var(--ok); border: 1px solid rgba(92,201,138,.25); }
  .file.is-focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft); }
  .file-ref { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; cursor: pointer; }
  .file-ref:hover { opacity: .88; text-decoration-style: solid; }
  .file-ref.code-ref { text-decoration: none; }
  .file-ref.code-ref code { color: var(--accent); background: var(--accent-soft); border: 1px solid rgba(139,143,255,.32); }
  .file-ref.code-ref:hover code { border-color: var(--accent); }
  @media (max-width: 899px) { .ws-panel, .ws-resizer, .ws-toggle { display: none !important; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* Softer translucent surfaces while retaining system light and dark themes. */
  :root { --bg: #202126; --s1: #282a30; --s2: #303239; --s3: #393b44; --line: #3a3c45; --line2: #4b4e59; --dim: #a0a2ae; --muted: #bfc1cc; }
  .side { background: color-mix(in srgb, var(--s1) 88%, transparent); backdrop-filter: blur(24px); }
  .top { background: color-mix(in srgb, var(--s1) 65%, transparent); backdrop-filter: blur(22px); }
  .composer { background: color-mix(in srgb, var(--s1) 88%, transparent); backdrop-filter: blur(28px); box-shadow: 0 12px 36px rgba(0,0,0,.14), inset 0 1px rgba(255,255,255,.06); border-radius: 20px; }
  .drawer { background: color-mix(in srgb, var(--s1) 94%, transparent); backdrop-filter: blur(30px); }
  .scrim { background: rgba(0,0,0,.22); }
  .pill { background-color: color-mix(in srgb, var(--s2) 80%, transparent); border-color: var(--line2); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-contrast: more) { .side, .top, .composer, .drawer { backdrop-filter: none; background: var(--s1); } }

  /* Model shootout (graphite + indigo, no yellow) */
  .pop .pop-sub { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 1px; }
  .composer-so-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 0 0 8px; padding: 7px 10px; border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 10%, var(--s2));
    border: 1px solid color-mix(in srgb, var(--accent) 34%, var(--line2));
    font-size: 12px; color: var(--ink);
  }
  .composer-so-bar[hidden] { display: none; }
  .shootout-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 36%, transparent);
    white-space: nowrap;
  }
  .composer-so-bar .x {
    background: transparent; border: 0; color: var(--muted); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 2px 5px; border-radius: 6px;
  }
  .composer-so-bar .x:hover { background: var(--s3); color: var(--ink); }
  .shootout-group {
    border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--line));
    background: color-mix(in srgb, var(--accent) 5%, var(--s1));
    border-radius: 10px; padding: 8px 10px; margin-top: 6px;
  }
  .shootout-group-h {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink);
  }
  .shootout-warn {
    padding: 10px 12px; border-radius: 10px; margin-bottom: 14px;
    background: color-mix(in srgb, var(--accent) 9%, var(--s2));
    border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line2));
    font-size: 12.8px; line-height: 1.45;
  }
  .shootout-warn b { display: block; color: var(--ink); margin-bottom: 3px; }
  .shootout-warn span { color: var(--muted); }
  .shootout-workers { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .shootout-worker-row {
    display: grid; grid-template-columns: 64px minmax(105px, 1fr) minmax(130px, 1.25fr) minmax(92px, .85fr) auto;
    gap: 8px; align-items: center;
  }
  .shootout-worker-row .slot { font-size: 12px; font-weight: 600; color: var(--muted); }
  @media (max-width: 680px) {
    .shootout-worker-row { grid-template-columns: 1fr 1fr; }
    .shootout-worker-row .slot { grid-column: 1 / -1; }
  }
  body.drawer-open .drawer.shootout-wide { width: min(1240px, 96vw); }
  .shootout-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 14px; align-items: start;
  }
  .so-col {
    background: var(--s2); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
  }
  .so-col.picked {
    border-color: var(--ok);

  /* Effort-aware thinking indicator & sticky working banner */
  .think { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); padding: 2px 0; }
  .think .orb { position: relative; width: 14px; height: 14px; border-radius: 50%; background: var(--accent-soft); flex: none; display: inline-flex; align-items: center; justify-content: center; }
  .think .orb::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: tw-breathe 1.8s ease-in-out infinite; }
  .think .orb::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 1.5px solid transparent; border-top-color: var(--accent); opacity: 0; }
  .think .lab { background: linear-gradient(90deg, var(--muted) 0%, var(--text) 45%, var(--muted) 90%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: tw-shimmer 2.4s linear infinite; font-weight: 500; }
  .think .eff { font: 500 10.5px/1 var(--mono); padding: 2px 6px; border-radius: 99px; background: var(--s2); border: 1px solid var(--line); color: var(--muted); }
  [data-eff="low"] .think .orb::before { animation-duration: 2.6s; opacity: .75; }
  [data-eff="low"] .think .lab { animation-duration: 3.2s; }
  [data-eff="medium"] .think .orb::before { animation-duration: 1.7s; }
  [data-eff="medium"] .think .lab { animation-duration: 2.2s; }
  [data-eff="high"] .think .orb::before { animation-duration: 1.2s; }
  [data-eff="high"] .think .orb::after { opacity: .85; animation: tw-ring 1.6s ease-out infinite; }
  [data-eff="high"] .think .lab { animation-duration: 1.6s; }
  [data-eff="xhigh"] .think .orb::before { animation-duration: .85s; box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 70%, transparent); }
  [data-eff="xhigh"] .think .orb::after { opacity: 1; border-right-color: color-mix(in srgb, var(--accent) 55%, transparent); animation: tw-orbit .9s linear infinite; }
  [data-eff="xhigh"] .think .lab { animation-duration: 1.1s; }
  @keyframes tw-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @keyframes tw-breathe { 0%, 100% { transform: scale(.82); opacity: .72; } 50% { transform: scale(1.12); opacity: 1; } }
  @keyframes tw-ring { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(1.45); opacity: 0; } }
  @keyframes tw-orbit { to { transform: rotate(360deg); } }

  /* Per-worker effort progress animation */
  .worker { position: relative; }
  .worker.running::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 3px; background: var(--accent); animation: tw-breathe 1.5s ease-in-out infinite; }
  .worker[data-eff="low"] { --eff-dur: 2.8s; }
  .worker[data-eff="medium"] { --eff-dur: 1.8s; }
  .worker[data-eff="high"] { --eff-dur: 1.2s; }
  .worker[data-eff="xhigh"] { --eff-dur: .85s; }
  .worker .bar.running i { animation-duration: var(--eff-dur, 1.8s); }
  .worker.running[data-eff="xhigh"]::before { animation-duration: .85s; }
  .worker.running[data-eff="high"]::before { animation-duration: 1.15s; }
  .worker.running[data-eff="low"]::before { animation-duration: 2.5s; }

  /* Sticky working banner */
  .workbanner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 18px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--s1) 92%, var(--accent) 8%); font-size: 12.5px; z-index: 4; flex: none; }
  .workbanner[hidden] { display: none; }
  .workbanner-l { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .workbanner-r { display: flex; align-items: center; gap: 10px; flex: none; }
  .wb-meta { font: 500 11.5px/1 var(--mono); color: var(--muted); white-space: nowrap; }
  .wb-stop { height: 26px; padding: 0 11px; border-radius: 7px; border: 1px solid color-mix(in srgb, var(--bad) 45%, var(--line)); background: color-mix(in srgb, var(--bad) 10%, var(--bg)); color: var(--bad); font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
  .wb-stop:hover { background: var(--bad); color: #fff; border-color: var(--bad); }

  /* Reduced motion & Settings animation toggle */
  body.no-anim .think .orb::before, body.no-anim .think .orb::after, body.no-anim .think .lab,
  body.no-anim .worker.running::before, body.no-anim .worker .bar.running i, body.no-anim .chatitem .st.run,
  body.no-anim .spin, body.no-anim .live { animation: none !important; }
  body.no-anim .think .lab { background: none; color: var(--text); -webkit-text-fill-color: currentColor; }
  body.no-anim .think .orb::after { display: none; }
  body.no-anim .bar.running i { width: 55%; background: var(--accent); opacity: .75; }
  @media (prefers-reduced-motion: reduce) {
    .think .orb::before, .think .orb::after, .think .lab,
    .worker.running::before, .worker .bar.running i, .chatitem .st.run,
    .spin, .live { animation: none !important; }
    .think .lab { background: none; color: var(--text); -webkit-text-fill-color: currentColor; }
    .think .orb::after { display: none; }
    .bar.running i { width: 55%; background: var(--accent); opacity: .75; }
  }

  /* Centered modal overlay for Command Palette & Shortcuts sheet */
  .overlay { position: fixed; inset: 0; z-index: 90; background: rgba(10, 12, 18, .54); backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center; padding: clamp(32px, 10vh, 96px) 16px 24px; }

  .palette { width: min(600px, 100%); max-height: min(520px, 78vh); display: flex; flex-direction: column; background: var(--s1); border: 1px solid var(--line); border-radius: 13px; box-shadow: 0 22px 60px var(--shadow); overflow: hidden; }
  .pal-top { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .pal-top svg { color: var(--muted); flex: none; }

// ---------- helpers ----------

function startCreateFolder(onCreated = null) {
  creatingFolder = true;
  editingFolderId = null;
  delete drawn.side;
  renderSide();
  const inp = $("#newfolderin");
  if (!inp) return;
  let settled = false;
  const finish = async (save) => {
    if (settled) return;
    settled = true;
    const name = inp.value.trim();
    creatingFolder = false;
    delete drawn.side;
    if (save && name) {
      const before = new Set(folderState().folders.map((f) => f.id));
      const next = await folderApi({ action: "create", name }).catch(() => null);
      if (next && onCreated) {
        const added = next.folders.find((f) => !before.has(f.id)) || next.folders.at(-1);
        if (added) await onCreated(added);
      }
    } else {
      renderSide();
    }
  };
  inp.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    else if (e.key === "Escape") { e.preventDefault(); finish(false); }
  };
  inp.onblur = () => finish(false);
  inp.focus();
}

  const rev = (c) => S.jobs.filter((j) => j.parent === c.id && j.write && j.status === "done" && (j.files || []).length).length;
  const ago = (tm) => { const m = Math.round((Date.now() - new Date(tm)) / 60000); return m < 1 ? t("side.ago.now") : m < 60 ? t("side.ago.m", { n: m }) : m < 1440 ? t("side.ago.h", { n: Math.round(m / 60) }) : t("side.ago.d", { n: Math.round(m / 1440) }); };
  const fs = folderState();
  if (!changed("side", [
    chatId,
    lang,
    creatingFolder,
    editingFolderId,
    Math.floor(Date.now() / 60000),
    fs,
    S.chats.map((c) => [c.id, c.title, c.status, c.turns?.at(-1)?.started || c.created, rev(c)]),
  ])) return;

  const pinnedSet = new Set(fs.pinnedChats || []);
  const chatRow = (c) => {
    const r = rev(c);

      ondragend: (e) => { dragChatId = null; e.currentTarget.classList.remove("dragging"); },

    },

      isPinned ? h("span", { class: "pin", "aria-hidden": "true" }, "★") : null,
      h("span", { class: "t" }, c.title),
      c.status === "running"

        role: "button",
        title: t("side.more"),
        onclick: (e) => { e.stopPropagation(); chatMenu(e.currentTarget, c); },
      }, "⋯"));

  const renderDateBuckets = (list) => {
    const { pinned, groups } = groupChatsByDate(list, { pinnedIds: fs.pinnedChats || [] });
    const out = [];
    if (pinned.length) {
      out.push(h("div", { class: "dgroup" }, dateGroupLabel("pinned")));
      for (const c of pinned) out.push(chatRow(c));
    }
    for (const g of groups) {
      out.push(h("div", { class: "dgroup" }, dateGroupLabel(g.key)));
      for (const c of g.chats) out.push(chatRow(c));
    }
    return out;

  const { folders, byFolder, unfiled } = partitionChatsByFolders(S.chats, fs);
  const children = [];

  children.push(h("div", { class: "sechead" },
    h("span", {}, t("side.folders")),
    h("button", { class: "add", type: "button", title: t("side.newFolder"), "aria-label": t("side.newFolder"), onclick: () => startCreateFolder() }, "+")));

  if (creatingFolder) {
    children.push(h("div", { class: "folder open" },
      h("div", { class: "fhead" },

        h("input", { id: "newfolderin", class: "fin", type: "text", maxlength: "80", placeholder: t("side.folderNamePlaceholder") }))));
  }

  for (const f of folders) {
    const list = byFolder[f.id] || [];
    const isOpen = !f.collapsed;
    const isEdit = editingFolderId === f.id;
    const dropProps = {
      ondragover: (e) => {
        if (!dragChatId && !e.dataTransfer?.types?.includes("text/plain")) return;
        e.preventDefault();
        e.currentTarget.classList.add("dragover");
      },
      ondragleave: (e) => {
        if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove("dragover");

      ondrop: (e) => {
        e.preventDefault();

        if (ch) moveChatToFolder(ch, f.id, f.name);

    const head = h("button", {
      class: "fhead",

    },
      h("span", { class: "fchev" }, "›"),
      h("span", { class: "fic" }, isOpen ? "📂" : "📁"),

  children.push(h("div", { class: "sechead" }, h("span", {}, t("side.chats"))));
  const unfiledDrop = h("div", {
    class: "chats-drop",
    ondragover: (e) => {

    },
    ondragleave: (e) => {
      if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove("dragover");
    },
    ondrop: (e) => {
      e.preventDefault();
      e.currentTarget.classList.remove("dragover");
      const id = dragChatId || e.dataTransfer?.getData("text/plain");
      dragChatId = null;
      const ch = S.chats.find((x) => x.id === id);
      if (ch) moveChatToFolder(ch, null);
    },
  }, S.chats.length
    ? (unfiled.length ? renderDateBuckets(unfiled) : [h("div", { class: "label" }, "—")])
    : [h("div", { class: "label" }, t("side.noTasks"))]);
  children.push(unfiledDrop);

  set($("#chats"), children);
}

// Fetch the export and save it as a file (a blob link works in the browser and in the app window).
async function exportChat(c, format) {
  try {
    const r = await fetch(`/api/export/${c.id}?format=${format}`);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || t("chat.exportFailed"));
    const name = (r.headers.get("content-disposition") || "").match(/filename="([^"]+)"/)?.[1] || `chat.${format}`;
    const url = URL.createObjectURL(await r.blob());
    const a = h("a", { href: url, download: name }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast(t("chat.exported", { name }));
  } catch (e) { toast(e.message, true); }
}

async function compactChatNow(c) {
  toast(t("chat.compacting"));
  try {
    await api(`compact/${c.id}`, {});
    await refresh();
    if (chatId === c.id) await pollChat();
    toast(t("chat.compacted"));
  } catch (e) { toast(e.message, true); }
}

function chatMenu(anchor, c) {
  const fs = folderState();
  const isPinned = (fs.pinnedChats || []).includes(c.id);
  const alreadyCompacted = !!(c.compaction && (c.compaction.throughTurn ?? 0) >= (c.turns?.length || 0) && !c.sessionId && !c.codexThread);
  const canCompact = c.status !== "running" && (c.turns?.length || 0) > 0 && !alreadyCompacted;
  popover(anchor,
    h("button", { onclick: () => { closePop(); folderApi({ action: "pinChat", chatId: c.id, pinned: !isPinned }); } }, isPinned ? t("chat.unpin") : t("chat.pin")),
    h("button", { onclick: (e) => { e.stopPropagation(); openMoveFolderMenu(anchor, c); } }, t("chat.moveToFolder")),
    h("button", { onclick: () => { closePop(); openDrawer("rename", c.id); } }, t("chat.rename")),
    h("button", { disabled: !canCompact, onclick: () => { closePop(); compactChatNow(c); } }, t("chat.compact")),
    h("button", { onclick: () => { closePop(); exportChat(c, "md"); } }, t("chat.exportMd")),
    h("button", { onclick: () => { closePop(); exportChat(c, "json"); } }, t("chat.exportJson")),
    h("div", { class: "sep" }),
    h("button", { class: "danger", style: "color:var(--bad)", onclick: () => { closePop(); openDrawer("delete", c.id); } }, t("chat.delete")));
}

// Turn a timeline event into a short human sentence.
function stepRow(it) {
  const short = (s, n = 90) => (s.length > n ? s.slice(0, n - 1) + "…" : s);
  const base = (p) => String(p || "").split("/").pop();
  const tidy = (c) => String(c).split(S.repo).join(".").replace(/^cd\s+("[^"]*"|\S+)\s*&&\s*/, "").replace(/^"(.*)"$/, "$1");
  let icon = "·", body;
  switch (it.kind) {
    case "read": icon = "📄"; body = [t("turn.step.read"), h("code", {}, base(it.text))]; break;
    case "edit": icon = "✎"; body = [t("turn.step.edit"), h("code", {}, base(it.text.replace(/^\w+ /, "")))]; break;
    case "search": icon = "🔍"; body = [t("turn.step.search"), h("code", {}, short(it.text.replace(/^(grep|glob) /, ""), 60))]; break;
    case "cmd": { const c = tidy(it.text); icon = "▶"; body = /unittest|pytest|npm test|go test|cargo test/.test(c) ? t("turn.step.ranTests") : [t("turn.step.ran"), h("code", {}, short(c, 70))]; break; }
    case "error":
      if (/requires approval|can't be checked|Parser skipped|permission|not allowed|denied/i.test(it.text)) { icon = "⦸"; body = t("turn.step.permDenied"); return h("div", { class: "stepi" }, h("span", { class: "gi" }, icon), h("span", {}, body)); }
      icon = "!"; body = short(tidy(it.text), 160); break;
    default: body = short(it.text, 120);
  }
  return h("div", { class: "stepi" + (it.kind === "error" ? " err" : "") }, h("span", { class: "gi" }, icon), h("span", {}, body));
}

function addItem(it) {
  const tb = turnBlock(it.turn ?? 0);
  if (it.kind === "user") { userContent(tb.user, it.text, it.images, it.mentions); return; }
  if (it.kind === "think") { tb.thinking.hidden = false; tb.thinkingText.append(h("div", {}, it.text), "\n\n"); return; }
  if (it.kind === "say") { tb.replies.append(richReply(it.text)); return; }
  if (it.kind === "handoff") {
    const mdl = modelName(curChat()?.turns?.[it.turn]?.model || "");
    const to = `${AGENT[it.to] || it.to}${mdl ? " " + mdl : ""}`;
    const from = AGENT[it.from] || it.from;
    const reason = translateReason(it.reason, lang).replace(new RegExp(`^${from}\\s+`, "i"), "");
    tb.replies.prepend(h("div", { class: "moved handoff" }, t("turn.handoff", { to, from, reason })));
    return;
  }
  if (it.kind === "notice") { tb.replies.append(h("div", { class: "moved notice" }, "\u26a0 " + translateNotice(it.text, lang))); return; }
  if (it.kind === "compact") {
    const label = it.text ? translateNotice(it.text, lang) : t("notice.compacted");
    const methodKey = it.method === "deterministic" ? "compact.method.deterministic" : "compact.method.haiku";
    tb.replies.append(h("details", { class: "compact-notice" },
      h("summary", {}, h("span", { class: "chev" }, "›"), h("span", {}, label), it.method ? h("span", { class: "c-badge" }, t(methodKey)) : null),
      it.summary ? h("div", { class: "compact-summary" }, md(it.summary)) : null));
    return;
  }
  if (["meta", "usage", "done"].includes(it.kind)) return; // technical noise stays out of the conversation
  if (it.kind === "delegate" && !tb.team.isConnected) { tb.replies.append(tb.team); return; }
  if (it.kind === "delegate" || (it.kind === "tool" && /^job /.test(it.text))) return; // shown as the team card instead
  tb.activity.hidden = false; tb.n++;
  tb.steps.append(stepRow(it));
}

function renderTurnChrome() {
  const c = curChat(); if (!c) return;
  const jobs = chatJobs();
  (c.turns || []).forEach((tr, i) => {
    const tb = turnBlock(i);
    if (!tb.user.firstChild) userContent(tb.user, tr.user, tr.images, tr.mentions);
    const ag = tr.agent || "claude";
    if (!tb.meta.firstChild || tb.meta.dataset.agent !== ag) {
      tb.meta.dataset.agent = ag;
      set(tb.meta, agentLogo(ag), h("b", {}, ag === "claude" ? modelName(tr.model || c.model) : `${AGENT[ag]} ${modelName(tr.model)}`), " · ", new Date(tr.started).toLocaleTimeString(uiLocale(), { hour: "2-digit", minute: "2-digit" }));
    }
    const running = c.status === "running" && i === c.turns.length - 1;
    const eff = tr.effort || "medium";
    tb.el.dataset.eff = eff;
    set(tb.label, running ? [h("span", { class: "spin" }), " ", tp("turn.workingSteps", tb.n)] : tp("turn.steps", tb.n));
    if (running) {
      tb.activity.hidden = false;
      tb.thinkWrap.hidden = false;
      if (changed("think" + chatId + i, [eff, lang])) set(tb.thinkWrap, thinkIndicator(eff));
    } else if (!tb.thinkWrap.hidden) {
      tb.thinkWrap.hidden = true;
      set(tb.thinkWrap);
    }
    const end = c.turns[i + 1]?.started;
    const mine = jobs.filter((j) => j.created >= tr.started && (!end || j.created < end));
    if (changed("team" + chatId + i, mine.map((j) => [j.id, j.status, j.finished, j.status === "running" ? Math.floor(Date.now() / 1000) : 0]))) set(tb.team, mine.length ? teamCard(mine) : null);
    if (mine.length && !tb.team.isConnected) tb.replies.append(tb.team);
    const done = !running && tr.finished;
    if (done && changed("cost" + chatId + i, [tr.cost, tr.tokens, tr.agent, mine.map((j) => [j.id, j.status, j.tokens])])) {
      const tok = mine.reduce((n, j) => n + (j.tokens ? (j.tokens.input || 0) + (j.tokens.output || 0) : 0), 0);
      const fmt = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n));
      const orchTok = tr.tokens ? (tr.tokens.input || 0) + (tr.tokens.output || 0) : 0, total = orchTok + tok, budget = appSettings?.settings?.turnBudget || 0;
      const byAgent = {}; for (const j of mine) { const k = `${AGENT[j.agent]} ${modelName(j.model)}`; byAgent[k] = (byAgent[k] || 0) + 1; }
      tb.cost.hidden = false;
      set(tb.cost, tr.agent === "codex"
        ? h("span", { title: t("turn.costCodexTitle") }, h("b", {}, `Codex ${modelName(tr.model)}`), tr.tokens ? t("turn.costCodexTokens", { n: fmt((tr.tokens.input || 0) + (tr.tokens.output || 0)) }) : "")
        : h("span", { title: t("turn.costApiTitle") }, h("b", {}, modelName(tr.model || c.model)), ` $${(tr.cost || 0).toFixed(2)}`),
        mine.length ? [h("span", {}, "·"), h("span", {}, Object.entries(byAgent).map(([k, n]) => (n > 1 ? `${k} ×${n}` : k)).join(", ")), tok ? h("span", { title: t("turn.workerTokensTitle") }, t("turn.workerTokens", { n: fmt(tok) })) : null] : null,
        total ? h("span", { title: budget ? t("turn.budgetTitle", { n: fmt(budget) }) : t("turn.turnTokensTitle") }, t("turn.tokensThisTurn", { n: fmt(total) }), budget ? t("turn.budgetPct", { pct: Math.round(total / budget * 100), budget: fmt(budget) }) : "") : null);
    }
  });
}

function teamCard(jobs) {
  const live = jobs.filter((j) => j.status === "running").length;
  const rows = [];
  const seenShootouts = new Set();
  for (const j of jobs) {
    if (!j.shootout) { rows.push(renderWorkerRow(j)); continue; }
    if (seenShootouts.has(j.shootout)) continue;
    seenShootouts.add(j.shootout);
    const groupJobs = jobs.filter((x) => x.shootout === j.shootout);
    const soId = j.shootout;
    rows.push(h("div", { class: "shootout-group" },
      h("div", { class: "shootout-group-h" },
        h("span", {}, h("span", { class: "shootout-chip", style: "margin-right:6px" }, t("shootout.groupHeader", { n: groupJobs.length }))),
        h("button", { class: "btn", onclick: () => openShootout(soId) }, t("shootout.compareBtn"))),
      groupJobs.map(renderWorkerRow)));
  }
  return h("div", { class: "team" },
    h("div", { class: "team-h" }, live ? h("span", { class: "spin" }) : h("span", { style: "color:var(--ok)" }, "✓"), live ? t("teamCard.working", { live, total: jobs.length }) : tp("teamCard.delegated", jobs.length)),
    rows);
}

let lastAppliedIds = [];
function undoableBannerJobs() {
  const valid = (id) => S.jobs.find((j) => j.id === id && j.status === "merged" && j.applySnapshot);
  const picked = lastAppliedIds.filter(valid);
  if (picked.length) return [...picked].reverse();
  const latest = chatJobs().filter((j) => j.status === "merged" && j.applySnapshot).sort((a, b) => String(b.finished || b.created).localeCompare(String(a.finished || a.created)))[0];

async function sendChatMessage(message, { withAttachments = false } = {}) {

  let force, explicit;

    try {
      const o = await api(`orchestrator?model=${encodeURIComponent($("#omodel").value)}&effort=${encodeURIComponent($("#oeffort").value)}`);
      const fromAg = o?.from || "claude";
      if (o && o.reason && o.agent && o.agent !== fromAg) {
        const choice = await askLimitChoice(o);
        if (!choice) return false;
        force = choice;
        if (choice === fromAg) explicit = true;

  sending = true; drawAttachments();

    if (withAttachments) {

    }
    if (!chatId) {
      chatId = c.id; chatFrom = 0; turns = []; chatGen++; chatBusy = false; set($("#col"));

async function loadWsDir(dir = "", { reset = false, append = false } = {}) {
  const cur = ws.tree.get(dir);

  const offset = append && cur?.nextCursor != null ? cur.nextCursor : 0;
  if (!reset && !append && cur?.loaded) return;
  const entry = { entries: append && cur ? [...cur.entries] : [], total: cur?.total || 0, nextCursor: cur?.nextCursor ?? null, loaded: !!cur?.loaded, loading: true, error: null };

  renderWorkspace();
  try {
    const r = await api(`files?dir=${encodeURIComponent(dir)}&offset=${offset}&limit=200`);
    const merged = append ? [...entry.entries, ...(r.entries || [])] : (r.entries || []);

  ws.fileData = null;
  renderWorkspace();

      set(body, renderWsFileBar(false), h("div", { class: "ws-scroll" }, h("div", { class: "ws-img-wrap" }, img, metaEl)));
      return;

    if (WS_MD_EXT.has(ext)) {

      if (ws.fileError) { set(body, renderWsFileBar(false), h("div", { class: "ws-empty" }, h("span", { class: "err" }, ws.fileError))); return; }
      const previewEl = md(ws.fileData?.content || "", { fileLinks: true });

const ORCH_ROWS = [
  { id: "opus", p: "claude", name: "Claude Opus", rec: true },

  { id: "haiku", p: "claude", name: "Claude Haiku" },

  { id: "hydrogen", p: "gemini", name: "Gemini Hydrogen" },
  { id: "argon", p: "gemini", name: "Gemini Argon" },

const PROVIDER_NAME = { claude: "Claude", codex: "ChatGPT Codex", gemini: "Gemini (Antigravity)", free: "Free & Local", local: "Local" };
const orchProvider = (m) => (["sol", "terra", "luna"].includes(m) ? "codex" : ["hydrogen", "argon"].includes(m) ? "gemini" : m === "free" ? "free" : m === "local" ? "local" : "claude");

let pickerLimits = null, pickerOrch = null, pickerOpen = null; // "model" | "team" | null

function limitInfo(provider) {
  const L = pickerLimits?.[provider];
  const five = L?.fiveHour?.pct, week = L?.week?.pct;
  if (five == null && week == null) return null;
  const useWeek = (week ?? -1) > (five ?? -1);
  return { pct: useWeek ? week : five, window: useWeek ? "limits.weekly" : "limits.fiveHour" };
}
const limitThreshold = () => appSettings?.settings?.limitThreshold ?? 90;
const nearLimit = (pct) => pct != null && pct >= Math.max(50, limitThreshold() - 15);
function limitLevel(provider, model) {
  if (appSettings?.settings?.freeMode || provider === "free" || provider === "local") return "ok";
  const movedByLimit = provider === "claude" && pickerOrch && pickerOrch.agent !== "claude" && !!pickerOrch.reason && (pickerOrch.isLimit ?? /limit|cooling|rate/i.test(pickerOrch.reason)) && orchProvider(model) === "claude";
  if (movedByLimit) return "at";

let seenBrowserNotices = null;
function browserNotifications(state) {
  if (!state.features?.browserNotifications) return;
  const notices = state.notifications || [];
  if (seenBrowserNotices === null) { seenBrowserNotices = new Set(notices.map(n => n.id)); return; }
  for (const n of notices) {
    if (seenBrowserNotices.has(n.id)) continue;
    seenBrowserNotices.add(n.id);
    if (!notifOn || Date.now() - n.at > 60000 || !("Notification" in window) || Notification.permission !== "granted") continue;
    try {
      // Storage deduplicates notices when the same project is open in multiple tabs.
      const key = `tw-notice:${state.repo}:${n.id}:${n.at}`;
      if (localStorage.getItem(key)) continue;
      localStorage.setItem(key, "1");
      const notice = new Notification(n.title, { body: [n.subtitle, n.message].filter(Boolean).join("\n"), tag: key });
      notice.onclick = () => { window.focus(); notice.close(); };
    } catch {}
  }
  seenBrowserNotices = new Set(notices.map(n => n.id));
}

document.addEventListener("keydown", (e) => {
  const ae = document.activeElement;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(ae?.tagName) || ae?.isContentEditable;
  if (e.key === "?" && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); if (keysOpen) closeShortcutsSheet(); else openShortcutsSheet(); return; }
  if (e.key === "Escape") {
    if (palOpen) { closePalette(); return; }
    if (keysOpen) { closeShortcutsSheet(); return; }
    closePop();
    closeDrawer();
  }
});
applyTheme();
$("#scrim").onclick = closeDrawer;
$("#menubtn").onclick = () => document.body.classList.toggle("side-open");

// ---------- update notice ----------
let ver = null;
let restarting = false;
async function restartNow() {
  if (restarting) return;
  restarting = true; renderVersion();
  try { await api("restart", {}); }
  catch (e) { restarting = false; renderVersion(); return toast(e.message === "busy" ? t("side.restartBusy") : e.message, true); }
  // The server exits after answering. The app respawns it when the page reloads; a browser tab just shows the error.
  setTimeout(() => location.reload(), 1500);
}
function renderVersion() {
  const r = $("#updready"), b = $("#newver");
  const ready = ver && ver.ready;
  r.hidden = !ready;
  if (ready) set(r, h("div", {}, t("side.updateReady", { version: ready.version })),
    h("button", { class: "btn primary", disabled: restarting ? true : null, onclick: restartNow }, restarting ? t("side.restarting") : t("side.restartNow")));
  if (!ver || ver.disabled || ready) { b.hidden = true; return; }
  b.hidden = !ver.updateAvailable || (ver.autoUpdate === "auto" && !["dev", "dmg", "windows"].includes(ver.source) && !ver.autoFailed);

  if (ver.updateAvailable) set(b, [t("side.newVersion", { version: ver.latest }), h("b", {}, t("side.update"))]);
}
async function checkVersion() {
  try { ver = await api("version"); } catch { return; }
  renderVersion();
  if (!ver.disabled && !ver.updateAvailable && !ver.latest) setTimeout(checkVersion, 4000); // first check runs in the background
}
$("#newver").onclick = (e) => {
  e.stopPropagation();
  if (ver?.source === "windows") {
    window.open("https://github.com/OnurSamett/tokenwise-studio/releases/latest/download/tokenwise-studio-windows.zip", "_blank");
    return;
  }
  const copy = h("button", { onclick: () => { navigator.clipboard?.writeText("tokenwise-studio update").then(() => { copy.textContent = t("side.copied"); setTimeout(() => (copy.textContent = t("side.copy")), 1500); }).catch(() => {}); } }, t("side.copy"));
  const pop = popover(e.currentTarget, h("div", {}, t("side.updateAvailable", { latest: ver.latest, current: ver.current })),
    h("div", { class: "cmd" }, h("code", {}, "tokenwise-studio update"), copy),
    h("div", { style: "font-size:12px;color:var(--dim)" }, t("side.updateRestarts")));
  pop.classList.add("upd");
};
checkVersion(); setInterval(checkVersion, 6 * 3600 * 1000);

newTask();
refresh().then(() => { if (S.chats[0]) openChat(S.chats[0].id); });
setInterval(() => refresh().then(pollChat).catch(() => {}), 1200);
renderLimits(); setInterval(renderLimits, 15000);
$("#omodel").addEventListener("change", () => { renderModelBtn(); renderLimits(); }); $("#oeffort").addEventListener("change", () => { renderModelBtn(); renderLimits(); });
window.__twLoaded = true;
</script>
