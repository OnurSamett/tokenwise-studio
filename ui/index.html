<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tokenwise studio</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0c; --surface: #111114; --surface-2: #17171b; --surface-3: #1e1e23;
    --border: #25252b; --border-strong: #34343c; --text: #ededf0; --muted: #8b8b94; --dim: #5c5c66;
    --accent: #8b8fff; --primary: #ededf0; --primary-hover: #d8d8df; --on-primary: #0a0a0c;
    --codex: #5ccfa8; --claude: #e8a07a; --gemini: #84a9ff;
    --ok: #57c785; --bad: #f07178; --merged: #b39dff;
    --codex-tint: rgb(92 207 168 / 10%); --claude-tint: rgb(232 160 122 / 10%); --gemini-tint: rgb(132 169 255 / 10%);
    --accent-tint: rgb(139 143 255 / 6%); --add-tint: rgb(87 199 133 / 10%); --del-tint: rgb(240 113 120 / 10%);
    --bubble: #1c3155; --bubble-border: #2e4974; --overlay-shadow: rgb(0 0 0 / 28%);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13.5px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button, select, input, textarea { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  textarea:focus, input:focus, select:focus { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  a { color: var(--accent); }
  code { font-family: var(--mono); font-size: 12px; background: var(--surface-3); padding: 2px 5px; border-radius: 4px; }
  header { display: flex; align-items: center; min-height: 60px; gap: 10px; padding: 0 24px; border-bottom: 1px solid var(--border); flex: none; }
  .brand-logo { width: 22px; height: 22px; border-radius: 6px; flex: none; }
  header h1 { font-size: 15px; letter-spacing: -.4px; margin: 0; font-weight: 650; white-space: nowrap; }
  header h1 span { color: var(--muted); font-weight: 500; }
  header .repo { color: var(--dim); font: 11px var(--mono); margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 232px minmax(0, 1fr) 0; }
  .app.with-job { grid-template-columns: 232px minmax(0, 1fr) minmax(340px, 36%); }
  nav { border-right: 1px solid var(--border); overflow: auto; padding: 20px 14px; display: flex; flex-direction: column; gap: 8px; }
  .newchat { background: var(--primary); color: var(--on-primary); border: 1px solid var(--primary); border-radius: 6px; padding: 9px 12px; font-weight: 600; text-align: center; }
  .newchat:hover, .btn.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
  nav h3 { font-size: 11px; font-weight: 500; color: var(--muted); margin: 22px 10px 4px; }
  .navitem { border: 1px solid transparent; border-radius: 8px; padding: 10px; display: flex; gap: 9px; align-items: flex-start; background: none; text-align: left; width: 100%; margin-bottom: 3px; }
  .navitem:hover { background: var(--surface); }
  .navitem.sel { background: var(--surface-2); border-color: var(--border); }
  .navitem .nt { flex: 1; min-width: 0; }
  .navtitle { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 500; }
  .navmeta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 3px 8px; margin-top: 4px; color: var(--muted); font-size: 10.5px; }
  time, .elapsed, .navmeta, .st { font-variant-numeric: tabular-nums; }
  .navmeta time { color: var(--dim); }
  .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--dim); }
  .dot.running { background: var(--accent); animation: pulse 1.8s ease-in-out infinite; }
  .dot.idle, .dot.done { background: var(--ok); } .dot.failed { background: var(--bad); } .dot.merged { background: var(--merged); }
  @keyframes pulse { 50% { opacity: .4; } }
  details.manual { margin-top: auto; border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  details.manual summary { cursor: pointer; color: var(--muted); font-size: 11px; }
  .manual form { display: grid; gap: 8px; margin-top: 12px; }
  select, input, textarea { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; width: 100%; }
  textarea { resize: vertical; }
  input[type=checkbox] { accent-color: var(--accent); }
  ::placeholder { color: var(--dim); opacity: 1; }
  .chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 16px; gap: 12px; }
  .chathead { flex: none; min-width: 0; max-height: 48%; overflow: auto; }
  .team { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px 16px; }
  .team-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 11px; color: var(--muted); }
  .team-label b { font-weight: 500; color: var(--text); }
  .team-summary { color: var(--dim); font-variant-numeric: tabular-nums; }
  .orchnode { position: relative; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 7px 12px; margin: 8px auto 0; width: fit-content; max-width: 100%; border-radius: 8px; background: linear-gradient(180deg, var(--surface-3), var(--surface-2)); border: 1px solid var(--accent); font-size: 11.5px; }
  .orchnode b { font-weight: 600; }
  .orchnode .dot { margin: 0; }
  .workers { position: relative; display: grid; grid-template-columns: repeat(var(--worker-count), minmax(0, 1fr)); gap: 10px; margin-top: 30px; }
  .workers::before { content: ""; position: absolute; top: -16px; left: calc(50% / var(--worker-count)); right: calc(50% / var(--worker-count)); border-top: 1px solid var(--border-strong); }
  .workers::after { content: ""; position: absolute; height: 15px; top: -30px; left: 50%; border-left: 1px solid var(--border-strong); }
  .wcard { position: relative; min-width: 0; border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 10px; font-size: 11px; text-align: left; }
  .wcard::before { content: ""; position: absolute; top: -16px; height: 15px; left: 50%; border-left: 1px solid var(--border-strong); }
  .wcard:hover, .wcard.sel { border-color: var(--border-strong); background: var(--surface-3); }
  .wcard.sel { border-color: var(--accent); }
  .worker-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .worker-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 40px; }
  .agent-icon { display: inline-flex; align-items: center; justify-content: center; width: 25px; height: 25px; border-radius: 50%; background: var(--surface-3); color: var(--muted); font: 600 12px var(--mono); flex: none; }
  .agent-icon.codex, .chip.codex { color: var(--codex); background: var(--codex-tint); }
  .agent-icon.claude, .chip.claude { color: var(--claude); background: var(--claude-tint); }
  .agent-icon.gemini, .chip.gemini { color: var(--gemini); background: var(--gemini-tint); }
  .wcard .wt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 9px; color: var(--muted); }
  .elapsed { color: var(--dim); font-size: 10px; margin-top: 5px; display: block; }
  .chathead h2 { margin: 14px 0 0; padding: 2px 4px 0; font-size: 13px; font-weight: 600; letter-spacing: -.2px; }
  .chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .chip { border-radius: 6px; padding: 1px 6px; font-weight: 500; border: 1px solid var(--border); background: var(--surface-2); font-size: 10px; line-height: 18px; }
  .st { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; font-size: 10px; border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; white-space: nowrap; color: var(--muted); }
  .st.running { color: var(--accent); } .st.running::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: pulse 1.8s ease-in-out infinite; }
  .wcard .st.running::before { background: var(--ok); }
  .st.done, .st.idle { color: var(--ok); } .st.failed { color: var(--bad); } .st.merged { color: var(--merged); } .st.discarded, .st.stopped { color: var(--dim); }
  .stream { flex: 1; min-height: 0; overflow: auto; padding: 4px 4px 20px; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  .welcome { max-width: 520px; margin: 9vh auto 0; padding: 0 18px; text-align: center; color: var(--muted); font-size: 13px; }
  .welcome-mark { display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; width: 40px; height: 40px; margin: 0 auto 20px; color: var(--text); font: 20px var(--mono); }
  .welcome h2 { color: var(--text); font-size: 22px; font-weight: 550; letter-spacing: -.7px; margin: 10px 0; }
  .welcome .ex { display: grid; gap: 8px; margin-top: 26px; text-align: left; }
  .welcome .ex button { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; text-align: left; color: var(--muted); font-size: 12px; }
  .welcome .ex button:hover { border-color: var(--border-strong); color: var(--text); }
  .msg-user { margin: 18px 0 22px auto; max-width: 82%; background: var(--bubble); border: 1px solid var(--bubble-border); border-radius: 12px 12px 4px 12px; padding: 11px 14px; white-space: pre-wrap; overflow-wrap: anywhere; width: fit-content; }
  .orchestrator-message { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0; }
  .orch-avatar { display: grid; place-items: center; width: 28px; height: 28px; flex: none; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font: 12px var(--mono); }
  .orch-content { min-width: 0; max-width: 90%; }
  .message-label { margin: 2px 0 7px; color: var(--muted); font-size: 11px; }
  .message-label b { color: var(--text); font-weight: 500; }
  .say { overflow-wrap: anywhere; }
  .orch-content .say { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .say p { margin: 0 0 8px; } .say ul { margin: 0 0 8px; padding-left: 20px; } .say > :last-child { margin-bottom: 0; }
  .ev { display: flex; gap: 10px; align-items: baseline; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 6px 0 6px 38px; min-width: 0; }
  .ev .ic { width: 14px; text-align: center; flex: none; color: var(--dim); font-size: 12px; }
  .ev .tx { font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; }
  .ev details { min-width: 0; width: 100%; }
  .ev.delegate { color: var(--text); } .ev.delegate .ic { color: var(--accent); }
  .ev.error, .ev.error .ic { color: var(--bad); } .ev.done .ic { color: var(--ok); } .ev.edit .ic { color: var(--codex); }
  .ev.think .tx { font-family: inherit; font-style: italic; }
  .ev details summary { cursor: pointer; list-style: none; } .ev details pre { margin: 8px 0 0; }
  .working { color: var(--muted); font-size: 11px; margin: 18px 0 8px 38px; display: flex; gap: 8px; align-items: center; }
  .spin { width: 11px; height: 11px; border: 1px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .composer { flex: none; }
  .inputbar { display: flex; align-items: flex-end; gap: 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); padding: 8px; }
  .inputbar:focus-within { border-color: var(--accent); }
  .composer textarea { min-height: 40px; max-height: 25vh; border: 0; background: transparent; border-radius: 6px; padding: 9px 5px; resize: vertical; outline: none; }
  .crow { display: flex; gap: 6px; margin-top: 9px; align-items: center; flex-wrap: wrap; }
  .crow select { width: auto; max-width: 160px; font-size: 10px; padding: 4px 7px; background: var(--surface-2); border-radius: 6px; }
  .crow .hint { color: var(--dim); font-size: 10px; margin-right: auto; }
  .btn { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px; font-size: 12px; }
  .btn:hover:not(:disabled) { border-color: var(--border-strong); background: var(--surface-3); }
  .btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); font-weight: 600; }
  #send { width: 36px; height: 36px; padding: 0; flex: none; font-size: 21px; line-height: 1; }
  .btn.red { color: var(--bad); }
  .err { color: var(--bad); font-size: 12px; } .err:not(:empty) { margin-top: 8px; }
  aside.job { border-left: 1px solid var(--border); display: none; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); }
  .with-job aside.job { display: flex; }
  .jobhead { padding: 20px; border-bottom: 1px solid var(--border); flex: none; max-height: 40%; overflow: auto; }
  .jobhead .top { display: flex; gap: 10px; align-items: center; }
  .jobhead .agent-icon { width: 34px; height: 34px; font-size: 15px; }
  .job-identity { flex: 1; min-width: 0; }
  .jobhead h2 { font-size: 16px; font-weight: 600; letter-spacing: -.4px; margin: 0; overflow-wrap: anywhere; }
  .job-subtitle { color: var(--muted); font-size: 11px; }
  .jobhead .chips { margin-top: 14px; }
  .x { background: none; border: 0; color: var(--muted); padding: 4px; font-size: 22px; line-height: 1; }
  .x:hover { color: var(--text); }
  .task { white-space: pre-wrap; color: var(--muted); border-top: 1px solid var(--border); padding: 12px 0 0; margin: 14px 0 0; font-size: 12px; max-height: 90px; overflow: auto; }
  .final { border-left: 2px solid var(--accent); padding: 8px 10px; background: var(--surface-2); border-radius: 0 6px 6px 0; white-space: pre-wrap; margin: 12px 0 0; font-size: 12px; max-height: 130px; overflow: auto; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 20px; gap: 20px; flex: none; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 2px 10px; font-size: 12px; color: var(--muted); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .jobbody { flex: 1; min-height: 0; overflow: auto; padding: 22px 20px; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  .step { position: relative; padding: 0 0 24px 29px; min-height: 44px; }
  .step::before { content: ""; position: absolute; top: 18px; bottom: 0; left: 8px; border-left: 1px solid var(--border-strong); }
  .step:last-child::before { display: none; }
  .step-marker { position: absolute; top: 2px; left: 0; display: grid; place-items: center; width: 18px; height: 18px; border: 1px solid var(--border-strong); border-radius: 50%; background: var(--surface-2); color: var(--muted); font: 10px var(--mono); z-index: 1; }
  .step.done .step-marker, .step.edit .step-marker { color: var(--ok); border-color: var(--ok); }
  .step.error .step-marker { color: var(--bad); border-color: var(--bad); }
  .step .ev { border: 0; padding: 0; margin: 0; }
  .step .ev .ic { display: none; }
  .step .say { font-size: 12px; }
  pre { margin: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font: 11px/1.7 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 50vh; overflow: auto; }
  .file { flex: none; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  .file > summary { display: flex; gap: 8px; align-items: center; padding: 10px; background: var(--surface-2); cursor: pointer; list-style: none; font: 11px var(--mono); }
  .file > summary input { width: auto; margin: 0; }
  .file .fp { flex: 1; overflow-wrap: anywhere; }
  .file pre { border: 0; border-radius: 0; max-height: none; padding: 6px 0; }
  .file pre span { padding: 0 10px; min-height: 19px; }
  .add { color: var(--ok); background: var(--add-tint); display: block; } .del { color: var(--bad); background: var(--del-tint); display: block; } .hunk { color: var(--accent); background: var(--accent-tint); display: block; } .ctx { display: block; }
  .jobbody.changes { padding-bottom: 0; display: flex; flex-direction: column; }
  .applybar { flex: none; position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center; padding: 14px 0; margin-top: auto; border-top: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; z-index: 2; }
  .applybar .primary { margin-left: auto; order: 2; }
  .applybar .muted { color: var(--dim); font-size: 10px; flex-basis: 100%; order: 3; overflow-wrap: anywhere; }
  .empty { color: var(--dim); text-align: center; padding: 30px 0; font-size: 12px; }
  @media (min-width: 721px) and (max-width: 1100px) {
    .app, .app.with-job { grid-template-columns: 190px minmax(0, 1fr); }
    .with-job aside.job { position: fixed; right: 0; top: 60px; bottom: 0; width: min(440px, 48vw); z-index: 5; box-shadow: -16px 0 32px var(--overlay-shadow); }
  }
  @media (max-width: 720px) {
    header { min-height: 54px; padding: 0 16px; } header .repo { max-width: 35%; font-size: 9px; }
    .app, .app.with-job { grid-template-columns: minmax(0, 1fr); }
    nav { display: none; }
    .chat { padding: 12px; gap: 10px; }
    .team { padding: 12px; } .team-summary { font-size: 10px; }
    .workers { display: flex; overflow-x: auto; padding-top: 16px; margin-top: 14px; gap: 8px; }
    .workers::before { left: 0; right: 0; top: 0; } .workers::after { top: -14px; height: 14px; }
    .wcard { flex: 1 0 165px; } .wcard::before { top: -17px; height: 16px; }
    .msg-user { max-width: 90%; } .orch-content { max-width: calc(100% - 38px); }
    .ev { margin-left: 0; } .crow .hint { font-size: 9px; } .crow select { max-width: 130px; }
    .with-job aside.job { position: fixed; inset: 0; z-index: 10; box-shadow: 0 0 32px var(--overlay-shadow); }
    .jobhead { padding: 16px; } .jobbody { padding: 20px 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .dot.running, .st.running::before, .spin { animation: none; } }
</style>
</head>
<body>
<header><img class="brand-logo" src="/logo.png" alt=""><h1>tokenwise <span>studio</span></h1><span class="repo" id="repo"></span></header>
<div class="app" id="app">
  <nav>
    <button class="newchat" id="newchat">+ New task</button>
    <h3>Recent chats</h3>
    <div id="chatlist"></div>
    <h3>Direct jobs</h3>
    <div id="directlist"></div>
    <details class="manual">
      <summary>Delegate a job directly</summary>
      <form id="mform">
        <select name="agent"><option>codex</option><option>claude</option><option>gemini</option></select>
        <input name="model" placeholder="model: sol / terra / haiku / sonnet">
        <select name="effort"><option>medium</option><option>low</option><option>high</option><option>xhigh</option></select>
        <textarea name="task" rows="3" placeholder="Self-contained task: files, what to do, when it's done"></textarea>
        <label style="font-size:12.5px;color:var(--muted)"><input type="checkbox" name="write" style="width:auto"> may edit files (own worktree)</label>
        <button class="btn primary">Start job</button>
        <div class="err" id="merr"></div>
      </form>
    </details>
  </nav>

  <main class="chat">
    <div class="chathead" id="chathead" hidden></div>
    <div class="stream" id="stream"></div>
    <div class="composer">
      <div class="inputbar">
        <textarea id="input" rows="1" aria-label="Message the orchestrator" placeholder="Message tokenwise studio…"></textarea>
        <button class="btn primary" id="send" aria-label="Send message" title="Send (⌘/Ctrl + Enter)">↑</button>
      </div>
      <div class="crow">
        <span class="hint" id="hint">⌘/Ctrl + Enter to send</span>
        <label class="hint" style="margin:0">Orchestrator</label>
        <select id="omodel" aria-label="Orchestrator model"><option value="opus">Claude Opus</option><option value="sonnet">Claude Sonnet</option><option value="haiku">Claude Haiku</option></select>
        <select id="oeffort" aria-label="Orchestrator effort"><option>medium</option><option>low</option><option>high</option><option>xhigh</option></select>
        <button class="btn red" id="stop" hidden>Stop</button>
      </div>
      <div class="err" id="cerr"></div>
    </div>
  </main>

  <aside class="job" id="jobpanel"></aside>
</div>

<script>
const $ = (s) => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : document.createTextNode(k));
  return el;
};
// replaceChildren() turns null into the text "null", so filter first.
Element.prototype.set = function (...kids) { this.replaceChildren(...kids.flat().filter((k) => k != null && k !== false)); return this; };
const api = async (p, body) => {
  const r = await fetch("/api/" + p, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json(); if (j.error) throw new Error(j.error); return j;
};
const since = (a, b) => { const s = Math.max(0, Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 1000)); return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60) + "s"; };
const ICON = { say: "·", think: "⋯", cmd: ">", edit: "✎", read: "≡", search: "⌕", delegate: "↳", tool: "⌘", usage: "Σ", done: "✓", error: "!", meta: "·" };

// Tiny, safe markdown: escape first, then a few inline/block patterns.
function md(text) {
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const out = []; let list = null, code = null;
  for (const line of String(text).split("\n")) {
    if (/^\s*```/.test(line)) {
      if (code) { out.push("<pre>" + esc(code.join("\n")) + "</pre>"); code = null; }
      else { if (list) { out.push("<ul>" + list.join("") + "</ul>"); list = null; } code = []; }
      continue;
    }
    if (code) { code.push(line); continue; }
    const ol = line.match(/^\s*\d+[.)] (.*)/);
    const li = ol || line.match(/^\s*[-*] (.*)/);
    if (li) { if (!list) { list = []; } list.push("<li>" + inline(li[1]) + "</li>"); continue; }
    if (list) { out.push("<ul>" + list.join("") + "</ul>"); list = null; }
    if (line.trim()) out.push("<p>" + inline(line) + "</p>");
  }
  if (code) out.push("<pre>" + esc(code.join("\n")) + "</pre>");
  if (list) out.push("<ul>" + list.join("") + "</ul>");
  const d = document.createElement("div"); d.className = "say"; d.innerHTML = out.join(""); return d;
}

function evRow(it, orchestrator = false) {
  if (it.kind === "say") {
    if (!orchestrator) return md(it.text);
    const c = S.chats.find((x) => x.id === chatId);
    return h("div", { class: "orchestrator-message" }, h("span", { class: "orch-avatar", "aria-hidden": "true" }, "✳"),
      h("div", { class: "orch-content" }, h("div", { class: "message-label" }, h("b", {}, "Orchestrator"), ` · Claude ${modelName(c?.model || $("#omodel").value)}`), md(it.text)));
  }
  if (it.kind === "user") return h("div", { class: "msg-user" }, it.text);
  const tx = h("span", { class: "tx" }, it.text);
  const body = it.detail ? h("details", {}, h("summary", {}, tx), h("pre", {}, it.detail)) : tx;
  return h("div", { class: "ev " + it.kind + (it.ok === false ? " error" : "") }, h("span", { class: "ic" }, ICON[it.kind] ?? "·"), body);
}

let S = { chats: [], jobs: [] }, chatId = null, jobId = null, jobTab = "timeline";
let chatFrom = 0, jobFrom = 0, lastJobStatus = null;

function chip(j) { return [h("span", { class: "chip " + j.agent }, j.agent), h("span", { class: "chip" }, `${j.model} · ${j.effort}`), j.write ? h("span", { class: "chip" }, "writes") : null]; }

const modelName = (model) => String(model).replace(/^claude[- /]?/i, "").replace(/[-_]/g, " ").replace(/\b(opus|sonnet|haiku)\b/gi, (m) => m[0].toUpperCase() + m.slice(1));
const shortModel = (model) => String(model || "default").match(/\b(sol|terra|luna|astra|haiku|sonnet|opus|pro|flash)\b/i)?.[0] || modelName(model || "default");
const relativeTime = (date) => {
  const seconds = Math.max(0, Math.floor((Date.now() - new Date(date)) / 1000));
  return seconds < 60 ? "Just now" : seconds < 3600 ? `${Math.floor(seconds / 60)}m ago` : seconds < 86400 ? `${Math.floor(seconds / 3600)}h ago` : `${Math.floor(seconds / 86400)}d ago`;
};
const statusName = (status) => ({ idle: "Done", done: "Done", running: "Running", failed: "Failed", stopped: "Stopped", discarded: "Discarded", merged: "Merged" }[status] || status);
const agentIcon = (agent) => h("span", { class: "agent-icon " + agent, "aria-hidden": "true" }, ({ codex: "‹›", claude: "✳", gemini: "✦" }[agent] || String(agent).slice(0, 1).toUpperCase()));
const statusPill = (status, elapsed = "") => h("span", { class: "st " + status }, `${["done", "idle", "merged"].includes(status) ? "✓ " : ""}${statusName(status)}${elapsed ? " · " + elapsed : ""}`);

function renderNav() {
  $("#chatlist").set(...(S.chats.length ? S.chats.map((c) => {
    const count = S.jobs.filter((j) => j.parent === c.id).length;
    return h("button", { class: "navitem" + (c.id === chatId ? " sel" : ""), title: `${c.model} · ${c.effort} · $${(c.cost || 0).toFixed(2)}`, onclick: () => openChat(c.id) },
      h("span", { class: "dot " + c.status }), h("span", { class: "nt" }, h("span", { class: "navtitle" }, c.title),
        h("span", { class: "navmeta" }, h("span", {}, `${statusName(c.status)}${c.status === "running" ? ` · ${count} agent${count === 1 ? "" : "s"}` : ""}`), h("time", { datetime: c.created, title: new Date(c.created).toLocaleString() }, relativeTime(c.created)))));
  }) : [h("div", { class: "empty", style: "padding:8px" }, "No chats yet")]));
  const direct = S.jobs.filter((j) => !j.parent).slice().reverse();
  $("#directlist").set(...(direct.length ? direct.map((j) => h("button", { class: "navitem" + (j.id === jobId ? " sel" : ""), onclick: () => openJob(j.id) },
    h("span", { class: "dot " + j.status }), h("span", { class: "nt" }, h("span", { class: "navtitle" }, j.title),
      h("span", { class: "navmeta" }, `${j.agent} ${j.model} · ${statusName(j.status)}`, h("time", { datetime: j.created }, relativeTime(j.created)))))) : [h("div", { class: "empty", style: "padding:8px" }, "None")]));
}

function renderChatHead() {
  const c = S.chats.find((x) => x.id === chatId);
  const head = $("#chathead");
  if (!c) { head.hidden = true; return; }
  head.hidden = false;
  const workers = S.jobs.filter((j) => j.parent === chatId);
  head.set(
    h("div", { class: "team" },
      h("div", { class: "team-label" }, h("b", {}, "Team"), h("span", { class: "team-summary" }, `${workers.length} worker${workers.length === 1 ? "" : "s"} · ${workers.filter((j) => j.status === "running").length} running`)),
      h("div", { class: "orchnode" }, h("span", { class: "dot " + c.status }), h("b", {}, "Orchestrator"), ` · Claude ${modelName(c.model)}`),
      workers.length ? h("div", { class: "workers", style: `--worker-count:${workers.length}` },
        ...workers.map((j) => h("button", { class: "wcard" + (j.id === jobId ? " sel" : ""), onclick: () => openJob(j.id) },
          h("div", { class: "worker-top" }, agentIcon(j.agent), h("span", { class: "worker-name", title: `${j.agent} ${j.model} · ${j.effort}${j.write ? " · writes" : ""}` }, `${j.agent} ${shortModel(j.model)}`), statusPill(j.status)),
          h("div", { class: "wt", title: j.title }, j.title), h("span", { class: "elapsed" }, since(j.created, j.finished))))) : null),
    h("h2", {}, c.title));
  const running = c.status === "running";
  $("#stop").hidden = !running; $("#send").disabled = running;
  $("#hint").textContent = running ? "Orchestrator is working…" : "⌘/Ctrl + Enter to send";
}

function welcome() {
  const ex = [
    "Fix the failing tests. Delegate each independent fix to codex sol as a write job, review the diffs and merge the good ones.",
    "Read every file in this repo and give me a short architecture overview. Use claude haiku workers for the reading.",
    "Add unit tests for the least-tested module. Let codex terra write them, then check they pass.",
  ];
  return h("div", { class: "welcome" }, h("div", { class: "welcome-mark", "aria-hidden": "true" }, "⌘"),
    h("h2", {}, "What should the team do?"),
    h("div", {}, "Your orchestrator (Claude) plans the work and hands pieces to Codex, Claude or Gemini workers. Each writing worker gets its own git worktree; you review every change before it lands."),
    h("div", { class: "ex" }, ...ex.map((t) => h("button", { onclick: () => { $("#input").value = t; $("#input").focus(); } }, t))));
}

async function pollChat() {
  if (!chatId) return;
  const r = await api(`chatlog/${chatId}?from=${chatFrom}`);
  const st = $("#stream");
  const atBottom = st.scrollTop + st.clientHeight >= st.scrollHeight - 40;
  $("#working")?.remove();
  for (const it of r.items) st.append(evRow(it, true));
  chatFrom = r.next;
  const c = S.chats.find((x) => x.id === chatId);
  if (c?.status === "running") st.append(h("div", { class: "working", id: "working" }, h("span", { class: "spin" }), "orchestrator working"));
  if (atBottom || r.items.length) st.scrollTop = st.scrollHeight;
}

function openChat(id) { chatId = id; chatFrom = 0; $("#stream").set(); renderNav(); renderChatHead(); pollChat(); }
function newChat() { chatId = null; chatFrom = 0; $("#stream").set(welcome()); renderNav(); renderChatHead(); $("#stop").hidden = true; $("#send").disabled = false; $("#input").focus(); }

async function send() {
  const message = $("#input").value.trim(); if (!message) return;
  $("#cerr").textContent = "";
  try {
    const c = await api("chat", { id: chatId, message, model: $("#omodel").value, effort: $("#oeffort").value });
    $("#input").value = "";
    if (!chatId) { chatId = c.id; chatFrom = 0; $("#stream").set(); }
    await refresh();
  } catch (e) { $("#cerr").textContent = e.message; }
}

// ---- job panel
function openJob(id) { jobId = id; jobFrom = 0; jobTab = "timeline"; lastJobStatus = null; $("#app").classList.add("with-job"); renderJob(true); renderNav(); renderChatHead(); }
function closeJob() { jobId = null; $("#app").classList.remove("with-job"); renderNav(); renderChatHead(); }

function renderJob(full) {
  const j = S.jobs.find((x) => x.id === jobId); if (!j) return;
  const p = $("#jobpanel");
  if (full || !$("#jobbody")) {
    p.set(h("div", { class: "jobhead", id: "jobhead" }), h("div", { class: "tabs" },
      ...["timeline", "changes"].filter((t) => t === "timeline" || j.write).map((t) => h("button", { class: t === jobTab ? "on" : "", onclick: () => { jobTab = t; jobFrom = 0; renderJob(true); } }, t === "timeline" ? "Timeline" : `Changes${j.files?.length ? ` (${j.files.length})` : ""}`))),
      h("div", { class: "jobbody" + (jobTab === "changes" ? " changes" : ""), id: "jobbody" }));
    if (jobTab === "changes") loadChanges(j);
  }
  $("#jobhead").set(
    h("div", { class: "top" }, agentIcon(j.agent), h("div", { class: "job-identity" }, h("h2", {}, `${j.agent} ${modelName(j.model)}`), h("div", { class: "job-subtitle" }, j.title)), h("button", { class: "x", onclick: closeJob, title: "Close", "aria-label": "Close job panel" }, "×")),
    h("div", { class: "chips" }, statusPill(j.status, since(j.created, j.finished)), ...chip(j), j.diffStat ? h("span", {}, j.diffStat.split("\n").pop()) : null),
    h("div", { class: "task" }, j.task),
    j.final ? h("div", { class: "final" }, j.final) : null,
    j.status === "running" ? h("div", { style: "margin-top:8px" }, h("button", { class: "btn red", onclick: () => act("discard", j.id) }, "Stop & discard")) : null);
  if (lastJobStatus && lastJobStatus !== j.status && jobTab === "changes") loadChanges(j);
  lastJobStatus = j.status;
}

async function pollJob() {
  if (!jobId || jobTab !== "timeline") return;
  const r = await api(`log/${jobId}?from=${jobFrom}`);
  const b = $("#jobbody"); if (!b) return;
  const atBottom = b.scrollTop + b.clientHeight >= b.scrollHeight - 40;
  if (!jobFrom && !r.items.length) b.set(h("div", { class: "empty" }, "Waiting for output…"));
  else if (!jobFrom) b.set();
  for (const it of r.items) b.append(h("div", { class: "step " + it.kind + (it.ok === false ? " error" : "") }, h("span", { class: "step-marker", "aria-hidden": "true" }, ICON[it.kind] || "·"), evRow(it)));
  jobFrom = r.next;
  if (atBottom && r.items.length) b.scrollTop = b.scrollHeight;
}

async function loadChanges(j) {
  const b = $("#jobbody"); if (!b) return;
  const { files } = await api(`diff/${j.id}`);
  if (!files.length) { b.set(h("div", { class: "empty" }, j.status === "running" ? "The worker is still running. Changes appear when it finishes." : "No changes.")); return; }
  const canApply = j.status === "done";
  const boxes = [];
  const bar = h("div", { class: "applybar" },
    h("button", { class: "btn primary", disabled: !canApply, onclick: () => act("merge", j.id, { files: boxes.filter((x) => x.checked).map((x) => x.value) }) }, "Apply selected"),
    h("button", { class: "btn red", disabled: !["done", "failed"].includes(j.status), onclick: () => act("discard", j.id) }, "Discard all"),
    h("span", { class: "muted" }, j.status === "merged" ? `applied: ${(j.applied || []).join(", ")}` : "Applied changes are staged, not committed."));
  const list = files.map((f) => {
    const cb = h("input", { type: "checkbox", value: f.path, checked: true, disabled: !canApply, onclick: (e) => e.stopPropagation() }); boxes.push(cb);
    const pre = h("pre", {}, ...f.patch.split("\n").filter((l) => !/^(diff --git|index |--- |\+\+\+ )/.test(l)).map((l) =>
      h("span", { class: l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : l.startsWith("@@") ? "hunk" : "ctx" }, l || " ")));
    return h("details", { class: "file", open: files.length <= 4 }, h("summary", {}, cb, h("span", { class: "fp" }, f.path), h("span", { style: "color:var(--ok)" }, "+" + f.add), h("span", { style: "color:var(--bad)" }, "−" + f.del)), pre);
  });
  b.set(...list, bar);
}

async function act(what, id, body = {}) {
  try { await api(`${what}/${id}`, body); await refresh(); renderJob(true); } catch (e) { alert(e.message); }
}

async function refresh() {
  const s = await api("state");
  S = s; $("#repo").textContent = s.repo;
  renderNav(); renderChatHead();
  if (jobId) renderJob(false);
}

$("#send").onclick = send;
$("#stop").onclick = () => chatId && api(`stop/${chatId}`, {}).then(refresh);
$("#newchat").onclick = newChat;
$("#input").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); } });
$("#mform").addEventListener("submit", async (e) => {
  e.preventDefault(); const fd = new FormData(e.target);
  const body = { agent: fd.get("agent"), effort: fd.get("effort"), task: fd.get("task"), write: !!fd.get("write") };
  if (fd.get("model")) body.model = fd.get("model");
  try { const j = await api("delegate", body); e.target.reset(); $("#merr").textContent = ""; await refresh(); openJob(j.id); } catch (err) { $("#merr").textContent = err.message; }
});

newChat();
refresh().then(() => { if (S.chats[0]) openChat(S.chats[0].id); });
setInterval(() => refresh().then(pollChat).then(pollJob).catch(() => {}), 1200);
</script>
</body>
</html>
