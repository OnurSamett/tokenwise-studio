<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tokenwise studio</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    --bg: #0a0a0c; --s1: #111114; --s2: #17171b; --s3: #1e1e23;
    --line: #232329; --line2: #303038;
    --text: #ededf0; --muted: #9a9aa3; --dim: #63636d;
    --accent: #8b8fff; --accent-soft: rgba(139,143,255,.14);
    --ok: #5cc98a; --bad: #f07178; --warn: #e8b86a;
    --codex: #5ccfa8; --claude: #e8a07a; --gemini: #84a9ff;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; display: flex; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  code { font: 13px var(--mono); background: var(--s3); padding: 1px 6px; border-radius: 5px; }
  pre { font: 13px/1.55 var(--mono); background: var(--s1); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow: auto; margin: 8px 0; }

  /* ---------- sidebar ---------- */
  .side { width: 248px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 14px; font-weight: 600; letter-spacing: -.2px; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; }
  .brand span { color: var(--muted); font-weight: 500; }
  .newtask { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--s2); font-weight: 550; margin-bottom: 14px; }
  .newtask:hover { background: var(--s3); }
  .label { font-size: 12px; color: var(--dim); padding: 6px 10px 4px; }
  .chats { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 1px; }
  .chatitem { text-align: left; background: none; border: 0; border-radius: 9px; padding: 8px 10px; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .chatitem:hover { background: var(--s1); color: var(--text); }
  .chatitem.on { background: var(--s2); color: var(--text); }
  .chatitem .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .sidefoot { border-top: 1px solid var(--line); padding-top: 10px; }
  .usage { padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 12px; }
  .usage .plan { display: flex; flex-direction: column; gap: 7px; }
  .usage .pname { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .usage .pname .badge { width: 18px; height: 18px; border-radius: 5px; font-size: 10.5px; }
  .meter { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; font-size: 12px; color: var(--dim); }
  .meter b { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .meter .track { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: var(--s3); overflow: hidden; }
  .meter .track i { display: block; height: 100%; border-radius: 4px; background: var(--muted); transition: width .4s; }
  .meter.hot .track i { background: var(--warn); } .meter.full .track i { background: var(--bad); }
  .usage .none { font-size: 12px; color: var(--dim); }
  .ghost { background: none; border: 0; color: var(--dim); font-size: 13px; padding: 6px 10px; border-radius: 8px; width: 100%; text-align: left; }
  .ghost:hover { color: var(--text); background: var(--s1); }

  /* ---------- main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); }
  .top h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.2px; }
  .top .sub { color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .menu-btn { display: none; background: none; border: 0; font-size: 20px; color: var(--muted); padding: 4px; }

  .scroll { flex: 1; overflow: auto; }
  .col { max-width: 760px; margin: 0 auto; padding: 28px 24px 40px; }

  .welcome { padding-top: 10vh; text-align: center; }
  .welcome img { width: 44px; height: 44px; border-radius: 12px; }
  .welcome h2 { font-size: 24px; letter-spacing: -.4px; margin: 18px 0 8px; font-weight: 650; }
  .welcome p { color: var(--muted); margin: 0 auto; max-width: 480px; }
  .examples { display: grid; gap: 10px; margin-top: 30px; text-align: left; }
  .examples button { background: var(--s1); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; color: var(--text); text-align: left; transition: border-color .15s, background .15s; }
  .examples button:hover { border-color: var(--line2); background: var(--s2); }
  .examples small { display: block; color: var(--dim); font-size: 12.5px; margin-top: 2px; }

  .turn { margin-bottom: 28px; }
  .you { display: flex; justify-content: flex-end; margin-bottom: 18px; }
  .you div { background: var(--s2); border: 1px solid var(--line2); border-radius: 16px 16px 4px 16px; padding: 10px 15px; max-width: 80%; white-space: pre-wrap; }
  .orch { display: flex; gap: 12px; align-items: flex-start; }
  .avatar { width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 15px; flex: none; margin-top: 1px; }
  .orch-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .say p { margin: 0 0 8px; } .say p:last-child { margin-bottom: 0; } .say ul, .say ol { margin: 0 0 8px; padding-left: 22px; } .say li { margin: 2px 0; }

  .activity { font-size: 13.5px; color: var(--dim); }
  .activity summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 8px; padding: 2px 0; user-select: none; }
  .activity summary::-webkit-details-marker { display: none; }
  .activity summary:hover { color: var(--muted); }
  .activity .chev { transition: transform .15s; display: inline-block; }
  .activity[open] .chev { transform: rotate(90deg); }
  .steps { margin: 8px 0 0 4px; border-left: 1px solid var(--line); padding-left: 14px; display: flex; flex-direction: column; gap: 3px; }
  .step { font: 12.5px/1.5 var(--mono); color: var(--dim); overflow-wrap: anywhere; }
  .step.err { color: var(--bad); }
  .spin { width: 12px; height: 12px; border: 1.5px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .team { background: var(--s1); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; }
  .team-h { display: flex; align-items: center; gap: 8px; padding: 8px 10px 6px; font-size: 13px; color: var(--muted); font-weight: 550; }
  .worker { display: grid; grid-template-columns: 32px minmax(0, 1fr) 120px 48px; gap: 12px; align-items: center; padding: 10px; border-radius: 9px; background: none; border: 0; text-align: left; width: 100%; }
  .worker:hover { background: var(--s2); }
  .badge { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .badge.codex { background: rgba(92,207,168,.12); color: var(--codex); }
  .badge.claude { background: rgba(232,160,122,.12); color: var(--claude); }
  .badge.gemini { background: rgba(132,169,255,.12); color: var(--gemini); }
  .w-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .w-task { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .effort { display: inline-flex; gap: 2px; } .effort i { width: 4px; height: 10px; border-radius: 2px; background: var(--line2); } .effort i.on { background: var(--muted); }
  .bar { height: 4px; border-radius: 4px; background: var(--s3); overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0; border-radius: 4px; }
  .bar.running i { width: 40%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .bar.done i, .bar.merged i { background: var(--ok); } .bar.failed i { background: var(--bad); } .bar.discarded i { background: var(--dim); }
  .w-time { font: 12.5px var(--mono); color: var(--dim); text-align: right; }
  .w-state { font-size: 12px; color: var(--dim); font-weight: 500; }
  .w-state.done { color: var(--ok); } .w-state.failed { color: var(--bad); } .w-state.merged { color: var(--accent); }

  /* review banner + composer */
  .dock { flex: none; padding: 0 24px 20px; }
  .dock-in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .banner { display: flex; align-items: center; gap: 12px; background: var(--s1); border: 1px solid var(--line2); border-radius: var(--radius); padding: 10px 10px 10px 16px; }
  .banner .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .banner .txt { flex: 1; font-size: 14px; } .banner .txt small { color: var(--dim); margin-left: 6px; }
  .btn { border-radius: 9px; padding: 8px 14px; font-weight: 550; font-size: 14px; border: 1px solid var(--line2); background: var(--s2); white-space: nowrap; flex: none; }
  .btn:hover { background: var(--s3); }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.primary:hover { background: #d6d6dc; }
  .btn:disabled { opacity: .4; cursor: default; }
  .composer { background: var(--s1); border: 1px solid var(--line2); border-radius: 16px; padding: 12px 12px 10px 16px; transition: border-color .15s; }
  .composer:focus-within { border-color: #44444f; }
  .composer textarea { width: 100%; background: none; border: 0; outline: 0; color: var(--text); font: inherit; resize: none; min-height: 26px; max-height: 220px; }
  .composer textarea::placeholder { color: var(--dim); }
  .crow { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .pill { appearance: none; background: var(--s2); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 26px 4px 11px; font-size: 12.5px; background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position: right 12px center, right 8px center; background-size: 4px 4px; background-repeat: no-repeat; }
  .crow .grow { flex: 1; }
  .err { color: var(--bad); font-size: 13px; }
  .send { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); display: grid; place-items: center; font-size: 16px; font-weight: 700; }
  .send:disabled { opacity: .3; cursor: default; }
  .stop { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line2); background: var(--s2); display: grid; place-items: center; }
  .stop i { width: 10px; height: 10px; background: var(--text); border-radius: 2px; }

  /* ---------- drawer ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--s1); border-left: 1px solid var(--line2); transform: translateX(100%); transition: transform .22s ease; z-index: 21; display: flex; flex-direction: column; box-shadow: -20px 0 50px rgba(0,0,0,.35); }
  body.drawer-open .scrim { opacity: 1; pointer-events: auto; }
  body.drawer-open .drawer { transform: none; }
  .d-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
  .d-head h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.2px; }
  .d-head .meta { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .x { margin-left: auto; background: none; border: 0; color: var(--dim); font-size: 22px; line-height: 1; padding: 0 2px; }
  .x:hover { color: var(--text); }
  .d-body { flex: 1; overflow: auto; padding: 18px 22px; }
  .d-foot { border-top: 1px solid var(--line); padding: 14px 22px; display: flex; gap: 10px; align-items: center; }
  .d-foot .note { color: var(--dim); font-size: 12.5px; margin-right: auto; }
  .section { margin-bottom: 22px; }
  .section h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 8px; font-weight: 600; }
  .answer { background: var(--s2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .muted { color: var(--muted); }
  .file { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; background: var(--bg); }
  .file > summary { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--s2); cursor: pointer; list-style: none; font-size: 13.5px; }
  .file > summary::-webkit-details-marker { display: none; }
  .file input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .file .fp { flex: 1; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .tag { font-size: 11.5px; color: var(--muted); background: var(--s3); border-radius: 6px; padding: 1px 7px; }
  .plus { color: var(--ok); font: 12.5px var(--mono); } .minus { color: var(--bad); font: 12.5px var(--mono); }
  .diff { font: 12.5px/1.6 var(--mono); overflow: auto; }
  .diff span { display: block; padding: 0 14px; white-space: pre; }
  .diff .a { background: rgba(92,201,138,.10); color: #a6e9c0; } .diff .d { background: rgba(240,113,120,.10); color: #f5b0b4; } .diff .h { color: var(--dim); padding-top: 6px; }
  .tech { margin-top: 6px; } .tech summary { cursor: pointer; color: var(--dim); font-size: 13px; }
  .modal-form { display: grid; gap: 10px; }
  .modal-form select, .modal-form input, .modal-form textarea { background: var(--bg); border: 1px solid var(--line2); color: var(--text); border-radius: 9px; padding: 9px 11px; font: inherit; width: 100%; }
  .modal-form .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .check { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
  .empty { color: var(--dim); text-align: center; padding: 40px 0; }

  @media (max-width: 760px) {
    .side { position: fixed; inset: 0 auto 0 0; z-index: 22; background: var(--bg); transform: translateX(-100%); transition: transform .2s; }
    body.side-open .side { transform: none; }
    .menu-btn { display: block; }
    .worker { grid-template-columns: 32px minmax(0, 1fr) 44px; } .worker .bar { display: none; }
    .col { padding: 20px 16px 30px; } .dock { padding: 0 16px 14px; } .top { padding: 0 16px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brand"><img src="/logo.png" alt="">tokenwise <span>studio</span></div>
  <button class="newtask" id="newtask"><span style="font-size:17px;line-height:1">+</span> New task</button>
  <div class="label">Recent</div>
  <div class="chats" id="chats"></div>
  <div class="sidefoot"><div class="label">Plan limits</div><div class="usage" id="usage"></div><button class="ghost" id="directbtn">Run a single worker…</button></div>
</aside>

<div class="main">
  <div class="top">
    <button class="menu-btn" id="menubtn" aria-label="Menu">☰</button>
    <h1 id="project">project</h1>
    <span class="sub" id="chattitle"></span>
  </div>
  <div class="scroll" id="scroll"><div class="col" id="col"></div></div>
  <div class="dock"><div class="dock-in">
    <div class="banner" id="banner" hidden></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask the team…"></textarea>
      <div class="crow">
        <select class="pill" id="omodel" title="Orchestrator model"><option value="opus">Opus</option><option value="sonnet">Sonnet</option><option value="haiku">Haiku</option></select>
        <select class="pill" id="oeffort" title="Orchestrator effort"><option value="medium">medium</option><option value="low">low</option><option value="high">high</option><option value="xhigh">xhigh</option></select>
        <span class="grow err" id="cerr"></span>
        <button class="stop" id="stop" title="Stop" hidden><i></i></button>
        <button class="send" id="send" title="Send (⌘↵)">↑</button>
      </div>
    </div>
  </div></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<script>
// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
};
const set = (el, ...kids) => el.replaceChildren(...kids.flat().filter((k) => k != null && k !== false));
const api = async (p, body) => {
  const r = await fetch("/api/" + p, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json(); if (j.error) throw new Error(j.error); return j;
};
const clock = (a, b) => { const s = Math.max(0, Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const AGENT = { codex: "Codex", claude: "Claude", gemini: "Gemini" };
const BADGE = { codex: "C", claude: "A", gemini: "G" };
const modelName = (m = "") => { const f = String(m).match(/(luna|terra|sol|astra|haiku|sonnet|opus|flash|pro)/i); return f ? f[1][0].toUpperCase() + f[1].slice(1).toLowerCase() : m; };
const effortBars = (e) => { const n = { low: 1, medium: 2, high: 3, xhigh: 4 }[e] || 2; return h("span", { class: "effort", title: `effort: ${e}` }, ...[1, 2, 3].map((i) => h("i", { class: i <= Math.min(n, 3) ? "on" : "" }))); };
const STATE = { running: "working", done: "ready", failed: "failed", merged: "applied", discarded: "discarded" };

// Tiny safe markdown: escape first, then inline code / bold, lists and fenced code.
function md(text) {
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const out = []; let list = null, code = null;
  const flush = () => { if (list) { out.push(`<${list.t}>` + list.items.join("") + `</${list.t}>`); list = null; } };
  for (const line of String(text).split("\n")) {
    if (/^\s*```/.test(line)) { if (code) { out.push("<pre>" + esc(code.join("\n")) + "</pre>"); code = null; } else { flush(); code = []; } continue; }
    if (code) { code.push(line); continue; }
    const ol = line.match(/^\s*\d+[.)] (.*)/), ul = line.match(/^\s*[-*] (.*)/);
    if (ol || ul) { const t = ol ? "ol" : "ul"; if (!list || list.t !== t) { flush(); list = { t, items: [] }; } list.items.push("<li>" + inline((ol || ul)[1]) + "</li>"); continue; }
    flush();
    if (line.trim()) out.push("<p>" + inline(line) + "</p>");
  }
  if (code) out.push("<pre>" + esc(code.join("\n")) + "</pre>");
  flush();
  const d = document.createElement("div"); d.className = "say"; d.innerHTML = out.join(""); return d;
}

// ---------- state ----------
let S = { repo: "", chats: [], jobs: [] };
let chatId = null, chatFrom = 0, turns = [], drawer = null;

const curChat = () => S.chats.find((c) => c.id === chatId);
const chatJobs = () => S.jobs.filter((j) => j.parent === chatId);
const pending = () => chatJobs().filter((j) => j.write && j.status === "done" && (j.files || []).length);

// ---------- sidebar ----------
const drawn = {};
const changed = (k, v) => { const j = JSON.stringify(v); if (drawn[k] === j) return false; drawn[k] = j; return true; };
function renderSide() {
  if (!changed("side", [chatId, S.chats.map((c) => [c.id, c.title, c.status])])) return;
  set($("#chats"), S.chats.length ? S.chats.map((c) => h("button", { class: "chatitem" + (c.id === chatId ? " on" : ""), onclick: () => { openChat(c.id); document.body.classList.remove("side-open"); } },
    h("span", { class: "t" }, c.title), c.status === "running" ? h("span", { class: "live" }) : null)) : h("div", { class: "label" }, "No tasks yet"));
}

// ---------- conversation ----------
function welcome() {
  const ex = [
    ["Fix the failing tests", "Each independent fix goes to a Codex worker; you review before anything lands."],
    ["Explain how this project is structured", "Cheap Claude Haiku workers do the reading, the orchestrator writes the summary."],
    ["Add tests for the least-tested module", "A Codex worker writes them in its own branch, then the tests are run."],
  ];
  return h("div", { class: "welcome" }, h("img", { src: "/logo.png", alt: "" }),
    h("h2", {}, "What should the team work on?"),
    h("p", {}, "Describe a task. The orchestrator plans it and hands pieces to Codex, Claude or Gemini workers. Every change waits for your review."),
    h("div", { class: "examples" }, ex.map(([t, s]) => h("button", { onclick: () => { $("#input").value = t; autosize(); $("#input").focus(); } }, t, h("small", {}, s)))));
}

// One DOM block per turn: user bubble, then orchestrator body (activity, team, replies).
function turnBlock(i) {
  if (turns[i]) return turns[i];
  const steps = h("div", { class: "steps" });
  const label = h("span", {});
  const activity = h("details", { class: "activity", hidden: true }, h("summary", {}, h("span", { class: "chev" }, "›"), label), steps);
  const team = h("div", {});
  const replies = h("div", { class: "orch-body-replies", style: "display:flex;flex-direction:column;gap:12px" });
  const user = h("div", { class: "you" });
  // The team card is inserted into the reply flow at the moment the first task is delegated.
  const el = h("div", { class: "turn" }, user, h("div", { class: "orch" }, h("div", { class: "avatar" }, "✦"), h("div", { class: "orch-body" }, activity, replies)));
  $("#col").append(el);
  return (turns[i] = { el, user, activity, label, steps, team, replies, n: 0 });
}

function addItem(it) {
  const t = turnBlock(it.turn ?? 0);
  if (it.kind === "user") { set(t.user, h("div", {}, it.text)); return; }
  if (it.kind === "say") { t.replies.append(md(it.text)); return; }
  if (["meta", "usage", "done", "think"].includes(it.kind)) return; // technical noise stays out of the conversation
  if (it.kind === "delegate" && !t.team.isConnected) { t.replies.append(t.team); return; }
  if (it.kind === "delegate" || (it.kind === "tool" && /^job /.test(it.text))) return; // shown as the team card instead
  t.activity.hidden = false; t.n++;
  t.steps.append(h("div", { class: "step" + (it.kind === "error" ? " err" : "") }, it.text));
}

function renderTurnChrome() {
  const c = curChat(); if (!c) return;
  const jobs = chatJobs();
  (c.turns || []).forEach((tr, i) => {
    const t = turnBlock(i);
    if (!t.user.firstChild) set(t.user, h("div", {}, tr.user));
    const running = c.status === "running" && i === c.turns.length - 1;
    set(t.label, running ? [h("span", { class: "spin" }), ` Working · ${t.n} step${t.n === 1 ? "" : "s"}`] : `${t.n} step${t.n === 1 ? "" : "s"}`);
    if (running) t.activity.hidden = false;
    const end = c.turns[i + 1]?.started;
    const mine = jobs.filter((j) => j.created >= tr.started && (!end || j.created < end));
    if (changed("team" + chatId + i, mine.map((j) => [j.id, j.status, j.finished, j.status === "running" ? Math.floor(Date.now() / 1000) : 0]))) set(t.team, mine.length ? teamCard(mine) : null);
    if (mine.length && !t.team.isConnected) t.replies.append(t.team);
  });
}

function teamCard(jobs) {
  const live = jobs.filter((j) => j.status === "running").length;
  return h("div", { class: "team" },
    h("div", { class: "team-h" }, live ? h("span", { class: "spin" }) : "✓", live ? `${live} of ${jobs.length} working` : `Delegated ${jobs.length} task${jobs.length > 1 ? "s" : ""}`),
    jobs.map((j) => h("button", { class: "worker", onclick: () => openJob(j.id) },
      h("span", { class: "badge " + j.agent }, BADGE[j.agent] || "?"),
      h("span", {}, h("div", { class: "w-name" }, `${AGENT[j.agent] || j.agent} · ${modelName(j.model)}`, effortBars(j.effort), h("span", { class: "w-state " + j.status }, STATE[j.status] || j.status)), h("div", { class: "w-task" }, j.title)),
      h("span", { class: "bar " + j.status }, h("i")),
      h("span", { class: "w-time" }, clock(j.created, j.finished)))));
}

function renderBanner() {
  const p = pending();
  const b = $("#banner");
  if (!changed("banner", p.map((j) => [j.id, j.files]))) return;
  if (!p.length) { b.hidden = true; return; }
  const files = p.reduce((n, j) => n + j.files.length, 0);
  b.hidden = false;
  set(b, h("span", { class: "dot" }), h("span", { class: "txt" }, `${files} file${files > 1 ? "s" : ""} ready for review`, h("small", {}, `from ${p.length} worker${p.length > 1 ? "s" : ""}`)), h("button", { class: "btn primary", onclick: openReview }, "Review"));
}

function renderTop() {
  $("#project").textContent = S.repo.split("/").filter(Boolean).pop() || "project";
  $("#project").title = S.repo;
  const c = curChat();
  $("#chattitle").textContent = c ? "· " + c.title : "";
  const running = c?.status === "running";
  $("#stop").hidden = !running; $("#send").hidden = running;
}

async function pollChat() {
  if (!chatId) return;
  const sc = $("#scroll"); const atBottom = sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 60;
  const r = await api(`chatlog/${chatId}?from=${chatFrom}`);
  r.items.forEach(addItem); chatFrom = r.next;
  renderTurnChrome();
  if (atBottom || r.items.length) sc.scrollTop = sc.scrollHeight;
}

function openChat(id) {
  chatId = id; chatFrom = 0; turns = []; set($("#col")); for (const k in drawn) delete drawn[k];
  renderSide(); renderTop(); renderBanner(); pollChat();
}
function newTask() { chatId = null; turns = []; for (const k in drawn) delete drawn[k]; set($("#col"), welcome()); renderSide(); renderTop(); renderBanner(); $("#input").focus(); }

async function send() {
  const message = $("#input").value.trim(); if (!message) return;
  $("#cerr").textContent = "";
  try {
    const c = await api("chat", { id: chatId, message, model: $("#omodel").value, effort: $("#oeffort").value });
    $("#input").value = ""; autosize();
    if (!chatId) { chatId = c.id; chatFrom = 0; turns = []; set($("#col")); }
    await refresh();
  } catch (e) { $("#cerr").textContent = e.message; }
}

// ---------- drawer ----------
function openDrawer(kind, id) { drawer = { kind, id }; document.body.classList.add("drawer-open"); renderDrawer(true); }
function closeDrawer() { drawer = null; document.body.classList.remove("drawer-open"); }
const openJob = (id) => openDrawer("job", id);
const openReview = () => openDrawer("review");
const openDirect = () => openDrawer("direct");

async function renderDrawer(full) {
  if (!drawer) return;
  const d = $("#drawer");
  if (drawer.kind === "job") {
    const j = S.jobs.find((x) => x.id === drawer.id); if (!j) return;
    if (!full && drawer.lastStatus === j.status) { const t = d.querySelector(".w-time"); if (t) t.textContent = clock(j.created, j.finished); return; }
    drawer.lastStatus = j.status;
    const log = await api(`log/${j.id}`);
    const steps = log.items.filter((i) => !["meta", "usage"].includes(i.kind));
    const files = j.write && j.status !== "running" ? (await api(`diff/${j.id}`)).files : [];
    set(d,
      h("div", { class: "d-head" }, h("span", { class: "badge " + j.agent }, BADGE[j.agent]),
        h("div", {}, h("h3", {}, j.title), h("div", { class: "meta" }, `${AGENT[j.agent]} · ${modelName(j.model)} · ${j.effort} effort · `, h("span", { class: "w-state " + j.status }, STATE[j.status]), " · ", h("span", { class: "w-time" }, clock(j.created, j.finished)))),
        h("button", { class: "x", onclick: closeDrawer, "aria-label": "Close" }, "×")),
      h("div", { class: "d-body" },
        j.final ? h("div", { class: "section" }, h("h4", {}, "Result"), h("div", { class: "answer" }, md(j.final))) : j.status === "running" ? h("div", { class: "section muted" }, h("span", { class: "spin" }), "  Working on it…") : null,
        files.length ? h("div", { class: "section" }, h("h4", {}, j.status === "merged" ? "Applied changes" : "Changes"), files.map((f) => fileBlock(f, null))) : null,
        h("div", { class: "section" }, h("h4", {}, "Task"), h("div", { class: "muted", style: "white-space:pre-wrap;font-size:14px" }, j.task)),
        h("details", { class: "tech" }, h("summary", {}, `Technical log · ${steps.length} events`), h("div", { class: "steps", style: "margin-top:10px" }, steps.map((s) => h("div", { class: "step" + (s.kind === "error" ? " err" : "") }, s.text))))),
      j.write && j.status === "done" && files.length ? h("div", { class: "d-foot" }, h("span", { class: "note" }, "Applied changes are staged, not committed."),
        h("button", { class: "btn", onclick: () => act("discard", j.id) }, "Discard"), h("button", { class: "btn primary", onclick: () => act("merge", j.id) }, "Apply")) :
      j.status === "running" ? h("div", { class: "d-foot" }, h("span", { class: "note" }, "The worker runs in its own git worktree."), h("button", { class: "btn", onclick: () => act("discard", j.id) }, "Stop")) : null);
    return;
  }
  if (drawer.kind === "review") {
    if (!full) return;
    const p = pending();
    const boxes = [];
    const blocks = [];
    for (const j of p) {
      const { files } = await api(`diff/${j.id}`);
      for (const f of files) {
        const cb = h("input", { type: "checkbox", checked: true, onclick: (e) => e.stopPropagation(), onchange: () => count() });
        cb.dataset.job = j.id; cb.dataset.path = f.path; boxes.push(cb);
        blocks.push(fileBlock(f, cb, `${AGENT[j.agent]} · ${modelName(j.model)}`));
      }
    }
    const applyBtn = h("button", { class: "btn primary", onclick: applySelected });
    const count = () => { const n = boxes.filter((b) => b.checked).length; applyBtn.textContent = `Apply ${n} file${n === 1 ? "" : "s"}`; applyBtn.disabled = !n; };
    async function applySelected() {
      applyBtn.disabled = true;
      try {
        for (const j of p) {
          const sel = boxes.filter((b) => b.dataset.job === j.id && b.checked).map((b) => b.dataset.path);
          if (sel.length) await api(`merge/${j.id}`, { files: sel }); else await api(`discard/${j.id}`, {});
        }
        closeDrawer(); await refresh();
      } catch (e) { alert(e.message); applyBtn.disabled = false; }
    }
    set(d,
      h("div", { class: "d-head" }, h("div", {}, h("h3", {}, "Review changes"), h("div", { class: "meta" }, `${boxes.length} file${boxes.length === 1 ? "" : "s"} from ${p.length} worker${p.length === 1 ? "" : "s"}`)), h("button", { class: "x", onclick: closeDrawer, "aria-label": "Close" }, "×")),
      h("div", { class: "d-body" }, blocks.length ? blocks : h("div", { class: "empty" }, "Nothing to review.")),
      blocks.length ? h("div", { class: "d-foot" }, h("span", { class: "note" }, "Unselected files are dropped. Applied changes are staged, not committed."),
        h("button", { class: "btn", onclick: async () => { for (const j of p) await api(`discard/${j.id}`, {}); closeDrawer(); refresh(); } }, "Discard all"), applyBtn) : null);
    count();
    return;
  }
  if (drawer.kind === "direct") {
    if (!full) return;
    const f = h("form", { class: "modal-form" },
      h("div", { class: "row" },
        h("select", { name: "agent" }, ["codex", "claude", "gemini"].map((a) => h("option", { value: a }, AGENT[a]))),
        h("input", { name: "model", placeholder: "Model (sol, haiku…)" }),
        h("select", { name: "effort" }, ["medium", "low", "high", "xhigh"].map((e) => h("option", {}, e)))),
      h("textarea", { name: "task", rows: 6, placeholder: "A self-contained task: which files, what to do, how to know it's done." }),
      h("label", { class: "check" }, h("input", { type: "checkbox", name: "write" }), "Allow it to edit files (in its own git worktree)"),
      h("div", { class: "err", id: "derr" }));
    set(d,
      h("div", { class: "d-head" }, h("div", {}, h("h3", {}, "Run a single worker"), h("div", { class: "meta" }, "Skip the orchestrator and hand one task straight to a worker.")), h("button", { class: "x", onclick: closeDrawer, "aria-label": "Close" }, "×")),
      h("div", { class: "d-body" }, f),
      h("div", { class: "d-foot" }, h("span", { class: "note" }), h("button", { class: "btn primary", onclick: async () => {
        const fd = new FormData(f); const body = { agent: fd.get("agent"), effort: fd.get("effort"), task: fd.get("task"), write: !!fd.get("write") };
        if (fd.get("model")) body.model = fd.get("model");
        try { const j = await api("delegate", body); await refresh(); openJob(j.id); } catch (e) { $("#derr").textContent = e.message; }
      } }, "Start")));
  }
}

function fileBlock(f, checkbox, tag) {
  const lines = f.patch.split("\n").filter((l) => !/^(diff --git|index |--- |\+\+\+ |new file mode|deleted file mode)/.test(l));
  return h("details", { class: "file", open: true },
    h("summary", {}, checkbox, h("span", { class: "fp" }, f.path), tag ? h("span", { class: "tag" }, tag) : null, h("span", { class: "plus" }, "+" + f.add), h("span", { class: "minus" }, "−" + f.del)),
    h("div", { class: "diff" }, lines.map((l) => h("span", { class: l.startsWith("+") ? "a" : l.startsWith("-") ? "d" : l.startsWith("@@") ? "h" : "" }, l.startsWith("@@") ? "⋯" : l || " "))));
}

async function act(what, id) {
  try { await api(`${what}/${id}`, {}); await refresh(); renderDrawer(true); } catch (e) { alert(e.message); }
}

// ---------- plan limits ----------
const until = (t) => { if (!t) return ""; const m = Math.round((t - Date.now()) / 60000); if (m <= 0) return "resetting"; if (m < 60) return `resets in ${m}m`; const hrs = Math.round(m / 60); return hrs < 48 ? `resets in ${hrs}h` : `resets in ${Math.round(hrs / 24)}d`; };
function meter(label, w) {
  if (!w) return null;
  return h("div", { class: "meter" + (w.pct >= 95 ? " full" : w.pct >= 80 ? " hot" : ""), title: until(w.resetsAt) },
    h("span", {}, label, " · ", until(w.resetsAt)), h("b", {}, w.pct + "%"), h("span", { class: "track" }, h("i", { style: `width:${Math.min(100, w.pct)}%` })));
}
async function renderLimits() {
  let L; try { L = await api("limits"); } catch { return; }
  const plan = (name, agent, d) => d ? h("div", { class: "plan" }, h("div", { class: "pname" }, h("span", { class: "badge " + agent }, BADGE[agent]), name), meter("5-hour", d.fiveHour), meter("Weekly", d.week)) : null;
  const blocks = [plan("Claude", "claude", L.claude), plan("ChatGPT Codex", "codex", L.codex)].filter(Boolean);
  set($("#usage"), blocks.length ? blocks : h("div", { class: "none" }, "Shows up after the first run."));
}

// ---------- loop ----------
async function refresh() {
  S = await api("state");
  renderSide(); renderTop(); renderBanner(); renderTurnChrome();
  if (drawer) renderDrawer(false);
}

function autosize() { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 220) + "px"; }
$("#input").addEventListener("input", autosize);
$("#input").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); } });
$("#send").onclick = send;
$("#stop").onclick = () => chatId && api(`stop/${chatId}`, {}).then(refresh);
$("#newtask").onclick = newTask;
$("#directbtn").onclick = openDirect;
$("#scrim").onclick = closeDrawer;
$("#menubtn").onclick = () => document.body.classList.toggle("side-open");
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

newTask();
refresh().then(() => { if (S.chats[0]) openChat(S.chats[0].id); });
setInterval(() => refresh().then(pollChat).catch(() => {}), 1200);
renderLimits(); setInterval(renderLimits, 15000);
</script>
