<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tokenwise studio</title>
<style>
  :root {
    --bg: #070d1f; --panel: #0d1630; --panel2: #121d3d; --panel3: #18244a; --line: #1f2c55; --line2: #2c3c78;
    --text: #e8ecf8; --muted: #8d98bd; --dim: #5d6890; --gold: #f2c14e; --blue: #5b8cff;
    --ok: #3ccf91; --bad: #ff6b6b; --merged: #8b7bff;
    --codex: #7fe3b8; --claude: #ffb38a; --gemini: #8fb4ff;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; }
  code { font-family: var(--mono); font-size: 12.5px; background: var(--panel2); padding: 1px 5px; border-radius: 4px; }

  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex: none; }
  .coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe08a, var(--gold) 60%, #b8862a); flex: none; }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; white-space: nowrap; }
  header .repo { color: var(--dim); font: 12px var(--mono); margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 220px minmax(0, 1fr) 0; }
  .app.with-job { grid-template-columns: 220px minmax(0, 1fr) minmax(340px, 42%); }

  /* sidebar */
  nav { border-right: 1px solid var(--line); overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .newchat { background: var(--gold); color: #1b1400; border: 0; border-radius: 9px; padding: 8px; font-weight: 650; cursor: pointer; }
  nav h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 12px 4px 2px; }
  .navitem { border: 1px solid transparent; border-radius: 8px; padding: 7px 9px; cursor: pointer; display: flex; gap: 8px; align-items: flex-start; background: none; text-align: left; width: 100%; }
  .navitem:hover { background: var(--panel); }
  .navitem.sel { background: var(--panel2); border-color: var(--line2); }
  .navitem .nt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 13px; }
  .navitem small { color: var(--dim); display: block; font-size: 11px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--dim); }
  .dot.running { background: var(--gold); box-shadow: 0 0 0 3px rgba(242,193,78,.2); animation: pulse 1.4s infinite; }
  .dot.idle, .dot.done { background: var(--ok); } .dot.failed { background: var(--bad); } .dot.merged { background: var(--merged); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(242,193,78,0); } }
  details.manual { margin-top: 10px; border: 1px dashed var(--line2); border-radius: 9px; padding: 8px; }
  details.manual summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .manual form { display: grid; gap: 6px; margin-top: 8px; }
  select, input, textarea { background: #050a18; color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font: inherit; width: 100%; }
  textarea { resize: vertical; }

  /* chat */
  .chat { display: flex; flex-direction: column; min-height: 0; }
  .chathead { padding: 12px 20px 10px; border-bottom: 1px solid var(--line); flex: none; }
  .chathead h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
  .workers { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
  .orchnode { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 9px; background: linear-gradient(135deg, #1d2a5a, var(--panel)); border: 1px solid var(--line2); font-size: 12.5px; }
  .orchnode b { color: var(--gold); }
  .arrow { color: var(--dim); align-self: center; }
  .wcard { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 6px 10px; cursor: pointer; max-width: 260px; font-size: 12.5px; text-align: left; }
  .wcard:hover { border-color: var(--line2); }
  .wcard.sel { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue) inset; }
  .wcard .wt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .chips { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
  .chip { border-radius: 999px; padding: 0 7px; font-weight: 600; border: 1px solid var(--line); background: var(--panel2); font-size: 11px; line-height: 18px; }
  .chip.codex { color: var(--codex); } .chip.claude { color: var(--claude); } .chip.gemini { color: var(--gemini); }
  .st { font-weight: 650; font-size: 11.5px; } .st.running { color: var(--gold); } .st.done, .st.idle { color: var(--ok); } .st.failed { color: var(--bad); } .st.merged { color: var(--merged); } .st.discarded, .st.stopped { color: var(--dim); }

  .stream { flex: 1; overflow: auto; padding: 16px 20px 24px; }
  .welcome { max-width: 560px; margin: 8vh auto 0; text-align: center; color: var(--muted); }
  .welcome h2 { color: var(--text); font-size: 20px; margin: 10px 0 6px; }
  .welcome .ex { display: grid; gap: 8px; margin-top: 18px; text-align: left; }
  .welcome .ex button { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; cursor: pointer; text-align: left; color: var(--text); }
  .welcome .ex button:hover { border-color: var(--line2); }
  .msg-user { margin: 14px 0 8px auto; max-width: 80%; background: var(--panel3); border: 1px solid var(--line2); border-radius: 12px 12px 4px 12px; padding: 8px 12px; white-space: pre-wrap; width: fit-content; }
  .say { margin: 8px 0; max-width: 90%; }
  .say p { margin: 0 0 6px; } .say ul { margin: 0 0 6px; padding-left: 20px; }
  .ev { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; color: var(--muted); padding: 2px 0; }
  .ev .ic { width: 16px; text-align: center; flex: none; color: var(--dim); }
  .ev .tx { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .ev.delegate { color: var(--text); } .ev.delegate .ic { color: var(--gold); }
  .ev.error { color: var(--bad); } .ev.error .ic { color: var(--bad); }
  .ev.done { color: var(--ok); } .ev.edit .ic { color: var(--codex); }
  .ev.think .tx { font-family: inherit; font-style: italic; }
  .ev details summary { cursor: pointer; list-style: none; } .ev details pre { margin: 4px 0 0; }
  .working { color: var(--gold); font-size: 12.5px; margin: 8px 0; display: flex; gap: 8px; align-items: center; }
  .spin { width: 12px; height: 12px; border: 2px solid var(--gold); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .composer { border-top: 1px solid var(--line); padding: 10px 20px 14px; flex: none; }
  .composer textarea { min-height: 52px; max-height: 30vh; border-radius: 10px; padding: 9px 12px; }
  .crow { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .crow select { width: auto; }
  .crow .hint { color: var(--dim); font-size: 12px; margin-right: auto; }
  .btn { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  .btn.gold { background: var(--gold); color: #1b1400; border-color: var(--gold); font-weight: 650; }
  .btn.red { color: var(--bad); }
  .btn:disabled { opacity: .4; cursor: default; }
  .err { color: var(--bad); font-size: 12px; }

  /* job panel */
  aside.job { border-left: 1px solid var(--line); display: none; flex-direction: column; min-height: 0; background: #0a1128; }
  .with-job aside.job { display: flex; }
  .jobhead { padding: 12px 16px; border-bottom: 1px solid var(--line); flex: none; }
  .jobhead .top { display: flex; gap: 8px; align-items: flex-start; }
  .jobhead h2 { font-size: 14.5px; margin: 0 0 6px; flex: 1; }
  .x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
  .task { white-space: pre-wrap; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; margin: 8px 0 0; font-size: 12.5px; max-height: 120px; overflow: auto; }
  .final { border-left: 3px solid var(--gold); padding: 6px 10px; background: var(--panel); border-radius: 0 8px 8px 0; white-space: pre-wrap; margin: 8px 0 0; font-size: 13px; max-height: 160px; overflow: auto; }
  .tabs { display: flex; gap: 4px; padding: 8px 16px 0; flex: none; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; cursor: pointer; color: var(--muted); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--blue); }
  .jobbody { flex: 1; overflow: auto; padding: 10px 16px 16px; }
  pre { margin: 0; background: #050a18; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 50vh; overflow: auto; }
  .file { border: 1px solid var(--line); border-radius: 9px; margin-bottom: 8px; overflow: hidden; }
  .file > summary { display: flex; gap: 8px; align-items: center; padding: 7px 10px; background: var(--panel); cursor: pointer; list-style: none; font: 12.5px var(--mono); }
  .file > summary input { width: auto; margin: 0; }
  .file .fp { flex: 1; overflow-wrap: anywhere; }
  .file pre { border: 0; border-radius: 0; max-height: none; }
  .add { color: #7fe3a0; background: rgba(60,207,145,.08); display: block; } .del { color: #ff8f8f; background: rgba(255,107,107,.08); display: block; } .hunk { color: var(--blue); display: block; } .ctx { display: block; }
  .applybar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .applybar .muted { color: var(--muted); font-size: 12px; margin-left: auto; }
  .empty { color: var(--dim); text-align: center; padding: 30px 0; }

  @media (max-width: 720px) {
    .app, .app.with-job { grid-template-columns: 1fr; }
    nav { display: none; }
    .with-job aside.job { position: fixed; inset: 0; z-index: 10; }
  }
</style>
</head>
<body>
<header><div class="coin"></div><h1>tokenwise studio</h1><span class="repo" id="repo"></span></header>
<div class="app" id="app">
  <nav>
    <button class="newchat" id="newchat">+ New task</button>
    <h3>Orchestrator chats</h3>
    <div id="chatlist"></div>
    <h3>Direct jobs</h3>
    <div id="directlist"></div>
    <details class="manual">
      <summary>Delegate a job directly</summary>
      <form id="mform">
        <select name="agent"><option>codex</option><option>claude</option><option>gemini</option></select>
        <input name="model" placeholder="model: sol / terra / haiku / sonnet">
        <select name="effort"><option>medium</option><option>low</option><option>high</option><option>xhigh</option></select>
        <textarea name="task" rows="3" placeholder="Self-contained task: files, what to do, when it's done"></textarea>
        <label style="font-size:12.5px;color:var(--muted)"><input type="checkbox" name="write" style="width:auto"> may edit files (own worktree)</label>
        <button class="btn gold">Start job</button>
        <div class="err" id="merr"></div>
      </form>
    </details>
  </nav>

  <main class="chat">
    <div class="chathead" id="chathead" hidden></div>
    <div class="stream" id="stream"></div>
    <div class="composer">
      <textarea id="input" placeholder="Describe the task. The orchestrator plans it and delegates pieces to Codex, Claude or Gemini workers."></textarea>
      <div class="crow">
        <span class="hint" id="hint">⌘/Ctrl + Enter to send</span>
        <label class="hint" style="margin:0">Orchestrator</label>
        <select id="omodel"><option value="opus">Claude Opus</option><option value="sonnet">Claude Sonnet</option><option value="haiku">Claude Haiku</option></select>
        <select id="oeffort"><option>medium</option><option>low</option><option>high</option><option>xhigh</option></select>
        <button class="btn red" id="stop" hidden>Stop</button>
        <button class="btn gold" id="send">Send</button>
      </div>
      <div class="err" id="cerr"></div>
    </div>
  </main>

  <aside class="job" id="jobpanel"></aside>
</div>

<script>
const $ = (s) => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : document.createTextNode(k));
  return el;
};
// replaceChildren() turns null into the text "null", so filter first.
Element.prototype.set = function (...kids) { this.replaceChildren(...kids.flat().filter((k) => k != null && k !== false)); return this; };
const api = async (p, body) => {
  const r = await fetch("/api/" + p, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json(); if (j.error) throw new Error(j.error); return j;
};
const since = (a, b) => { const s = Math.max(0, Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 1000)); return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60) + "s"; };
const ICON = { say: "", think: "💭", cmd: "▶", edit: "✎", read: "📄", search: "🔍", delegate: "↳", tool: "⚙", usage: "Σ", done: "✓", error: "⚠", meta: "·" };

// Tiny, safe markdown: escape first, then a few inline/block patterns.
function md(text) {
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const out = []; let list = null;
  for (const line of String(text).split("\n")) {
    const li = line.match(/^\s*[-*] (.*)/);
    if (li) { if (!list) { list = []; } list.push("<li>" + inline(li[1]) + "</li>"); continue; }
    if (list) { out.push("<ul>" + list.join("") + "</ul>"); list = null; }
    if (line.trim()) out.push("<p>" + inline(line) + "</p>");
  }
  if (list) out.push("<ul>" + list.join("") + "</ul>");
  const d = document.createElement("div"); d.className = "say"; d.innerHTML = out.join(""); return d;
}

function evRow(it) {
  if (it.kind === "say") return md(it.text);
  if (it.kind === "user") return h("div", { class: "msg-user" }, it.text);
  const tx = h("span", { class: "tx" }, it.text);
  const body = it.detail ? h("details", {}, h("summary", {}, tx), h("pre", {}, it.detail)) : tx;
  return h("div", { class: "ev " + it.kind + (it.ok === false ? " error" : "") }, h("span", { class: "ic" }, ICON[it.kind] ?? "·"), body);
}

let S = { chats: [], jobs: [] }, chatId = null, jobId = null, jobTab = "timeline";
let chatFrom = 0, jobFrom = 0, lastJobStatus = null;

function chip(j) { return [h("span", { class: "chip " + j.agent }, j.agent), h("span", { class: "chip" }, `${j.model} · ${j.effort}`), j.write ? h("span", { class: "chip" }, "writes") : null]; }

function renderNav() {
  $("#chatlist").set(...(S.chats.length ? S.chats.map((c) => h("button", { class: "navitem" + (c.id === chatId ? " sel" : ""), onclick: () => openChat(c.id) },
    h("span", { class: "dot " + c.status }), h("span", { class: "nt" }, c.title, h("small", {}, `${c.model} · ${c.effort} · $${(c.cost || 0).toFixed(2)}`)))) : [h("div", { class: "empty", style: "padding:8px" }, "No chats yet")]));
  const direct = S.jobs.filter((j) => !j.parent).slice().reverse();
  $("#directlist").set(...(direct.length ? direct.map((j) => h("button", { class: "navitem" + (j.id === jobId ? " sel" : ""), onclick: () => openJob(j.id) },
    h("span", { class: "dot " + j.status }), h("span", { class: "nt" }, j.title, h("small", {}, `${j.agent} ${j.model} · ${j.effort}`)))) : [h("div", { class: "empty", style: "padding:8px" }, "None")]));
}

function renderChatHead() {
  const c = S.chats.find((x) => x.id === chatId);
  const head = $("#chathead");
  if (!c) { head.hidden = true; return; }
  head.hidden = false;
  const workers = S.jobs.filter((j) => j.parent === chatId);
  head.set(
    h("h2", {}, c.title),
    h("div", { class: "workers" },
      h("div", { class: "orchnode" }, h("span", { class: "dot " + c.status, style: "margin:0" }), h("b", {}, "Orchestrator"), `claude ${c.model} · ${c.effort}`),
      workers.length ? h("span", { class: "arrow" }, "→") : null,
      ...workers.map((j) => h("button", { class: "wcard" + (j.id === jobId ? " sel" : ""), onclick: () => openJob(j.id) },
        h("div", { class: "chips" }, ...chip(j), h("span", { class: "st " + j.status }, j.status), since(j.created, j.finished)),
        h("div", { class: "wt" }, j.title)))));
  const running = c.status === "running";
  $("#stop").hidden = !running; $("#send").disabled = running;
  $("#hint").textContent = running ? "Orchestrator is working…" : "⌘/Ctrl + Enter to send";
}

function welcome() {
  const ex = [
    "Fix the failing tests. Delegate each independent fix to codex sol as a write job, review the diffs and merge the good ones.",
    "Read every file in this repo and give me a short architecture overview. Use claude haiku workers for the reading.",
    "Add unit tests for the least-tested module. Let codex terra write them, then check they pass.",
  ];
  return h("div", { class: "welcome" }, h("div", { class: "coin", style: "margin:0 auto;width:34px;height:34px" }),
    h("h2", {}, "What should the team do?"),
    h("div", {}, "Your orchestrator (Claude) plans the work and hands pieces to Codex, Claude or Gemini workers. Each writing worker gets its own git worktree; you review every change before it lands."),
    h("div", { class: "ex" }, ...ex.map((t) => h("button", { onclick: () => { $("#input").value = t; $("#input").focus(); } }, t))));
}

async function pollChat() {
  if (!chatId) return;
  const r = await api(`chatlog/${chatId}?from=${chatFrom}`);
  const st = $("#stream");
  const atBottom = st.scrollTop + st.clientHeight >= st.scrollHeight - 40;
  $("#working")?.remove();
  for (const it of r.items) st.append(evRow(it));
  chatFrom = r.next;
  const c = S.chats.find((x) => x.id === chatId);
  if (c?.status === "running") st.append(h("div", { class: "working", id: "working" }, h("span", { class: "spin" }), "orchestrator working"));
  if (atBottom || r.items.length) st.scrollTop = st.scrollHeight;
}

function openChat(id) { chatId = id; chatFrom = 0; $("#stream").set(); renderNav(); renderChatHead(); pollChat(); }
function newChat() { chatId = null; chatFrom = 0; $("#stream").set(welcome()); renderNav(); renderChatHead(); $("#stop").hidden = true; $("#send").disabled = false; $("#input").focus(); }

async function send() {
  const message = $("#input").value.trim(); if (!message) return;
  $("#cerr").textContent = "";
  try {
    const c = await api("chat", { id: chatId, message, model: $("#omodel").value, effort: $("#oeffort").value });
    $("#input").value = "";
    if (!chatId) { chatId = c.id; chatFrom = 0; $("#stream").set(); }
    await refresh();
  } catch (e) { $("#cerr").textContent = e.message; }
}

// ---- job panel
function openJob(id) { jobId = id; jobFrom = 0; jobTab = "timeline"; lastJobStatus = null; $("#app").classList.add("with-job"); renderJob(true); renderNav(); renderChatHead(); }
function closeJob() { jobId = null; $("#app").classList.remove("with-job"); renderNav(); renderChatHead(); }

function renderJob(full) {
  const j = S.jobs.find((x) => x.id === jobId); if (!j) return;
  const p = $("#jobpanel");
  if (full || !$("#jobbody")) {
    p.set(h("div", { class: "jobhead", id: "jobhead" }), h("div", { class: "tabs" },
      ...["timeline", "changes"].filter((t) => t === "timeline" || j.write).map((t) => h("button", { class: t === jobTab ? "on" : "", onclick: () => { jobTab = t; jobFrom = 0; renderJob(true); } }, t === "timeline" ? "Timeline" : `Changes${j.files?.length ? ` (${j.files.length})` : ""}`))),
      h("div", { class: "jobbody", id: "jobbody" }));
    if (jobTab === "changes") loadChanges(j);
  }
  $("#jobhead").set(
    h("div", { class: "top" }, h("h2", {}, j.title), h("button", { class: "x", onclick: closeJob, title: "Close" }, "×")),
    h("div", { class: "chips" }, ...chip(j), h("span", { class: "st " + j.status }, j.status), since(j.created, j.finished), j.diffStat ? h("span", {}, j.diffStat.split("\n").pop()) : null),
    h("div", { class: "task" }, j.task),
    j.final ? h("div", { class: "final" }, j.final) : null,
    j.status === "running" ? h("div", { style: "margin-top:8px" }, h("button", { class: "btn red", onclick: () => act("discard", j.id) }, "Stop & discard")) : null);
  if (lastJobStatus && lastJobStatus !== j.status && jobTab === "changes") loadChanges(j);
  lastJobStatus = j.status;
}

async function pollJob() {
  if (!jobId || jobTab !== "timeline") return;
  const r = await api(`log/${jobId}?from=${jobFrom}`);
  const b = $("#jobbody"); if (!b) return;
  const atBottom = b.scrollTop + b.clientHeight >= b.scrollHeight - 40;
  if (!jobFrom && !r.items.length) b.set(h("div", { class: "empty" }, "Waiting for output…"));
  else if (!jobFrom) b.set();
  for (const it of r.items) b.append(evRow(it));
  jobFrom = r.next;
  if (atBottom && r.items.length) b.scrollTop = b.scrollHeight;
}

async function loadChanges(j) {
  const b = $("#jobbody"); if (!b) return;
  const { files } = await api(`diff/${j.id}`);
  if (!files.length) { b.set(h("div", { class: "empty" }, j.status === "running" ? "The worker is still running. Changes appear when it finishes." : "No changes.")); return; }
  const canApply = j.status === "done";
  const boxes = [];
  const bar = h("div", { class: "applybar" },
    h("button", { class: "btn gold", disabled: !canApply, onclick: () => act("merge", j.id, { files: boxes.filter((x) => x.checked).map((x) => x.value) }) }, "Apply selected"),
    h("button", { class: "btn red", disabled: !["done", "failed"].includes(j.status), onclick: () => act("discard", j.id) }, "Discard all"),
    h("span", { class: "muted" }, j.status === "merged" ? `applied: ${(j.applied || []).join(", ")}` : "Applied changes are staged, not committed."));
  const list = files.map((f) => {
    const cb = h("input", { type: "checkbox", value: f.path, checked: true, disabled: !canApply, onclick: (e) => e.stopPropagation() }); boxes.push(cb);
    const pre = h("pre", {}, ...f.patch.split("\n").filter((l) => !/^(diff --git|index |--- |\+\+\+ )/.test(l)).map((l) =>
      h("span", { class: l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : l.startsWith("@@") ? "hunk" : "ctx" }, l || " ")));
    return h("details", { class: "file", open: files.length <= 4 }, h("summary", {}, cb, h("span", { class: "fp" }, f.path), h("span", { style: "color:var(--ok)" }, "+" + f.add), h("span", { style: "color:var(--bad)" }, "−" + f.del)), pre);
  });
  b.set(bar, ...list);
}

async function act(what, id, body = {}) {
  try { await api(`${what}/${id}`, body); await refresh(); renderJob(true); } catch (e) { alert(e.message); }
}

async function refresh() {
  const s = await api("state");
  S = s; $("#repo").textContent = s.repo;
  renderNav(); renderChatHead();
  if (jobId) renderJob(false);
}

$("#send").onclick = send;
$("#stop").onclick = () => chatId && api(`stop/${chatId}`, {}).then(refresh);
$("#newchat").onclick = newChat;
$("#input").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); } });
$("#mform").addEventListener("submit", async (e) => {
  e.preventDefault(); const fd = new FormData(e.target);
  const body = { agent: fd.get("agent"), effort: fd.get("effort"), task: fd.get("task"), write: !!fd.get("write") };
  if (fd.get("model")) body.model = fd.get("model");
  try { const j = await api("delegate", body); e.target.reset(); $("#merr").textContent = ""; await refresh(); openJob(j.id); } catch (err) { $("#merr").textContent = err.message; }
});

newChat();
refresh().then(() => { if (S.chats[0]) openChat(S.chats[0].id); });
setInterval(() => refresh().then(pollChat).then(pollJob).catch(() => {}), 1200);
</script>
</body>
