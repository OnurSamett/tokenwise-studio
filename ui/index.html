<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tokenwise studio</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    --bg: #0a0a0c; --s1: #111114; --s2: #17171b; --s3: #1e1e23;
    --line: #232329; --line2: #303038;
    --text: #ededf0; --muted: #9a9aa3; --dim: #63636d;
    --accent: #8b8fff; --accent-soft: rgba(139,143,255,.14);
    --ok: #5cc98a; --bad: #f07178; --warn: #e8b86a;
    --codex: #5ccfa8; --claude: #e8a07a; --gemini: #84a9ff;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --radius: 12px;
    --add-fg: #a6e9c0; --del-fg: #f5b0b4; --shadow: rgba(0,0,0,.4);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #fafafa; --s1: #ffffff; --s2: #f4f4f5; --s3: #ebebee; --line: #e5e5ea; --line2: #d6d6dd;
    --text: #18181b; --muted: #55555f; --dim: #8b8b95; --accent: #5b5fe0; --accent-soft: rgba(91,95,224,.10);
    --ok: #2f9e62; --bad: #d64550; --warn: #b7791f; --codex: #13906a; --claude: #c2633a; --gemini: #3a6fd8;
    --add-fg: #1f7a46; --del-fg: #b4232f; --shadow: rgba(20,20,40,.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      --bg: #fafafa; --s1: #ffffff; --s2: #f4f4f5; --s3: #ebebee; --line: #e5e5ea; --line2: #d6d6dd;
      --text: #18181b; --muted: #55555f; --dim: #8b8b95; --accent: #5b5fe0; --accent-soft: rgba(91,95,224,.10);
      --ok: #2f9e62; --bad: #d64550; --warn: #b7791f; --codex: #13906a; --claude: #c2633a; --gemini: #3a6fd8;
      --add-fg: #1f7a46; --del-fg: #b4232f; --shadow: rgba(20,20,40,.12);
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; display: flex; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  code { font: 13px var(--mono); background: var(--s3); padding: 1px 6px; border-radius: 5px; }
  pre { font: 13px/1.55 var(--mono); background: var(--s1); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow: auto; margin: 8px 0; }

  /* ---------- sidebar ---------- */
  .side { width: 248px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 14px; font-weight: 600; letter-spacing: -.2px; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; }
  .brand span { color: var(--muted); font-weight: 500; }
  .newtask { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--s2); font-weight: 550; margin-bottom: 14px; }
  .newtask:hover { background: var(--s3); }
  .label { font-size: 12px; color: var(--dim); padding: 6px 10px 4px; }
  .chats { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 1px; }
  .chatitem { text-align: left; background: none; border: 0; border-radius: 9px; padding: 8px 10px; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .chatitem:hover { background: var(--s1); color: var(--text); }
  .chatitem.on { background: var(--s2); color: var(--text); }
  .chatitem .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .sidefoot { border-top: 1px solid var(--line); padding-top: 10px; }
  .usage { padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 12px; }
  .usage .plan { display: flex; flex-direction: column; gap: 7px; }
  .usage .pname { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .usage .pname .badge { width: 18px; height: 18px; border-radius: 5px; font-size: 10.5px; }
  .meter { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; font-size: 12px; color: var(--dim); }
  .meter b { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .meter .track { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: var(--s3); overflow: hidden; }
  .meter .track i { display: block; height: 100%; border-radius: 4px; background: var(--muted); transition: width .4s; }
  .meter.hot .track i { background: var(--warn); } .meter.full .track i { background: var(--bad); }
  .usage .none { font-size: 12px; color: var(--dim); }
  .orchnow { display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; border-radius: 9px; background: var(--s1); border: 1px solid var(--line); }
  .orchnow .on { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--text); }
  .orchnow .on .plogo { width: 16px; height: 16px; }
  .orchnow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok, #3fb950); margin-left: auto; flex: none; }
  .orchnow.moved .dot { background: var(--warn); }
  .orchnow .why { font-size: 11.5px; color: var(--dim); line-height: 1.35; }
  .ghost { background: none; border: 0; color: var(--dim); font-size: 13px; padding: 6px 10px; border-radius: 8px; width: 100%; text-align: left; }
  .ghost:hover { color: var(--text); background: var(--s1); }

  /* ---------- main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); }
  .top h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.2px; }
  .top .sub { color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .menu-btn { display: none; background: none; border: 0; font-size: 20px; color: var(--muted); padding: 4px; }

  .scroll { flex: 1; overflow: auto; }
  .col { max-width: 760px; margin: 0 auto; padding: 28px 24px 40px; }

  .welcome { padding-top: 10vh; text-align: center; }
  .welcome img { width: 44px; height: 44px; border-radius: 12px; }
  .welcome h2 { font-size: 24px; letter-spacing: -.4px; margin: 18px 0 8px; font-weight: 650; }
  .welcome p { color: var(--muted); margin: 0 auto; max-width: 480px; }
  .examples { display: grid; gap: 10px; margin-top: 30px; text-align: left; }
  .examples button { background: var(--s1); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; color: var(--text); text-align: left; transition: border-color .15s, background .15s; }
  .examples button:hover { border-color: var(--line2); background: var(--s2); }
  .examples small { display: block; color: var(--dim); font-size: 12.5px; margin-top: 2px; }

  .turn { margin-bottom: 28px; }
  .you { display: flex; justify-content: flex-end; margin-bottom: 18px; }
  .you > div { background: var(--s2); border: 1px solid var(--line2); border-radius: 16px 16px 4px 16px; padding: 10px 15px; max-width: 80%; white-space: pre-wrap; }
  .orch { display: flex; gap: 12px; align-items: flex-start; }
  .avatar { width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 15px; flex: none; margin-top: 1px; }
  .orch-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .say p { margin: 0 0 8px; } .say p:last-child { margin-bottom: 0; } .say ul, .say ol { margin: 0 0 8px; padding-left: 22px; } .say li { margin: 2px 0; }
  .say a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .say a:hover { opacity: .88; }
  .say a.cite { display: inline-block; text-decoration: none; background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 0 5px; font: 600 12px/1.45 var(--mono); margin: 0 1px; }
  .say a.cite:hover { background: var(--accent); color: var(--bg); opacity: 1; }
  .sources { margin-top: 8px; padding: 8px 11px; border: 1px solid var(--line); background: var(--s1); border-radius: 10px; font-size: 12.5px; }
  .answer .sources { background: var(--bg); }
  .sources-h { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin-bottom: 5px; }
  .sources-list { display: flex; flex-direction: column; gap: 4px; }
  .source-item { display: flex; align-items: baseline; gap: 7px; min-width: 0; line-height: 1.4; }
  .source-num { font: 600 11.5px var(--mono); color: var(--accent); flex: none; }
  .source-link { color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .source-link:hover { color: var(--accent); text-decoration: underline; }
  .source-text { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .source-host { color: var(--dim); font: 11px var(--mono); flex: none; margin-left: auto; padding-left: 8px; }

  .activity { font-size: 13.5px; color: var(--dim); }
  .activity summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 8px; padding: 2px 0; user-select: none; }
  .activity summary::-webkit-details-marker { display: none; }
  .activity summary:hover { color: var(--muted); }
  .activity .chev { transition: transform .15s; display: inline-block; }
  .activity[open] .chev { transform: rotate(90deg); }
  .steps { margin: 8px 0 0 4px; border-left: 1px solid var(--line); padding-left: 14px; display: flex; flex-direction: column; gap: 3px; }
  .step { font: 12.5px/1.5 var(--mono); color: var(--dim); overflow-wrap: anywhere; }
  .step.err { color: var(--bad); }
  .spin { width: 12px; height: 12px; border: 1.5px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .team { background: var(--s1); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; }
  .team-h { display: flex; align-items: center; gap: 8px; padding: 8px 10px 6px; font-size: 13px; color: var(--muted); font-weight: 550; }
  .worker { display: grid; grid-template-columns: 32px minmax(0, 1fr) 120px 48px; gap: 12px; align-items: center; padding: 10px; border-radius: 9px; background: none; border: 0; text-align: left; width: 100%; }
  .worker:hover { background: var(--s2); }
  .badge { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .badge.codex { background: rgba(92,207,168,.12); color: var(--codex); }
  .badge.claude { background: rgba(232,160,122,.12); color: var(--claude); }
  .badge.gemini { background: rgba(132,169,255,.12); color: var(--gemini); }
  .badge.local { background: rgba(200,200,210,.12); color: var(--muted); }
  .badge.free { background: rgba(232,184,106,.12); color: var(--warn); }
  .moved { font-size: 11.5px; color: var(--dim); margin-top: 1px; }
  .w-state.moved { color: var(--dim); }
  .w-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .w-task { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .effort { display: inline-flex; gap: 2px; } .effort i { width: 4px; height: 10px; border-radius: 2px; background: var(--line2); } .effort i.on { background: var(--muted); }
  .bar { height: 4px; border-radius: 4px; background: var(--s3); overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0; border-radius: 4px; }
  .bar.running i { width: 40%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .bar.done i, .bar.merged i { background: var(--ok); } .bar.failed i { background: var(--bad); } .bar.discarded i, .bar.undone i { background: var(--dim); }
  .w-time { font: 12.5px var(--mono); color: var(--dim); text-align: right; }
  .w-state { font-size: 12px; color: var(--dim); font-weight: 500; }
  .w-state.done { color: var(--ok); } .w-state.failed { color: var(--bad); } .w-state.merged { color: var(--accent); } .w-state.undone { color: var(--muted); }

  /* review banner + composer */
  .dock { flex: none; padding: 0 24px 20px; }
  .dock-in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .banner { display: flex; flex-direction: column; gap: 8px; background: var(--s1); border: 1px solid var(--line2); border-radius: var(--radius); padding: 10px 10px 10px 16px; }
  .banner-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .banner .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .banner .txt { flex: 1; min-width: 160px; font-size: 14px; } .banner .txt small { color: var(--dim); margin-left: 6px; }
  .banner-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .banner-check { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .banner-check .crow2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .banner-check pre { margin: 0; max-height: 170px; overflow: auto; font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .nongit { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--s1); border: 1px solid var(--line2); border-radius: var(--radius); padding: 10px 10px 10px 14px; }
  .nongit .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .nongit .txt { flex: 1; min-width: 180px; font-size: 13.5px; color: var(--muted); }
  .btn { border-radius: 9px; padding: 8px 14px; font-weight: 550; font-size: 14px; border: 1px solid var(--line2); background: var(--s2); white-space: nowrap; flex: none; }
  .btn:hover { background: var(--s3); }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.primary:hover { opacity: .88; }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .4; cursor: default; }
  .composer { background: var(--s1); border: 1px solid var(--line2); border-radius: 16px; padding: 12px 12px 10px 16px; transition: border-color .15s; }
  .attachments { display: flex; gap: 8px; flex-wrap: wrap; }
  .attachments:not(:empty) { margin-bottom: 10px; }
  .attachment { position: relative; }
  .attachment img, .chat-images img { width: 88px; height: 72px; object-fit: cover; border: 1px solid var(--line2); border-radius: 9px; }
  .attachment button { position: absolute; right: -4px; top: -4px; border: 1px solid var(--line2); border-radius: 50%; background: var(--s2); color: var(--text); width: 22px; height: 22px; padding: 0; display: grid; place-items: center; font-size: 13px; line-height: 1; }
  .chat-images { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chat-images:first-child { margin-top: 0; }
  .composer.dragging { border-color: #818cf8; background: var(--s2); }
  .composer .attach:hover { color: #818cf8; background: var(--s2); }
  .thinking { color: var(--muted); font-size: 13px; margin: 8px 0 12px; }
  .thinking summary { cursor: pointer; }
  .thinking-text { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow-y: auto; margin-top: 8px; line-height: 1.6; }
  .composer:focus-within { border-color: #44444f; }
  .composer textarea { width: 100%; background: none; border: 0; outline: 0; color: var(--text); font: inherit; resize: none; min-height: 26px; max-height: 220px; }
  .composer textarea::placeholder { color: var(--dim); }
  .crow { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .pill { appearance: none; background: var(--s2); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 26px 4px 11px; font-size: 12.5px; background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position: right 12px center, right 8px center; background-size: 4px 4px; background-repeat: no-repeat; }
  .crow .grow { flex: 1; }
  .pillwrap { position: relative; display: inline-flex; align-items: center; }
  .pillwrap .pilllogo { position: absolute; left: 9px; width: 13px; height: 13px; pointer-events: none; }
  .pill.with-logo { padding-left: 27px; }
  .err { color: var(--bad); font-size: 13px; }
  .send { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); display: grid; place-items: center; font-size: 16px; font-weight: 700; }
  .send:disabled { opacity: .3; cursor: default; }
  .stop { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line2); background: var(--s2); display: grid; place-items: center; }
  .stop i { width: 10px; height: 10px; background: var(--text); border-radius: 2px; }

  /* ---------- drawer ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--s1); border-left: 1px solid var(--line2); transform: translateX(100%); transition: transform .22s ease; z-index: 21; display: flex; flex-direction: column; visibility: hidden; transition: transform .22s ease, visibility 0s .22s; }
  body.drawer-open .scrim { opacity: 1; pointer-events: auto; }
  body.drawer-open .drawer { transform: none; visibility: visible; transition: transform .22s ease; box-shadow: -20px 0 50px var(--shadow); }
  .d-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
  .d-head h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.2px; }
  .d-head .meta { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .x { margin-left: auto; background: none; border: 0; color: var(--dim); font-size: 22px; line-height: 1; padding: 0 2px; }
  .x:hover { color: var(--text); }
  .d-body { flex: 1; overflow: auto; padding: 18px 22px; }
  .d-foot { border-top: 1px solid var(--line); padding: 14px 22px; display: flex; gap: 10px; align-items: center; }
  .d-foot .note { color: var(--dim); font-size: 12.5px; margin-right: auto; }
  .section { margin-bottom: 22px; }
  .section h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 8px; font-weight: 600; }
  .answer { background: var(--s2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .muted { color: var(--muted); }
  .file { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; background: var(--bg); }
  .file > summary { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--s2); cursor: pointer; list-style: none; font-size: 13.5px; }
  .file > summary::-webkit-details-marker { display: none; }
  .file input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .file .fp { flex: 1; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .tag { font-size: 11.5px; color: var(--muted); background: var(--s3); border-radius: 6px; padding: 1px 7px; }
  .plus { color: var(--ok); font: 12.5px var(--mono); } .minus { color: var(--bad); font: 12.5px var(--mono); }
  .diff { font: 12.5px/1.6 var(--mono); overflow: auto; }
  .diff span { display: block; padding: 0 14px; white-space: pre; }
  .diff .a { background: rgba(92,201,138,.12); color: var(--add-fg); } .diff .d { background: rgba(240,113,120,.12); color: var(--del-fg); } .diff .h { color: var(--dim); padding-top: 6px; }
  .tech { margin-top: 6px; } .tech summary { cursor: pointer; color: var(--dim); font-size: 13px; }
  .modal-form { display: grid; gap: 10px; }
  .modal-form select, .modal-form input, .modal-form textarea { background: var(--bg); border: 1px solid var(--line2); color: var(--text); border-radius: 9px; padding: 9px 11px; font: inherit; width: 100%; }
  .modal-form .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .check { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
  .empty { color: var(--dim); text-align: center; padding: 40px 0; }

  .stepi { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--dim); }
  .stepi .gi { width: 14px; text-align: center; flex: none; font-size: 11px; }
  .stepi code { font-size: 12px; background: none; padding: 0; color: var(--muted); }
  .stepi.err { color: var(--bad); }
  .orch-meta { font-size: 12.5px; color: var(--dim); margin: 3px 0 -4px; }
  .orch-meta b { color: var(--muted); font-weight: 600; }
  .orch-meta .plogo { width: 13px; height: 13px; vertical-align: -2px; margin-right: 5px; }
  .moved.handoff { font-size: 12px; margin: 0 0 2px; }

  let icon = "·", body;

    case "edit": icon = "✎"; body = [t("turn.step.edit"), h("code", {}, base(it.text.replace(/^\w+ /, "")))]; break;
    case "search": icon = "🔍"; body = [t("turn.step.search"), h("code", {}, short(it.text.replace(/^(grep|glob) /, ""), 60))]; break;

async function sendChatMessage(message, { withAttachments = false } = {}) {
  const text = String(message || "").trim();
  const hasAtt = withAttachments && attachments.length > 0;
  if (sending || curChat()?.status === "running" || (!text && !hasAtt)) return false;
  let force, explicit;
  if (appSettings?.settings?.orchFallback === "ask") {
    try {
      const o = await api(`orchestrator?model=${encodeURIComponent($("#omodel").value)}&effort=${encodeURIComponent($("#oeffort").value)}`);
      if (o && o.agent === "codex") {
        const choice = await askLimitChoice(o);
        if (!choice) return false;
        force = choice;
        if (choice === "claude") explicit = true;
      }
    } catch {}
  }
  sending = true; drawAttachments();
  $("#cerr").textContent = "";
  try {
    const images = [];
    if (withAttachments) {
      for (const a of attachments) {
        if (!a.path) a.path = (await api("upload", { name: a.file.name, type: a.file.type, data: await readImage(a.file), chat: chatId })).path;
        images.push(a.path);

    const c = await api("chat", { id: chatId, message: text, images, model: $("#omodel").value, effort: $("#oeffort").value, ...(force ? { force } : {}), ...(explicit ? { explicit } : {}) });
    if (withAttachments) {

    }
    if (!chatId) { chatId = c.id; chatFrom = 0; turns = []; chatGen++; chatBusy = false; set($("#col")); }
    await refresh();
    return true;
  } catch (e) {
    $("#cerr").textContent = e.message;
    toast(e.message, true);
    return false;
  } finally { sending = false; drawAttachments(); }
}

// ---------- side workspace panel ----------
const WS_OPEN_KEY = "tw-ws-open";
const WS_WIDTH_KEY = "tw-ws-width";
const WS_MIN_W = 320;
const WS_IMAGE_EXT = new Set(["png", "jpg", "jpeg", "webp", "gif", "svg"]);
const WS_MD_EXT = new Set(["md", "markdown"]);
const wsExt = (p = "") => { const m = String(p).toLowerCase().match(/\.([a-z0-9]+)$/); return m ? m[1] : ""; };

const ws = {
  open: false,
  width: 460,
  tab: "files",
  treeOpen: true,
  expanded: new Set(),
  tree: new Map(),
  selectedPath: null,
  fileData: null,
  fileLoading: false,
  fileError: null,
  targetLine: 0,
  diffData: null,
  diffLoading: false,
  diffError: null,
  diffAt: 0,
  collapsedDiffs: new Set(),

try {
  ws.open = localStorage.getItem(WS_OPEN_KEY) === "1";
  const savedW = Number(localStorage.getItem(WS_WIDTH_KEY));
  if (Number.isFinite(savedW) && savedW >= WS_MIN_W) ws.width = savedW;

function clampWsWidth(w) {
  const sideW = window.innerWidth > 760 ? 248 : 0;
  const maxW = Math.max(WS_MIN_W, window.innerWidth - sideW - 320);
  return Math.max(WS_MIN_W, Math.min(Math.round(Number(w) || 460), maxW));
}

function saveWsPrefs() {
  try {
    localStorage.setItem(WS_OPEN_KEY, ws.open ? "1" : "0");
    localStorage.setItem(WS_WIDTH_KEY, String(Math.round(ws.width)));
  } catch {}
}

function applyWorkspaceChrome() {
  const panel = $("#ws-panel"), resizer = $("#ws-resizer"), toggle = $("#wstoggle");
  panel.hidden = !ws.open;
  resizer.hidden = !ws.open;
  panel.style.width = clampWsWidth(ws.width) + "px";
  toggle.classList.toggle("on", ws.open);
  toggle.setAttribute("aria-pressed", ws.open ? "true" : "false");
  for (const btn of $("#ws-tabs").querySelectorAll("button")) {
    const on = btn.dataset.tab === ws.tab;
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-selected", on ? "true" : "false");
  }
}

function resetWorkspace() {
  ws.expanded.clear();
  ws.tree.clear();
  ws.selectedPath = null;
  ws.fileData = null;
  ws.fileError = null;
  ws.fileLoading = false;
  ws.targetLine = 0;
  ws.diffData = null;
  ws.diffError = null;
  ws.diffLoading = false;
  ws.diffAt = 0;
  ws.collapsedDiffs.clear();
  if (ws.open) {
    if (ws.tab === "changes") loadWsDiff(true);
    else loadWsDir("", { reset: true });
  }
  renderWorkspace();
}

async function loadWsDir(dir = "", { reset = false, append = false } = {}) {
  const cur = ws.tree.get(dir);
  if (cur?.loading) return;
  const offset = append && cur?.nextCursor != null ? cur.nextCursor : 0;
  if (!reset && !append && cur?.loaded) return;
  const entry = { entries: append && cur ? [...cur.entries] : [], total: cur?.total || 0, nextCursor: cur?.nextCursor ?? null, loaded: !!cur?.loaded, loading: true, error: null };
  ws.tree.set(dir, entry);
  renderWorkspace();
  try {
    const r = await api(`files?dir=${encodeURIComponent(dir)}&offset=${offset}&limit=200`);
    const merged = append ? [...entry.entries, ...(r.entries || [])] : (r.entries || []);
    ws.tree.set(dir, { entries: merged, total: r.total || merged.length, nextCursor: r.nextCursor ?? null, loaded: true, loading: false, error: null });
  } catch (e) {
    ws.tree.set(dir, { ...entry, loading: false, error: e.message });
  }
  renderWorkspace();
}

async function loadWsFile(filePath, { line = 0 } = {}) {
  ws.selectedPath = filePath;
  ws.targetLine = Number(line) || 0;
  ws.fileError = null;
  ws.fileLoading = true;
  const ext = wsExt(filePath);
  if (WS_IMAGE_EXT.has(ext) && ext !== "svg") {
    ws.fileData = { path: filePath, ext, imageOnly: true };
    ws.fileLoading = false;
    renderWorkspace();
    return;
  }
  ws.fileData = null;
  renderWorkspace();
  try {
    ws.fileData = await api(`file?path=${encodeURIComponent(filePath)}`);
  } catch (e) {
    ws.fileError = e.message;
  } finally {
    ws.fileLoading = false;
  }
  renderWorkspace();
  if (ws.targetLine > 0) {
    requestAnimationFrame(() => {
      const el = $("#ws-body")?.querySelector(`.cv-line[data-line="${ws.targetLine}"]`);
      el?.scrollIntoView({ block: "center" });
    });
  }
}

async function loadWsDiff(force = false) {

  if (!force && ws.diffData && Date.now() - ws.diffAt < 2500) return;
  ws.diffLoading = true;
  if (!ws.diffData) renderWorkspace();
  try {
    ws.diffData = await api("worktree-diff");
    ws.diffError = null;
    ws.diffAt = Date.now();
  } catch (e) {
    ws.diffError = e.message;
  } finally {
    ws.diffLoading = false;
  }
  renderWorkspace();

function toggleWorkspace(force) {
  ws.open = force === undefined ? !ws.open : !!force;
  saveWsPrefs();
  applyWorkspaceChrome();
  if (ws.open) {
    if (ws.tab === "changes") loadWsDiff(true);
    else if (!ws.tree.get("")?.loaded) loadWsDir("");
  }
  renderWorkspace();
}

function setWsTab(tab) {
  ws.tab = tab;
  if (ws.open) {
    if (tab === "changes") loadWsDiff(true);

  applyWorkspaceChrome();
  renderWorkspace();

  if (!filePath) return;

    ws.open = true;
    saveWsPrefs();

  ws.tab = tab;
  applyWorkspaceChrome();
  if (!ws.tree.get("")?.loaded) loadWsDir("");

  if (node.error) return [h("div", { class: "err", style: "padding:6px 10px" }, node.error)];
  if (!node.entries.length && dir === "") return [h("div", { class: "ws-empty", style: "padding:18px" }, t("ws.emptyTree"))];
  const out = [];
  for (const item of node.entries) {
    if (item.type === "dir") {
      const open = ws.expanded.has(item.path);
      out.push(h("button", {
        type: "button",
        class: "ws-tree-item" + (open ? " open" : ""),
        style: `--depth:${depth}`,
        onclick: () => {
          if (ws.expanded.has(item.path)) ws.expanded.delete(item.path);

        type: "button",
        class: "ws-tree-item" + (ws.selectedPath === item.path ? " on" : ""),

      type: "button",
      class: "ws-tree-more",
      style: `--depth:${depth}`,
      disabled: node.loading ? true : null,
      onclick: () => loadWsDir(dir, { append: true }),

      if (ws.fileError) { set(body, renderWsFileBar(false), h("div", { class: "ws-empty" }, h("span", { class: "err" }, ws.fileError))); return; }
      const previewEl = md(ws.fileData?.content || "", { fileLinks: true });
      previewEl.classList.add("ws-md-preview");
      set(body,
        renderWsFileBar(false),
        ws.fileData?.truncated ? h("div", { class: "ws-note-bar" }, t("ws.truncated", { shown: kb(ws.fileData.bytesRead), total: kb(ws.fileData.size) })) : null,
        h("div", { class: "ws-scroll" }, previewEl));
      return;
    }
    // Non-image, non-markdown files fall back to the viewer.
    set(body,
      renderWsFileBar(false),
      h("div", { class: "ws-note-bar" }, ext ? t("ws.previewFallback", { ext }) : t("ws.previewFallbackPlain")),
      renderCodeViewer(ws.fileData));
  }
}

$("#wstoggle").onclick = () => toggleWorkspace();
$("#ws-close").onclick = () => toggleWorkspace(false);
$("#ws-refresh").onclick = () => {
  if (ws.tab === "changes") loadWsDiff(true);
  else {
    loadWsDir("", { reset: true });
    for (const dir of ws.expanded) loadWsDir(dir, { reset: true });
    if (ws.selectedPath) loadWsFile(ws.selectedPath, { line: ws.targetLine });
  }
};
for (const btn of $("#ws-tabs").querySelectorAll("button")) {
  btn.onclick = () => setWsTab(btn.dataset.tab);
}
document.addEventListener("click", (e) => {
  const ref = e.target.closest?.(".file-ref");
  if (!ref) return;
  const p = ref.dataset.file;
  const line = Number(ref.dataset.line) || 0;
  if (p) openWorkspaceFile(p, { line, tab: "files" });
});
$("#ws-resizer").addEventListener("mousedown", (e) => {
  e.preventDefault();
  const startX = e.clientX, startW = $("#ws-panel").getBoundingClientRect().width;
  document.body.classList.add("ws-resizing");
  const onMove = (ev) => {
    ws.width = clampWsWidth(startW + (startX - ev.clientX));
    $("#ws-panel").style.width = ws.width + "px";
  };
  const onUp = () => {
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    document.body.classList.remove("ws-resizing");
    saveWsPrefs();
  };
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
});
window.addEventListener("resize", () => {
  if (ws.open) $("#ws-panel").style.width = clampWsWidth(ws.width) + "px";
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && (e.key === "\\" || e.code === "Backslash")) {
    e.preventDefault();
    toggleWorkspace();
  }
});
applyWorkspaceChrome();
if (ws.open) {
  if (ws.tab === "changes") loadWsDiff(true);
  else loadWsDir("");
}

// ---------- loop ----------
async function refresh() {
  S = await api("state");
  await pollStaged();
  renderSide(); renderTop(); renderBanner(); renderTurnChrome();
  if (drawer) renderDrawer(false);
  if (ws.open && ws.tab === "changes") loadWsDiff(false);
}

function autosize() { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 220) + "px"; }
$("#input").addEventListener("input", autosize);
$("#input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("#input").addEventListener("input", updateSend);
$("#attach").onclick = () => { if (!sending) $("#imagefiles").click(); };
$("#studiobtn").onclick = () => openDrawer("studiolog");
$("#imagefiles").onchange = (e) => { addImages(e.target.files); e.target.value = ""; };
$(".composer").addEventListener("paste", (e) => {
  const files = [...(e.clipboardData?.items || [])].filter((i) => i.kind === "file").map((i) => i.getAsFile()).filter(Boolean);
  if (files.length) { e.preventDefault(); addImages(files); }
});
$(".composer").addEventListener("dragover", (e) => { e.preventDefault(); $(".composer").classList.add("dragging"); });
$(".composer").addEventListener("dragleave", (e) => { if (!e.currentTarget.contains(e.relatedTarget)) $(".composer").classList.remove("dragging"); });
$(".composer").addEventListener("drop", (e) => { e.preventDefault(); $(".composer").classList.remove("dragging"); addImages(e.dataTransfer.files); });
$("#send").disabled = true;
$("#jump").onclick = () => { const sc = $("#scroll"); sc.scrollTo({ top: sc.scrollHeight, behavior: "smooth" }); };
$("#scroll").addEventListener("scroll", () => { const sc = $("#scroll"); if (sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 60) $("#jump").hidden = true; });
document.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); newTask(); } });
$("#send").onclick = send;
$("#stop").onclick = () => chatId && api(`stop/${chatId}`, {}).then(refresh);
$("#newtask").onclick = newTask;
$("#directbtn").onclick = openDirect;
$("#settingsbtn").onclick = () => openDrawer("settings");
$("#keysbtn").onclick = () => openDrawer("keys");
$("#teambtn").onclick = () => openDrawer("team");
$("#modelsbtn").onclick = () => openDrawer("models");
$("#usagebtn").onclick = () => openDrawer("usage");
$("#themebtn").onclick = cycleTheme;
$("#notifbtn").onclick = toggleNotif;
$("#project").onclick = (e) => { e.stopPropagation(); projectMenu(); };
document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === "?" && !typing) { e.preventDefault(); openDrawer("keys"); }
  if (e.key === "Escape") closePop();
});
applyTheme();
$("#scrim").onclick = closeDrawer;
$("#menubtn").onclick = () => document.body.classList.toggle("side-open");
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

// ---------- update notice ----------
let ver = null;
let restarting = false;
async function restartNow() {
  if (restarting) return;
  restarting = true; renderVersion();
  try { await api("restart", {}); }
  catch (e) { restarting = false; renderVersion(); return toast(e.message === "busy" ? t("side.restartBusy") : e.message, true); }
  // The server exits after answering. The app respawns it when the page reloads; a browser tab just shows the error.
  setTimeout(() => location.reload(), 1500);
}
function renderVersion() {
  const r = $("#updready"), b = $("#newver");
  const ready = ver && ver.ready;
  r.hidden = !ready;
  if (ready) set(r, h("div", {}, t("side.updateReady", { version: ready.version })),
    h("button", { class: "btn primary", disabled: restarting ? true : null, onclick: restartNow }, restarting ? t("side.restarting") : t("side.restartNow")));
  if (!ver || ver.disabled || ready) { b.hidden = true; return; }
  b.hidden = !ver.updateAvailable || (ver.autoUpdate === "auto" && ver.source !== "dev" && !ver.autoFailed);

  if (ver.updateAvailable) set(b, [t("side.newVersion", { version: ver.latest }), h("b", {}, t("side.update"))]);
}
async function checkVersion() {
  try { ver = await api("version"); } catch { return; }
  renderVersion();
  if (!ver.disabled && !ver.updateAvailable && !ver.latest) setTimeout(checkVersion, 4000); // first check runs in the background
}
$("#newver").onclick = (e) => {
  e.stopPropagation();
  const copy = h("button", { onclick: () => { navigator.clipboard?.writeText("tokenwise-studio update").then(() => { copy.textContent = t("side.copied"); setTimeout(() => (copy.textContent = t("side.copy")), 1500); }).catch(() => {}); } }, t("side.copy"));
  const pop = popover(e.currentTarget, h("div", {}, t("side.updateAvailable", { latest: ver.latest, current: ver.current })),
    h("div", { class: "cmd" }, h("code", {}, "tokenwise-studio update"), copy),
    h("div", { style: "font-size:12px;color:var(--dim)" }, t("side.updateRestarts")));
  pop.classList.add("upd");
};
checkVersion(); setInterval(checkVersion, 6 * 3600 * 1000);

newTask();
refresh().then(() => { if (S.chats[0]) openChat(S.chats[0].id); });
setInterval(() => refresh().then(pollChat).catch(() => {}), 1200);
renderLimits(); setInterval(renderLimits, 15000);
$("#omodel").addEventListener("change", renderLimits); $("#oeffort").addEventListener("change", renderLimits);
window.__twLoaded = true;
</script>
