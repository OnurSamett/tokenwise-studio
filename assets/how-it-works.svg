<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>How tokenwise studio works</title>
  <rect width="960" height="400" rx="16" fill="#111114" stroke="#303038"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b8fff"/></marker></defs>
  <g fill="#17171b" stroke="#303038">
    <rect x="300" y="28" width="360" height="76" rx="12" stroke="#8b8fff"/>
    <rect x="40" y="188" width="240" height="96" rx="12"/>
    <rect x="360" y="188" width="240" height="96" rx="12"/>
    <rect x="680" y="188" width="240" height="96" rx="12"/>
    <rect x="200" y="324" width="560" height="52" rx="12" stroke="#5cc98a"/>
  </g>
  <g fill="#ededf0" font-size="18" font-weight="600" text-anchor="middle">
    <text x="480" y="62">Orchestrator (Claude Opus)</text>
    <text x="160" y="224">Codex Sol, medium</text>
    <text x="480" y="224">Claude Haiku, low</text>
    <text x="800" y="224">Gemini</text>
    <text x="480" y="356" fill="#5cc98a">You review the diff, then apply or discard</text>
  </g>
  <g fill="#9a9aa3" font-size="14" text-anchor="middle">
    <text x="480" y="86">plans, delegates, reads results</text>
    <text x="160" y="250">own git worktree</text>
    <text x="160" y="270">writes code</text>
    <text x="480" y="250">read-only answer</text>
    <text x="480" y="270">search, logs, summaries</text>
    <text x="800" y="250">own git worktree</text>
    <text x="800" y="270">writes code</text>
    
  </g>
  <g stroke="#8b8fff" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M400 104 L160 188"/><path d="M480 104 L480 188"/><path d="M560 104 L800 188"/>
  </g>
  <g stroke="#5cc98a" stroke-width="2" fill="none" stroke-dasharray="5 5">
    <path d="M160 284 L160 304 L300 324"/><path d="M800 284 L800 304 L660 324"/>
  </g>
</svg>
